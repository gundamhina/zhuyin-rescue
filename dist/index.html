<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#26647E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>注音救援隊</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #26647E; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-text-size-adjust: none; text-size-adjust: none; } /* 手機 Chrome 會自己把它覺得太小的字放大（font boosting），注音的排版會被弄亂，關掉 */
body { font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif; }
button { font-family: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
.hidden { display: none !important; }

/* 舞台：大小由 fitStage 依螢幕比例決定（橫 1200～1800×800、直 800×1100～1800），等比縮放置中 */
#stage { position: absolute; left: 0; top: 0; width: 1200px; height: 800px; --W: 1200px; --H: 800px; transform-origin: 0 0; overflow: hidden; }
/* 背景層鋪滿舞台：上面天空填色，1200×800 的場景圖由 layoutBg 縮放貼底 */
.bg { position: absolute; inset: 0; overflow: hidden; }
.bg-fill { position: absolute; inset: 0; }
.bg-fill.home { background: linear-gradient(#8DBCCB, #9EC9D2 60%, #A6CAD0); }
.bg-fill.scene { background: linear-gradient(#2E74C0, #3784CB 50%, #5E9ACD); }
.bg-art { position: absolute; left: 0; top: 0; width: 1200px; height: 800px; transform-origin: 0 0; }
/* 畫面元素放在 frame 裡：橫的置中 1200×800，直的就是整個舞台 */
.frame { position: absolute; left: calc((var(--W) - 1200px) / 2); top: 0; width: 1200px; height: 800px; }
#stage.portrait .frame { left: 0; width: 800px; height: var(--H); }
.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: block; }
.scene { position: absolute; left: 0; top: 0; }

/* 雲慢慢飄、太陽光慢慢轉 */
.cloud-wrap.c1 { animation: drift 38s linear infinite; }
.cloud-wrap.c2 { animation: drift 52s linear infinite reverse; }
.cloud-wrap.c3 { animation: drift 45s linear infinite; }
@keyframes drift { 0% { transform: translateX(-80px); } 100% { transform: translateX(80px); } }
.sun-rays { transform-origin: 1020px 130px; animation: spin 90s linear infinite; }
.bg-art .sun-rays { transform-origin: 1060px 90px; }
.bg-art .scene .sun-rays { transform-origin: 1020px 130px; }
@keyframes spin { to { transform: rotate(360deg); } }
.waves .w1 { animation: wave 6s ease-in-out infinite; }
.waves .w2 { animation: wave 7.5s ease-in-out infinite reverse; }
.waves .w3 { animation: wave 9s ease-in-out infinite; }
@keyframes wave { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-70px); } }
.fish { animation: swim 14s ease-in-out infinite; }
@keyframes swim { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-120px); } }

/* 齒輪 */
.gear { position: absolute; right: 18px; top: 14px; width: 56px; height: 56px; border-radius: 50%; background: rgba(27,43,75,0.28); display: flex; align-items: center; justify-content: center; }
.gear:active { background: rgba(27,43,75,0.6); }
.gear-hint { position: absolute; right: 84px; top: 22px; background: #1B2B4B; color: #fff; font-size: 22px; padding: 8px 16px; border-radius: 12px; white-space: nowrap; pointer-events: none; }

/* 大按鈕共用：厚底陰影、按下去會沉 */
.chunky { border-radius: 32px; background: #fff; border: 6px solid #fff; box-shadow: 0 12px 0 #A9BFCF, 0 18px 30px rgba(20,60,110,0.18); transition: transform .1s, box-shadow .1s; }
.chunky:active { transform: translateY(8px); box-shadow: 0 4px 0 #A9BFCF, 0 8px 16px rgba(20,60,110,0.18); }

/* ---- 選人 ---- */
.profiles { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 44px; flex-wrap: wrap; padding: 60px 100px 120px; }
.profile-card { width: 250px; height: 330px; border-radius: 36px; background: #fff; border: 6px solid #fff; box-shadow: 0 12px 0 #A9BFCF, 0 18px 30px rgba(20,60,110,0.18); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; transition: transform .1s, box-shadow .1s; }
.profile-card:active { transform: translateY(8px); box-shadow: 0 4px 0 #A9BFCF; }
.profile-avatar { width: 200px; height: 200px; border-radius: 50%; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.profile-avatar .dog { width: 170px; height: 196px; margin-bottom: -10px; }
.profile-avatar .rod { display: none; }
.profile-name { font-size: 40px; font-weight: 900; color: #2B3A4A; }
.profile-card.add { background: rgba(255,255,255,0.4); border: 6px dashed rgba(255,255,255,0.95); box-shadow: none; }
.profile-card.add:active { transform: scale(0.96); }
.profile-plus { font-size: 130px; color: #fff; font-weight: 900; text-shadow: 0 4px 0 rgba(20,60,110,0.2); }
.profile-form { position: absolute; inset: 0; background: rgba(27,43,75,0.5); display: flex; align-items: center; justify-content: center; }
.profile-form-box { background: #fff; border-radius: 32px; padding: 40px; display: flex; flex-direction: column; gap: 26px; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
.color-pick { display: flex; gap: 16px; }
.color-dot { width: 60px; height: 60px; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 0 0 3px #E3ECF5; }
.color-dot.on { box-shadow: 0 0 0 5px #1B2B4B; }
#profile-name { font-size: 40px; padding: 10px 20px; border: 4px solid #C9DDF0; border-radius: 18px; width: 380px; text-align: center; font-weight: 900; color: #1B2B4B; }
.profile-form-actions { display: flex; gap: 20px; }
.profile-form-actions button { font-size: 30px; padding: 12px 44px; border-radius: 18px; background: #E8EEF5; color: #1B2B4B; font-weight: 700; box-shadow: 0 6px 0 #C9D6E4; }
.profile-form-actions button.primary { background: #6B9E6B; color: #fff; box-shadow: 0 6px 0 #4E7A4E; }
.profile-form-actions button:active { transform: translateY(4px); box-shadow: none; }

/* ---- 首頁 ---- */
.who { position: absolute; left: 26px; top: 18px; display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 60px; padding: 6px 30px 6px 6px; box-shadow: 0 6px 0 #A9BFCF; }
.who:active { transform: translateY(4px); box-shadow: none; }
.who-avatar { width: 84px; height: 84px; border-radius: 50%; background: #EAF1EC; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.who-avatar .dog { width: 74px; height: 86px; margin-bottom: -6px; }
.who-avatar .rod { display: none; }
.who-name { font-size: 34px; font-weight: 900; color: #2B3A4A; }
.cards { position: absolute; left: 0; right: 0; top: 130px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 22px 24px; padding: 0 60px; }
.card { position: relative; width: 200px; height: 268px; border-radius: 28px; background: #fff; border: 8px solid #fff; overflow: hidden; box-shadow: 0 14px 0 #A9BFCF, 0 22px 36px rgba(20,60,110,0.22); transition: transform .12s, box-shadow .12s; }
.card:nth-child(odd) { transform: rotate(-1.5deg); }
.card:nth-child(even) { transform: rotate(1.5deg); }
.card:active { transform: translateY(10px) scale(0.98); box-shadow: 0 4px 0 #A9BFCF; }
.card.locked .card-pic { filter: grayscale(0.9) brightness(0.9); opacity: 0.55; }
.card-pic { width: 100%; height: 100%; border-radius: 30px; overflow: hidden; }
.card-pic svg { width: 100%; height: 100%; display: block; }
.card-lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.card-lock svg { filter: drop-shadow(0 4px 0 rgba(0,0,0,0.25)); }

/* ---- 遊戲 ---- */
.play-area { position: absolute; inset: 0; }
.dog-wrap { position: absolute; width: 260px; height: 300px; transform-origin: 50% 100%; filter: drop-shadow(0 8px 0 rgba(0,0,0,0.12)); }
.dog-wrap.jump { animation: jump .7s ease-out; }
.dog-wrap.tilt { animation: tilt .6s ease-in-out; }
@keyframes jump { 0% { transform: translateY(0); } 35% { transform: translateY(-70px) rotate(-6deg); } 70% { transform: translateY(0); } 85% { transform: translateY(-16px); } 100% { transform: translateY(0); } }
@keyframes tilt { 0%,100% { transform: rotate(0); } 40% { transform: rotate(14deg); } }

.fish-dog { left: 170px; top: 226px; }
.bubbles { position: absolute; inset: 0; }
.bubble { position: absolute; width: 176px; height: 176px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #FFFDF7 0 12%, rgba(246,243,230,0.85) 40%, rgba(207,234,240,0.85) 72%, rgba(143,199,210,0.95));
  border: 7px solid #F6F3E6; box-shadow: 0 12px 26px rgba(0,60,120,0.28), inset 0 -14px 24px rgba(60,150,220,0.35);
  display: flex; align-items: center; justify-content: center; animation: bob 2.8s ease-in-out infinite; transition: transform .7s cubic-bezier(.3,.9,.4,1.1), opacity .3s; }
.bubble::after { content: ""; position: absolute; left: 26px; top: 20px; width: 40px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.95); transform: rotate(-30deg); }
.bubble span { font-size: 112px; font-weight: 900; color: #2B3A4A; line-height: 1; pointer-events: none; text-shadow: 0 3px 0 rgba(255,255,255,0.8); }
@keyframes bob { 0%,100% { margin-top: 0; } 50% { margin-top: -18px; } }
.bubble.hint-loop { animation: bob 2.8s ease-in-out infinite, wiggle 1.2s ease-in-out infinite; }
.bubble.hint-once { animation: bob 2.8s ease-in-out infinite, wiggle 1.2s ease-in-out 1; }
@keyframes wiggle { 0%,100% { box-shadow: 0 12px 26px rgba(0,60,120,0.28), inset 0 -14px 24px rgba(60,150,220,0.35); } 50% { box-shadow: 0 0 0 18px rgba(232,200,106,0.9), 0 12px 26px rgba(0,60,120,0.28); } }
.bubble.shake { animation: bob 2.8s ease-in-out infinite, shake .45s ease-in-out; }
@keyframes shake { 0%,100% { margin-left: 0; } 20% { margin-left: -16px; } 40% { margin-left: 14px; } 60% { margin-left: -10px; } 80% { margin-left: 8px; } }
.bubble.caught { animation: none; z-index: 5; }
.bubble.gone { opacity: 0; }

.topbar { position: absolute; left: 0; right: 0; top: 0; height: 110px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.round-btn { width: 100px; height: 100px; border-radius: 50%; background: #E0955B; border: 6px solid #F6F3E6; box-shadow: 0 8px 0 #B07242, 0 14px 24px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; transition: transform .1s, box-shadow .1s; }
.round-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #B07242; }
.round-btn.home { background: #6B9E6B; box-shadow: 0 8px 0 #4E7A4E, 0 14px 24px rgba(0,0,0,0.18); }
.round-btn.quit { background: rgba(27,43,75,0.35); border-color: rgba(255,255,255,0.7); box-shadow: none; width: 70px; height: 70px; }
.progress-stars { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 16px; pointer-events: none; }
.progress-stars .star { font-size: 66px; color: rgba(255,255,255,0.45); text-shadow: 0 3px 0 rgba(20,60,110,0.25); }
.progress-stars .star.lit { color: #E8C86A; text-shadow: 0 4px 0 #B99A44; animation: pop .5s; }
.progress-stars .star.dim { color: rgba(255,255,255,0.9); }
@keyframes pop { 0% { transform: scale(0.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }

/* ---- 結算 ---- */
.result-burst { position: absolute; left: 50%; top: 250px; width: 900px; height: 900px; margin-left: -450px; margin-top: -450px; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,253,247,0.22) 0 8deg, rgba(255,255,255,0) 8deg 20deg); animation: spin 40s linear infinite; }
.result-dogs { position: absolute; left: 0; right: 0; top: 330px; display: flex; justify-content: center; gap: 30px; }
.result-dogs .dog { animation: bounce 1s ease-in-out infinite; filter: drop-shadow(0 8px 0 rgba(0,0,0,0.12)); }
.result-dogs .dog:nth-child(2) { animation-delay: .2s; }
.result-dogs .dog:nth-child(3) { animation-delay: .4s; }
.result-dogs .rod { display: none; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-40px); } }
.result-stars { position: absolute; left: 0; right: 0; top: 110px; display: flex; justify-content: center; gap: 22px; }
.result-stars .star { font-size: 124px; color: rgba(27,43,75,0.15); }
.result-stars .star.lit { color: #E8C86A; text-shadow: 0 6px 0 #B99A44, 0 10px 20px rgba(0,0,0,0.15); animation: pop .5s; }
.result-actions { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; gap: 60px; }
.result-actions .round-btn { width: 130px; height: 130px; }
.confetti-wrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti { position: absolute; top: -24px; width: 14px; height: 26px; border-radius: 3px; animation: fall 3s linear infinite; }
.confetti.petal { width: 16px; height: 20px; border-radius: 50% 0 50% 0; }
@keyframes fall { to { top: 110%; transform: rotate(720deg) translateX(40px); } }

/* ---- 大人面板 ---- */
#screen-panel { background: #F4F7FB; overflow: auto; touch-action: pan-y; user-select: text; }
.panel { padding: 24px 40px 60px; color: #1B2B4B; font-size: 18px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.panel-head h2 { font-size: 30px; }
.panel-head small { font-size: 20px; color: #5A6B85; font-weight: 400; }
.panel-close { font-size: 22px; padding: 10px 28px; background: #1B2B4B; color: #fff; border-radius: 12px; }
.panel-row { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; background: #fff; border-radius: 14px; padding: 14px 20px; margin-bottom: 12px; }
.panel-row button, .panel-row .file-btn { font-size: 18px; padding: 8px 18px; background: #E8EEF5; border-radius: 10px; cursor: pointer; }
.panel-row button.danger { background: #FFE0E0; color: #B5232F; }
.panel-row button.danger.armed { background: #B5232F; color: #fff; }
.panel-msg { color: #B5232F; }
.panel-difficulty { flex-direction: column; align-items: flex-start; gap: 12px; }
.range-pick { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.range-groups { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.range-groups.dimmed, .range-pick label.dimmed { opacity: 0.45; }
.range-groups label { font-size: 17px; }
.panel-row button.mini { padding: 2px 12px; font-size: 20px; line-height: 1.2; margin: 0 2px; }
.panel-row button.mini:disabled { opacity: 0.35; cursor: default; }
.panel-users { gap: 14px 28px; }
.puser { display: flex; align-items: center; gap: 10px; }
.puser-dot { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
.puser-name { font-weight: 700; }
.panel-row input[type=file] { display: none; }
.panel-row select, .panel-row input[type=range] { font-size: 18px; }
.panel-hint { color: #5A6B85; margin: 8px 0 16px; }
.pgroup { margin-bottom: 18px; }
.pgroup-title { font-weight: 700; margin-bottom: 8px; }
.ptiles { display: flex; gap: 12px; flex-wrap: wrap; }
.ptile { width: 190px; background: #fff; border-radius: 14px; padding: 10px; border-left: 12px solid #ccc; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; align-items: center; }
.ptile.red { border-color: #FF6B6B; } .ptile.yellow { border-color: #FFD23F; } .ptile.green { border-color: #3CB371; }
.ptile-sym { font-size: 52px; font-weight: 900; grid-row: span 2; color: #1B2B4B; }
.ptile-stars { font-size: 16px; color: #D9AE1F; letter-spacing: 1px; }
.ptile-hist { font-size: 14px; color: #5A6B85; }
.ptile-known { font-size: 15px; }
.ptile-rep { width: 56px; font-size: 20px; text-align: center; border: 2px solid #C9DDF0; border-radius: 8px; justify-self: end; }

/* ---- 圖片插槽：img/ 有圖就蓋掉向量圖 ---- */
.art-slot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.has-art > svg { visibility: hidden; }
.dog-slot { position: relative; display: inline-block; width: 100%; height: 100%; }
.dog-slot .art-slot { object-fit: contain; }
.card-pic { position: relative; }
.play-area { position: absolute; }

/* ---- 翻牌 ---- */
.cards-grid { position: absolute; inset: 0; }
.cards-grid.small .mcard { width: 160px; height: 195px; }
.cards-grid.small .mcard-front span { font-size: 100px; }
.mcard { position: absolute; width: 190px; height: 230px; perspective: 900px; cursor: pointer; animation: dealIn .4s ease-out both; }
@keyframes dealIn { from { opacity: 0; transform: translateY(40px) scale(0.8); } to { opacity: 1; transform: none; } }
.mcard-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.4,.2,.2,1); }
.mcard.open .mcard-inner, .mcard.matched .mcard-inner { transform: rotateY(180deg); }
.mcard-back, .mcard-front { position: absolute; inset: 0; border-radius: 26px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border: 6px solid #F6F3E6; box-shadow: 0 10px 0 rgba(0,0,0,0.12), 0 14px 24px rgba(0,0,0,0.15); }
.mcard-back { background: linear-gradient(160deg, #6B9E6B, #4E7A4E); }
.mcard-front { background: #FFFDF7; transform: rotateY(180deg); }
.mcard-front span { font-size: 120px; font-weight: 900; color: #2B3A4A; line-height: 1; }
.mcard.matched .mcard-front { background: #F6E7C8; box-shadow: 0 0 0 10px rgba(232,200,106,0.7), 0 10px 0 rgba(0,0,0,0.12); }
.mcard.matched { animation: pop .5s; }

/* ---- 打地鼠 ---- */
.whack-dog { left: 30px; top: 90px; width: 260px; height: 300px; }
.holes { position: absolute; inset: 0; }
.hole { position: absolute; width: 220px; height: 200px; overflow: hidden; clip-path: inset(-60px 0 0 0); }
.hole-back { position: absolute; left: 20px; top: 110px; width: 180px; height: 70px; border-radius: 50%; background: #3E2A1A; box-shadow: inset 0 10px 14px rgba(0,0,0,0.5); }
.hole-front { position: absolute; left: 10px; top: 150px; width: 200px; height: 50px; border-radius: 50%; background: #6E9C58; pointer-events: none; }
.mole { position: absolute; left: 40px; top: 145px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFDF7, #F6E7C8 60%, #E2C89A); box-shadow: 0 6px 0 rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; transform: translateY(160px) scale(0.9); transition: transform .28s cubic-bezier(.3,1.4,.5,1); cursor: pointer; }
.mole.up { transform: translateY(-140px) scale(1); }
.mole span { font-size: 92px; font-weight: 900; color: #2B3A4A; line-height: 1; pointer-events: none; }
.mole.hint-loop { animation: wiggle 1.2s ease-in-out infinite; }
.mole.shake { animation: shake .45s ease-in-out; }
.mole.hit { background: radial-gradient(circle at 35% 30%, #FFF6C8, #E8C86A 60%, #B99A44); animation: pop .5s; }

/* ---- 唸給狗狗聽 ---- */
.speak-dog { left: 110px; top: 250px; width: 360px; height: 415px; }
.speak-dog .dog { width: 360px; height: 415px; }
.speak-dog .dog-slot .art-slot { width: 360px; height: 415px; }
.speak-dog.listening { animation: listenBob 1s ease-in-out infinite; }
@keyframes listenBob { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
.sign { position: absolute; left: 520px; top: 150px; width: 300px; }
.sign-board { width: 300px; height: 300px; border-radius: 36px; background: #FFFDF7; border: 10px solid #B08A63; box-shadow: 0 12px 0 #8E6D4C, 0 20px 30px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; transition: box-shadow .3s; }
.sign-board span { font-size: 210px; font-weight: 900; color: #2B3A4A; line-height: 1; }
.sign-post { width: 28px; height: 160px; margin: -6px auto 0; background: #B08A63; border-radius: 6px; }
.sign.glow .sign-board { box-shadow: 0 0 0 18px rgba(232,200,106,0.75), 0 12px 0 #8E6D4C; }
.heard { position: absolute; left: 520px; top: 630px; width: 300px; text-align: center; font-size: 30px; color: #5A6B85; opacity: 0; transition: opacity .3s; }
.heard.show { opacity: 1; }
.mic-btn { position: absolute; left: 920px; top: 300px; width: 200px; height: 200px; border-radius: 50%; background: #C8553D; border: 10px solid #F6F3E6; box-shadow: 0 12px 0 #96402D, 0 20px 30px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; transition: transform .1s, box-shadow .1s; }
.mic-btn:active { transform: translateY(8px); box-shadow: 0 4px 0 #96402D; }
.mic-btn.listening { animation: micPulse 1s ease-in-out infinite; background: #E0955B; }
@keyframes micPulse { 0%,100% { box-shadow: 0 12px 0 #B07242, 0 0 0 0 rgba(224,149,91,0.6); } 50% { box-shadow: 0 12px 0 #B07242, 0 0 0 30px rgba(224,149,91,0); } }

/* ---- 發音檢查 ---- */
.check-now { font-size: 22px; }
.check-now b { font-size: 40px; margin-right: 8px; }
.check-tiles .ptile { width: 200px; }
.ctile.playing { outline: 4px solid #E8C86A; }
.check-note { width: 90px; }
.check-note:disabled { opacity: 0.4; }
.check-issues { gap: 10px 14px; }
.issue-chip { background: #FFE0E0; color: #B32B37; padding: 4px 12px; border-radius: 10px; font-weight: 700; }
.check-rec code { background: #E8EEF5; padding: 2px 8px; border-radius: 6px; }

/* ---- 音節（結合韻、拼讀字）是一張 1em 見方的小 SVG，符號直排；調號畫在框外右邊，所以 overflow 要 visible ---- */
svg.syl { display: inline-block; width: 1em; height: 1em; overflow: visible; vertical-align: middle; }
svg.syl text { font-weight: 900; fill: currentColor; text-anchor: middle; dominant-baseline: central; }

/* ---- 寫給狗狗看 ---- */
.write-dog { left: 40px; top: 300px; width: 300px; height: 346px; }
.write-dog .dog { width: 300px; height: 346px; }
.write-dog .dog-slot .art-slot { width: 300px; height: 346px; }
.pad-wrap { position: absolute; left: 400px; top: 120px; width: 560px; height: 560px; border-radius: 36px; background: #FFFDF7; border: 10px solid #B08A63; box-shadow: 0 12px 0 #8E6D4C, 0 20px 30px rgba(0,0,0,0.18); }
.pad-wrap.shake { animation: shake .45s ease-in-out; }
.pad-wrap.glow { box-shadow: 0 0 0 18px rgba(232,200,106,0.75), 0 12px 0 #8E6D4C; }
.pad { position: absolute; left: 0; top: 0; width: 540px; height: 540px; touch-action: none; cursor: crosshair; border-radius: 26px; }
.pad-template { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity .3s; }
.pad-template.show { opacity: 1; }
.pad-template.flash { animation: tplFlash 1.5s ease-in-out; }
@keyframes tplFlash { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
.pad-template span { font-size: 400px; font-weight: 900; color: #D5DEE8; line-height: 1; }
.pad-ok { position: absolute; right: -70px; bottom: -30px; width: 130px; height: 130px; border-radius: 50%; background: #6B9E6B; border: 8px solid #F6F3E6; box-shadow: 0 10px 0 #4E7A4E, 0 16px 26px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; }
.pad-ok:active { transform: translateY(6px); box-shadow: 0 4px 0 #4E7A4E; }
.pad-undo { position: absolute; right: -50px; top: -20px; width: 84px; height: 84px; border-radius: 50%; background: #E0955B; border: 6px solid #F6F3E6; box-shadow: 0 8px 0 #B07242; display: flex; align-items: center; justify-content: center; }
.pad-undo:active { transform: translateY(5px); box-shadow: 0 3px 0 #B07242; }

.panel-tracks { gap: 10px 16px; }
.track-tab { font-size: 22px !important; padding: 8px 26px !important; border-radius: 12px; }
.track-tab.on { background: #1B2B4B !important; color: #fff; }
.panel-hint-inline { color: #5A6B85; font-size: 15px; }

.pad-template.good span { color: rgba(107,158,107,0.55); }
.pad-template.bad span { color: rgba(224,149,91,0.6); }

.heard.warn { color: #B32B37; font-size: 24px; line-height: 1.3; }
.mic-btn.disabled { background: #A9BFCF; box-shadow: 0 12px 0 #8A9DAB; cursor: default; }

/* ---- 家長區長期統計 ---- */
.panel-stats { flex-direction: column; align-items: stretch; gap: 10px; }
.stats-sum { font-size: 20px; }
.dchart-title { font-size: 14px; color: #5A6B85; margin-bottom: 6px; }
.lg { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 3px; }
.lg-ok { background: #4A6FA5; } .lg-bad { background: #E0955B; }
.dbars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 18px; }
.dbar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
.dbar-col { width: 100%; max-width: 34px; display: flex; flex-direction: column; border-radius: 4px 4px 0 0; overflow: hidden; background: transparent; }
.dbar-ok { background: #4A6FA5; }
.dbar-bad { background: #E0955B; border-bottom: 2px solid #fff; }
.dbar-n { position: absolute; top: -18px; font-size: 12px; color: #5A6B85; }
.dbar-date { font-size: 11px; color: #5A6B85; margin-top: 4px; }

/* ---- 詞的排版：每個音節一欄（80×170 的 SVG，符號一律 50），欄裡置中，欄右邊留一條放調號。
   整個詞的大小由容器的 .word 字級決定：欄高 1.6em、欄寬 0.75em ---- */
.word { display: inline-flex; align-items: center; gap: 0.05em; }
.word svg.syl { width: 0.75em; height: 1.6em; }
.sign-board .word { font-size: 0.6em; }
.sign-board .word.w3 { font-size: 0.48em; }
.mword .word { font-size: 0.9em; }
.mword .word.w3 { font-size: 0.72em; }
.fill-word .word { font-size: 1.1em; }
.fill-word .word.w3 { font-size: 0.88em; }
.word .blank { font-size: 1em; } /* 別被 .sign-board span 的字級放大 */

/* ---- 連連看 ---- */
.match-dog { left: 460px; top: 560px; width: 180px; height: 208px; }
.match-dog .dog { width: 180px; height: 208px; }
.match-dog .dog-slot .art-slot { width: 180px; height: 208px; }
.lines { position: absolute; left: 0; top: 0; pointer-events: none; }
.lines line { stroke-width: 10; stroke-linecap: round; }
.lines .live { stroke: #4A6FA5; opacity: 0; }
.lines .live.show { opacity: 0.8; }
.lines .ok { stroke: #6B9E6B; }
.lines .bad { stroke: #C8553D; }
.match-words, .match-pics { position: absolute; top: 0; }
.mword { position: absolute; left: 30px; width: 300px; height: 160px; border-radius: 24px; background: #FFFDF7; border: 8px solid #B08A63; box-shadow: 0 8px 0 #8E6D4C; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; }
.mword span { font-size: 100px; font-weight: 900; color: #2B3A4A; line-height: 1; pointer-events: none; }
.mword.picked { box-shadow: 0 0 0 10px rgba(74,111,165,0.5), 0 8px 0 #8E6D4C; }
.mword.matched { opacity: 0.55; border-color: #6B9E6B; box-shadow: 0 8px 0 #4E7A4E; cursor: default; }
.mpic { position: absolute; left: 740px; width: 160px; height: 160px; border-radius: 28px; background: linear-gradient(#FFFDF7, #F1ECDC); border: 8px solid #fff; box-shadow: 0 8px 0 #A9BFCF, 0 14px 22px rgba(20,60,110,0.16); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
.mpic .emoji { font-size: 100px; line-height: 1; pointer-events: none; }
.mpic .art-slot, .fill-pic .art-slot { object-fit: contain; padding: 8px; box-sizing: border-box; }
.has-art > .emoji { display: none; }
.emoji { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
.mpic.matched { opacity: 0.55; border-color: #6B9E6B; }
.mpic.shake { animation: shake .45s ease-in-out; }

/* ---- 填空 ---- */
.fill-dog { left: 10px; top: 440px; width: 220px; height: 254px; }
.fill-dog .dog { width: 220px; height: 254px; }
.fill-dog .dog-slot .art-slot { width: 220px; height: 254px; }
.fill-pic { position: absolute; left: 120px; top: 120px; width: 240px; height: 240px; border-radius: 40px; background: linear-gradient(#FFFDF7, #F1ECDC); border: 8px solid #fff; box-shadow: 0 10px 0 #A9BFCF, 0 14px 22px rgba(20,60,110,0.16); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
.fill-pic .emoji { font-size: 150px; line-height: 1; pointer-events: none; }
.fill-sign { left: 420px; top: 90px; width: 700px; }
.fill-sign .sign-board { width: 700px; height: 300px; }
.fill-sign .sign-board span.fill-word { font-size: 150px; }
.fill-sign .sign-post { height: 40px; }
.blank { display: inline-block; width: 0.6em; height: 1.55em; margin: 0 0.1em 0 0.05em; border: 6px dashed #E0955B; border-radius: 14px; vertical-align: middle; background: rgba(224,149,91,0.08); box-sizing: border-box; }
.tiles { position: absolute; inset: 0; pointer-events: none; }
.tile { position: absolute; width: 160px; height: 160px; border-radius: 28px; background: #FFF3B0; border: 8px solid #F6F3E6; box-shadow: 0 10px 0 #D9AA1B; display: flex; align-items: center; justify-content: center; pointer-events: auto; touch-action: none; cursor: grab; }
.tile span { font-size: 100px; font-weight: 900; color: #2B3A4A; line-height: 1; pointer-events: none; }
.tile.dragging { z-index: 6; box-shadow: 0 16px 20px rgba(0,0,0,0.25); transform: scale(1.06); cursor: grabbing; }
.tile.returning { transition: left .3s ease-out, top .3s ease-out; }
.tile.shake { animation: shake .45s ease-in-out; }
.tile.gone { opacity: 0; transition: opacity .3s; pointer-events: none; }

/* ---- 手機在不能全螢幕的瀏覽器（LINE 內建那種）裡開：提示改用 Chrome 加到主畫面 ---- */
#install-hint { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 60; max-width: 92vw; padding: 10px 18px; border-radius: 14px; background: rgba(43,58,74,0.92); color: #fff; font-size: 15px; line-height: 1.4; box-shadow: 0 6px 16px rgba(0,0,0,0.3); }
#install-hint[hidden] { display: none; }

/* ================= 直版（手機直拿）：#stage.portrait，寬 800、高 --H ================= */
#stage.portrait .profiles { padding: 100px 40px 120px; }
#stage.portrait .cards { top: 130px; bottom: 60px; align-content: center; padding: 0 40px; }
/* 結算 */
#stage.portrait .result-stars { top: 150px; }
#stage.portrait .result-burst { top: calc(var(--H) * 0.5); }
#stage.portrait .result-dogs { top: calc(var(--H) * 0.5 - 120px); gap: 16px; }
#stage.portrait .result-dogs .dog-slot { width: 200px; height: 231px; }
#stage.portrait .result-dogs .dog { width: 200px; height: 231px; }
/* 打地鼠：狗狗小小的在上面正中間，洞兩欄三排（位置由 JS 排） */
#stage.portrait .whack-dog { left: 300px; top: 70px; width: 200px; height: 231px; }
#stage.portrait .whack-dog .dog, #stage.portrait .whack-dog .dog-slot .art-slot { width: 200px; height: 231px; }
/* 唸給狗狗聽：牌子在上面正中，麥克風右下，狗狗左下 */
#stage.portrait { --py: calc((var(--H) - 1060px) / 2); } /* 唸給狗狗聽整組垂直置中的偏移 */
#stage.portrait .sign { left: 250px; top: calc(130px + var(--py)); }
#stage.portrait .heard { left: 0; width: 800px; top: calc(700px + var(--py)); }
#stage.portrait .mic-btn { left: 560px; top: calc(760px + var(--py)); }
#stage.portrait .speak-dog { left: 0; top: calc(720px + var(--py)); width: 260px; height: 300px; }
#stage.portrait .speak-dog .dog, #stage.portrait .speak-dog .dog-slot .art-slot { width: 260px; height: 300px; }
/* 寫給狗狗看：板子置中偏上，狗狗左下小小的 */
#stage.portrait .pad-wrap { left: 120px; top: calc((var(--H) - 900px) / 2 + 100px); }
#stage.portrait .write-dog { left: 0; top: calc(var(--H) - 320px); width: 200px; height: 231px; }
#stage.portrait .write-dog .dog, #stage.portrait .write-dog .dog-slot .art-slot { width: 200px; height: 231px; }
/* 連連看：詞在左、圖在右、狗狗小小的在上面中間（列的位置由 JS 排） */
#stage.portrait .mpic { left: 600px; }
#stage.portrait .match-dog { left: 325px; top: 30px; width: 150px; height: 173px; }
#stage.portrait .match-dog .dog, #stage.portrait .match-dog .dog-slot .art-slot { width: 150px; height: 173px; }
/* 填空：圖在上面正中、牌子在下面、磁磚一排貼底（磁磚位置由 JS 排），狗狗左上 */
#stage.portrait .fill-pic { left: 280px; }
#stage.portrait .fill-sign { left: 50px; }
#stage.portrait .fill-dog { left: 20px; top: 110px; width: 180px; height: 208px; }
#stage.portrait .fill-dog .dog, #stage.portrait .fill-dog .dog-slot .art-slot { width: 180px; height: 208px; }

</style>

// ===== scheduler.js =====
// 出題邏輯：熟練度、解鎖、加權出題、混淆對加練、階級升降。
// 純函式，不碰 DOM，不碰 localStorage。所有函式回傳新狀態，不改舊的。


const HISTORY_CAP = 10
const RECENT_CAP = 10
const ROUND_SIZE = 5
const UNLOCK_STARS = 4
const DRILL_CLEAR_STREAK = 3

// 一個數字代表整體難度，往上走選項變多、干擾項變刁、提示變少。
// similar：這題放形似／音似干擾項的機率（每階都會放，只是低階不一定）。
// distract：形似、音似誰先放（shape 先放長得像的，sound 先放聽起來像的）。
// idleHint：幾秒沒點就重唸並晃一下正確的（0 = 不提示）。只有最低兩階有，其他一律沒有。
// 一開始永遠沒有提示，答錯也不顯示答案，只重唸一次。
const TIERS = [
  { options: 2, distract: 'shape', similar: 0.6, idleHint: 10 },
  { options: 3, distract: 'shape', similar: 0.7, idleHint: 10 },
  { options: 3, distract: 'shape', similar: 1, idleHint: 0 },
  { options: 4, distract: 'shape', similar: 1, idleHint: 0 },
  { options: 4, distract: 'sound', similar: 1, idleHint: 0 },
  { options: 6, distract: 'sound', similar: 1, idleHint: 0 },
]

// 聽（釣魚、打地鼠）、讀（唸給狗狗聽）、寫（寫給狗狗看）三軌各自記，練的是不同的東西。
const TRACKS = ['listen', 'read', 'write']
const TRACK_NAMES = { listen: '聽', read: '讀', write: '寫' }
const TRACK_FIELDS = ['mastery', 'confusions', 'tier', 'recent', 'log']
const LOG_CAP = 3000

function emptyTrack () {
  return { mastery: {}, confusions: {}, tier: 0, recent: [], log: [] }
}

// version 2：家長設定在外層共用，練習紀錄分三軌。
function createState ({ known = [], groups = null } = {}) {
  return {
    version: 2,
    known: [...known],
    groups,
    lockTier: null, // 家長鎖定的階級；null 表示自動
    rangeGroups: null, // 家長指定的練習組別索引；null 或空表示自動解鎖
    unlockedUpTo: null, // 家長手動跳級：至少解鎖到第幾組（1 起算）；null 表示不干預
    tracks: { listen: emptyTrack(), read: emptyTrack(), write: emptyTrack() },
  }
}

// 把一軌攤平成舊格式（外層設定 + 這軌的紀錄），給出題、記錄、面板用。
function trackView (state, track) {
  const t = (state.tracks && state.tracks[track]) || emptyTrack()
  const { tracks, ...shared } = state
  return { ...shared, ...emptyTrack(), ...t, track }
}

// 把攤平的一軌寫回去，只動這軌的紀錄欄位。
function applyTrack (state, track, view) {
  const patch = {}
  for (const k of TRACK_FIELDS) patch[k] = view[k]
  return { ...state, tracks: { ...state.tracks, [track]: { ...state.tracks[track], ...patch } } }
}

// 自動解鎖到第幾組（1 起算）：練熟一組開下一組，再跟家長手動跳級的值取大者
function unlockedCount (state) {
  const groups = state.groups || GROUPS
  let n = 1
  while (n < groups.length && groupAverage(state, groups[n - 1]) >= UNLOCK_STARS) n++
  const manual = typeof state.unlockedUpTo === 'number' ? state.unlockedUpTo : 1
  return Math.min(groups.length, Math.max(n, manual))
}

// 清除練習紀錄：三軌的星星、混淆對、階級、最近答題全部歸零。名字、認得、難度鎖、範圍都保留。
// 傳攤平的一軌進來就只清那一軌。
function resetProgress (state) {
  if (state.tracks) {
    return { ...state, tracks: { listen: emptyTrack(), read: emptyTrack(), write: emptyTrack() } }
  }
  return { ...state, ...emptyTrack() }
}

// 出題實際用的階級：家長有鎖就用鎖的，否則用自動升降的
function effectiveTier (state) {
  return typeof state.lockTier === 'number' ? state.lockTier : state.tier
}

// 0–5 星。只看最近 10 次；樣本少時星星不會超過樣本數，避免答對一次就 5 星。
function stars (state, symbol) {
  const history = (state.mastery[symbol] && state.mastery[symbol].history) || []
  if (history.length === 0) return state.known.includes(symbol) ? 3 : 0
  const okCount = history.filter(h => h.ok).length
  return Math.min(Math.round((okCount / history.length) * 5), history.length)
}

function groupAverage (state, group) {
  return group.reduce((sum, s) => sum + stars(state, s), 0) / group.length
}

// 目前可出題的符號。家長有指定範圍就只出那幾組；否則是已解鎖的組 + 家長勾「已經認得」的。
function activePool (state) {
  const groups = state.groups || GROUPS
  if (Array.isArray(state.rangeGroups) && state.rangeGroups.length) {
    return state.rangeGroups.filter(i => groups[i]).flatMap(i => groups[i])
  }
  const pool = groups.slice(0, unlockedCount(state)).flat()
  for (const s of state.known) {
    if (!pool.includes(s)) pool.push(s)
  }
  return pool
}

function weightedPick (items, weightOf, rng) {
  const weights = items.map(weightOf)
  const total = weights.reduce((a, b) => a + b, 0)
  let r = rng() * total
  for (let i = 0; i < items.length; i++) {
    r -= weights[i]
    if (r < 0) return items[i]
  }
  return items[items.length - 1]
}

function shuffle (arr, rng) {
  const a = [...arr]
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]]
  }
  return a
}

function partnersOf (symbol, pairs) {
  const out = []
  for (const [a, b] of pairs) {
    if (a === symbol) out.push(b)
    else if (b === symbol) out.push(a)
  }
  return out
}

// 兩個字有幾個位置的符號一樣（長度不同算 0）。詞（有空白）改成比音節：有幾個音節相同。
function sharedSymbols (a, b) {
  if (a.includes(' ') || b.includes(' ')) {
    const sa = a.split(' ').map(coreOf)
    const sb = b.split(' ').map(coreOf)
    return sa.filter(x => sb.includes(x)).length
  }
  a = coreOf(a)
  b = coreOf(b)
  if (a.length !== b.length) return 0
  let n = 0
  for (let i = 0; i < a.length; i++) if (a[i] === b[i]) n++
  return n
}

// 干擾項：形似、音似的對先放（誰先看 mode），拼讀字再放只差一個符號的；不夠再隨機補。
// useSimilar 為 false 時整題隨機。
function pickDistractors (target, pool, count, mode, rng, useSimilar = true) {
  const candidates = pool.filter(s => s !== target)
  const preferred = []
  if (useSimilar) {
    const first = mode === 'sound' ? SIMILAR_SOUND : SIMILAR_SHAPE
    const second = mode === 'sound' ? SIMILAR_SHAPE : SIMILAR_SOUND
    preferred.push(...shuffle(partnersOf(target, first), rng))
    preferred.push(...shuffle(partnersOf(target, second), rng))
    // 拼讀字：只差一個符號的；詞：至少共用一個音節的
    if (target.includes(' ')) {
      preferred.push(...shuffle(candidates.filter(c => sharedSymbols(target, c) >= 1), rng))
    } else if (coreOf(target).length > 1) {
      preferred.push(...shuffle(candidates.filter(c => sharedSymbols(target, c) >= coreOf(target).length - 1), rng))
    }
  }
  const chosen = []
  for (const p of preferred) {
    if (chosen.length >= count) break
    if (candidates.includes(p) && !chosen.includes(p)) chosen.push(p)
  }
  const rest = shuffle(candidates.filter(s => !chosen.includes(s)), rng)
  while (chosen.length < count && rest.length) chosen.push(rest.pop())
  return chosen
}

function pairKey (a, b) {
  return [a, b].sort().join('|')
}

// 一局 5 題。至少 2 題來自最弱的三個符號；有混淆對時，插一題二選一加練。
function buildRound (state, rng, size = ROUND_SIZE) {
  const pool = activePool(state)
  const tier = TIERS[effectiveTier(state)]
  const optionCount = Math.min(tier.options, pool.length)
  const weakest = [...pool].sort((a, b) => stars(state, a) - stars(state, b)).slice(0, 3)
  const weightOf = s => Math.pow(6 - stars(state, s), 2)

  const slots = shuffle([...Array(size).keys()], rng)
  const forced = new Set(slots.slice(0, 2))
  const drillKeys = Object.keys(state.confusions)
  const drillSlot = drillKeys.length ? slots[2] : -1

  const round = []
  for (let i = 0; i < size; i++) {
    if (i === drillSlot) {
      const key = drillKeys[Math.floor(rng() * drillKeys.length)]
      const pair = key.split('|')
      const target = pair[Math.floor(rng() * 2)]
      round.push({ target, options: shuffle(pair, rng), idleHint: tier.idleHint, drill: key })
      continue
    }
    const source = forced.has(i) ? weakest : pool
    const target = weightedPick(source, weightOf, rng)
    // 詞比較大，最多 4 個選項
    const count = target.includes(' ') ? Math.min(optionCount, 4) : optionCount
    const distractors = pickDistractors(target, pool, count - 1, tier.distract, rng, rng() < tier.similar)
    round.push({ target, options: shuffle([target, ...distractors], rng), idleHint: tier.idleHint, drill: null })
  }
  return round
}

// 寫字用：只留單一符號的組（前十組）。家長指定的範圍若沒有單一符號組，退回第一組。
function singleSymbolState (state) {
  const groups = state.groups || GROUPS
  const singles = [...groups.keys()].filter(i => groups[i].every(s => s.length === 1))
  let chosen
  if (Array.isArray(state.rangeGroups) && state.rangeGroups.length) {
    chosen = state.rangeGroups.filter(i => singles.includes(i))
  } else {
    chosen = singles.filter(i => i < unlockedCount(state))
  }
  if (!chosen.length) chosen = [singles[0]]
  return { ...state, rangeGroups: chosen }
}

function isWordGroup (g) { return g.length > 0 && g[0].includes(' ') }

// 聽的玩法（釣魚、打地鼠、翻牌）不出詞：把詞的組排除。範圍全是詞就退回第一組。
function noWordsState (state) {
  const groups = state.groups || GROUPS
  const nonWord = [...groups.keys()].filter(i => !isWordGroup(groups[i]))
  let chosen
  if (Array.isArray(state.rangeGroups) && state.rangeGroups.length) {
    chosen = state.rangeGroups.filter(i => nonWord.includes(i))
  } else {
    chosen = nonWord.filter(i => i < unlockedCount(state))
  }
  if (!chosen.length) chosen = [nonWord[0]]
  return { ...state, rangeGroups: chosen }
}

// 連連看、填空只出詞：家長範圍裡有詞的組就用那些，否則全部詞的組。
function wordsOnlyState (state) {
  const groups = state.groups || GROUPS
  const wordIdx = [...groups.keys()].filter(i => isWordGroup(groups[i]))
  let chosen = []
  if (Array.isArray(state.rangeGroups) && state.rangeGroups.length) {
    chosen = state.rangeGroups.filter(i => wordIdx.includes(i))
  }
  if (!chosen.length) chosen = wordIdx
  return { ...state, rangeGroups: chosen }
}

// 翻牌用：從出題池挑 n 個不重複的符號，弱的優先。池子不夠就全給。
function pickSymbols (state, rng, n) {
  let candidates = activePool(state)
  const weightOf = s => Math.pow(6 - stars(state, s), 2)
  const chosen = []
  while (chosen.length < n && candidates.length) {
    const s = weightedPick(candidates, weightOf, rng)
    chosen.push(s)
    candidates = candidates.filter(x => x !== s)
  }
  return chosen
}

function adjustTier (tier, recent) {
  if (recent.length < RECENT_CAP) return { tier, recent }
  const okCount = recent.filter(Boolean).length
  if (okCount >= 9) return { tier: Math.min(tier + 1, TIERS.length - 1), recent: [] }
  if (okCount < 6) return { tier: Math.max(tier - 1, 0), recent: [] }
  return { tier, recent }
}

// 每題只記第一次點的結果。picked 是她點的符號；drill 是這題若為加練題的混淆對 key。
// at 是答題時間（毫秒），寫進長期日誌；不給就用現在。
function recordAnswer (state, { target, ok, picked, ms, drill = null, at = Date.now() }) {
  const oldHistory = (state.mastery[target] && state.mastery[target].history) || []
  const history = [...oldHistory, { ok, ms }].slice(-HISTORY_CAP)
  const mastery = { ...state.mastery, [target]: { history } }
  const log = [...(state.log || []), { at, s: target, ok }].slice(-LOG_CAP)

  const confusions = { ...state.confusions }
  if (!ok && picked && picked !== target) {
    confusions[pairKey(target, picked)] = { streak: 0 }
  }
  if (drill && confusions[drill]) {
    if (!ok) {
      confusions[drill] = { streak: 0 }
    } else {
      const streak = confusions[drill].streak + 1
      if (streak >= DRILL_CLEAR_STREAK) delete confusions[drill]
      else confusions[drill] = { streak }
    }
  }

  const { tier, recent } = adjustTier(state.tier, [...state.recent, ok].slice(-RECENT_CAP))
  return { ...state, mastery, confusions, tier, recent, log }
}

// 長期統計：累計題數、答對數，以及每個符號的累計
function lifetimeStats (state) {
  const bySymbol = {}
  let total = 0, correct = 0
  for (const e of state.log || []) {
    total++
    if (e.ok) correct++
    const b = bySymbol[e.s] || (bySymbol[e.s] = { total: 0, correct: 0 })
    b.total++
    if (e.ok) b.correct++
  }
  return { total, correct, bySymbol }
}

// 最近 days 天每天的題數與答對數（本地日期），今天在最後一格
function dailyStats (state, days, now = Date.now()) {
  const out = []
  const keyOf = d => `${d.getMonth() + 1}/${d.getDate()}`
  const index = {}
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now)
    d.setHours(0, 0, 0, 0)
    d.setDate(d.getDate() - i)
    const row = { date: keyOf(d), total: 0, correct: 0 }
    index[keyOf(d) + '|' + d.getFullYear()] = row
    out.push(row)
  }
  for (const e of state.log || []) {
    const d = new Date(e.at)
    const row = index[keyOf(d) + '|' + d.getFullYear()]
    if (!row) continue
    row.total++
    if (e.ok) row.correct++
  }
  return out
}

// ===== store.js =====
// 進度存取：多位使用者、每人一份進度、匯出匯入。storage 用參數傳進來，測試時換成假的。


const PREFIX = 'zhuyin-rescue:'
const PROFILES_KEY = 'zhuyin-rescue-profiles'

function isValidState (s) {
  if (!s || typeof s !== 'object') return false
  if (s.version === 2) return !!(s.tracks && s.tracks.listen && s.tracks.read && s.tracks.write)
  return s.version === 1 && !!s.mastery && !!s.confusions
}

// 舊存檔（version 1）：紀錄在最外層，全部當成「聽」那一軌
function migrate (s) {
  if (s.version === 2) return s
  const { mastery, confusions, tier, recent, ...shared } = s
  return {
    ...shared,
    version: 2,
    lockTier: shared.lockTier == null ? null : shared.lockTier,
    rangeGroups: shared.rangeGroups == null ? null : shared.rangeGroups,
    unlockedUpTo: shared.unlockedUpTo == null ? null : shared.unlockedUpTo,
    tracks: { listen: { mastery, confusions, tier, recent }, read: emptyTrack(), write: emptyTrack() },
  }
}

function readJson (storage, key, fallback) {
  try {
    const raw = storage.getItem(key)
    return raw ? JSON.parse(raw) : fallback
  } catch (err) {
    return fallback
  }
}

function createStore (storage) {
  function loadProfiles () {
    const p = readJson(storage, PROFILES_KEY, null)
    if (!p || !Array.isArray(p.list)) return { list: [], current: null }
    return { list: p.list, current: p.current || null }
  }
  function saveProfiles (p) {
    storage.setItem(PROFILES_KEY, JSON.stringify(p))
  }

  return {
    load (profileId) {
      const s = readJson(storage, PREFIX + profileId, null)
      return isValidState(s) ? migrate(s) : createState()
    },
    save (profileId, state) {
      storage.setItem(PREFIX + profileId, JSON.stringify(state))
    },
    exportJson (state) {
      return JSON.stringify(state, null, 2)
    },
    importJson (text) {
      const s = JSON.parse(text)
      if (!isValidState(s)) throw new Error('不是注音救援隊的存檔')
      return migrate(s)
    },

    loadProfiles,
    addProfile ({ name, color }) {
      const p = loadProfiles()
      const profile = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, color }
      p.list.push(profile)
      p.current = profile.id
      saveProfiles(p)
      return profile
    },
    setCurrent (id) {
      const p = loadProfiles()
      p.current = id
      saveProfiles(p)
    },
    removeProfile (id) {
      const p = loadProfiles()
      p.list = p.list.filter(x => x.id !== id)
      if (p.current === id) p.current = p.list.length ? p.list[0].id : null
      saveProfiles(p)
      storage.removeItem(PREFIX + id)
    },
  }
}

// ===== audio.js =====
// 發音與音效。語音合成唸代表字；audio/ 資料夾有錄音就改播錄音；音效全部現場合成。


// getSettings 回傳目前設定 { voiceName, rate, repChar }，每次唸都重新拿，面板改了馬上生效。
function createAudio (getSettings) {
  let ctx = null
  let voices = []
  const recordingExists = {} // 符號 → true/false，第一次試過就記住

  function refreshVoices () {
    if (!('speechSynthesis' in window)) return
    voices = window.speechSynthesis.getVoices()
  }
  if ('speechSynthesis' in window) {
    refreshVoices()
    window.speechSynthesis.onvoiceschanged = refreshVoices
  }

  function pickVoice () {
    refreshVoices()
    const settings = getSettings()
    if (settings.voiceName) {
      const chosen = voices.find(v => v.name === settings.voiceName)
      if (chosen) return chosen
    }
    const tw = voices.filter(v => /zh[-_]TW/i.test(v.lang))
    return tw.find(v => /Google/i.test(v.name)) || tw[0] ||
      voices.find(v => /^zh/i.test(v.lang)) || null
  }

  // 第一次觸碰時呼叫：建立 AudioContext、暖機語音合成。
  function unlock () {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext
      if (AC) ctx = new AC()
    }
    if (ctx && ctx.state === 'suspended') ctx.resume()
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(' ')
      u.volume = 0
      window.speechSynthesis.speak(u)
    }
  }

  function speakTts (text) {
    return new Promise(resolve => {
      if (!('speechSynthesis' in window)) return resolve()
      window.speechSynthesis.cancel()
      const u = new SpeechSynthesisUtterance(text)
      u.lang = 'zh-TW'
      u.rate = getSettings().rate || 0.8
      const v = pickVoice()
      if (v) u.voice = v
      let done = false
      const finish = () => { if (!done) { done = true; resolve() } }
      u.onend = finish
      u.onerror = finish
      setTimeout(finish, 3000) // 語音卡住也不要卡遊戲
      window.speechSynthesis.speak(u)
    })
  }

  const RECORDING_EXTS = ['wav', 'mp3']
  let currentEl = null // 正在播的錄音，換題時先停掉

  // onStart 在聲音真的開始出來時呼叫，讓遊戲可以提早開放點擊
  function playFile (url, onStart) {
    return new Promise(resolve => {
      const el = new Audio(url)
      currentEl = el
      el.onplaying = () => { if (onStart) onStart() }
      el.onended = () => resolve(true)
      el.onpause = () => resolve(true) // 被 stop() 中斷也要讓等待的人繼續
      el.onerror = () => resolve(false)
      el.play().catch(() => resolve(false))
    })
  }

  // audio/ㄅ.wav 或 audio/ㄅ.mp3，哪個有就播哪個。找過一次的結果記住，不重複試。
  async function playRecording (symbol, onStart) {
    const known = recordingExists[symbol]
    if (known === false) return false
    if (typeof known === 'string') return playFile(known, onStart)
    for (const ext of RECORDING_EXTS) {
      const url = 'audio/' + encodeURIComponent(symbol) + '.' + ext
      if (await playFile(url, onStart)) { recordingExists[symbol] = url; return true }
    }
    recordingExists[symbol] = false
    return false
  }

  // 查這個符號會用哪個音源：'recording' 或 'tts'。只載入不播放，結果一樣記進 recordingExists。
  function sourceOf (symbol) {
    const known = recordingExists[symbol]
    if (known === false) return Promise.resolve('tts')
    if (typeof known === 'string') return Promise.resolve('recording')
    return new Promise(resolve => {
      const tryExt = i => {
        if (i >= RECORDING_EXTS.length) { recordingExists[symbol] = false; return resolve('tts') }
        const url = 'audio/' + encodeURIComponent(symbol) + '.' + RECORDING_EXTS[i]
        const el = new Audio()
        el.preload = 'metadata'
        el.onloadedmetadata = () => { recordingExists[symbol] = url; resolve('recording') }
        el.onerror = () => tryExt(i + 1)
        el.src = url
      }
      tryExt(0)
    })
  }

  function stop () {
    if (currentEl) { currentEl.pause(); currentEl = null }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel()
  }

  // 唸一個符號。回傳 Promise，唸完才 resolve。有官方錄音就播錄音，沒有才用語音合成。
  async function say (symbol, { onStart } = {}) {
    stop()
    if (await playRecording(symbol, onStart)) return
    const settings = getSettings()
    const text = (settings.repChar && settings.repChar[symbol]) || REP_CHAR[symbol] || symbol
    if (onStart) onStart()
    await speakTts(text)
  }

  function tone (freq, start, dur, type = 'sine', gain = 0.25) {
    if (!ctx) return
    const o = ctx.createOscillator()
    const g = ctx.createGain()
    o.type = type
    o.frequency.setValueAtTime(freq, ctx.currentTime + start)
    g.gain.setValueAtTime(0, ctx.currentTime + start)
    g.gain.linearRampToValueAtTime(gain, ctx.currentTime + start + 0.02)
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur)
    o.connect(g).connect(ctx.destination)
    o.start(ctx.currentTime + start)
    o.stop(ctx.currentTime + start + dur + 0.05)
  }

  function ding () { tone(880, 0, 0.18); tone(1320, 0.12, 0.3) }
  function wrong () {
    if (!ctx) return
    const o = ctx.createOscillator()
    const g = ctx.createGain()
    o.type = 'triangle'
    o.frequency.setValueAtTime(300, ctx.currentTime)
    o.frequency.linearRampToValueAtTime(380, ctx.currentTime + 0.25)
    g.gain.setValueAtTime(0.2, ctx.currentTime)
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35)
    o.connect(g).connect(ctx.destination)
    o.start()
    o.stop(ctx.currentTime + 0.4)
  }
  function splash () {
    if (!ctx) return
    const len = ctx.sampleRate * 0.35
    const buf = ctx.createBuffer(1, len, ctx.sampleRate)
    const d = buf.getChannelData(0)
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2)
    const src = ctx.createBufferSource()
    src.buffer = buf
    const f = ctx.createBiquadFilter()
    f.type = 'bandpass'
    f.frequency.value = 1200
    const g = ctx.createGain()
    g.gain.value = 0.4
    src.connect(f).connect(g).connect(ctx.destination)
    src.start()
  }
  // 咬餅乾：短短的雜訊
  function crunch () {
    if (!ctx) return
    const len = Math.floor(ctx.sampleRate * 0.12)
    const buf = ctx.createBuffer(1, len, ctx.sampleRate)
    const d = buf.getChannelData(0)
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.5)
    const src = ctx.createBufferSource()
    src.buffer = buf
    const f = ctx.createBiquadFilter()
    f.type = 'lowpass'
    f.frequency.value = 2200
    const g = ctx.createGain()
    g.gain.value = 0.5
    src.connect(f).connect(g).connect(ctx.destination)
    src.start()
    tone(180, 0.02, 0.1, 'square', 0.08)
  }
  // 翻牌：輕輕一聲
  function flip () { tone(660, 0, 0.07, 'triangle', 0.15) }
  function cheer () {
    const notes = [523, 659, 784, 1047]
    notes.forEach((n, i) => tone(n, i * 0.12, 0.35, 'triangle', 0.2))
    tone(1319, 0.5, 0.6, 'triangle', 0.2)
  }

  return { unlock, say, stop, sourceOf, ding, wrong, splash, crunch, flip, cheer, listVoices: () => { refreshVoices(); return voices } }
}

// ===== art.js =====
// SVG 圖：場景、狗狗、卡片插圖。全部是字串，塞進 innerHTML。
// 風格：借宮崎駿動畫的氛圍。水彩天空、厚積雲、層疊山丘、青綠海面、褪色木頭、柔光，不用粗描邊。


// 符號怎麼顯示：單一符號直接放，結合韻兩個直排
function symbolMarkup (sym) {
  // 詞：音節左右並列，每個音節各自直排；單一符號的音節也包成一欄，字才會一樣大
  if (sym.includes(' ')) {
    const syls = sym.split(' ')
    return `<span class="word w${syls.length}">${syls.map(s => syllableMarkup(s, true)).join('')}</span>`
  }
  return syllableMarkup(sym, false)
}

// 一個音節畫成一張小 SVG：符號直排、調號在最後一個符號右邊、輕聲點在最上面。
// 用 SVG 而不用 HTML 文字，是因為手機瀏覽器會自己放大它覺得太小的文字，注音每欄被放大的程度不一樣，排版就亂了；SVG 的字不會被動。
// 單獨一個音節（泡泡、地鼠、磁磚、牌子）：畫在 100×100 裡，整個音節跟單一符號一樣高。
// 詞裡的音節：每欄 80×170，符號一律 54，欄裡置中，一個詞的各欄才會對齊、字一樣大。
function syllableMarkup (sym, inWord) {
  const light = sym.startsWith('˙')
  if (light) sym = sym.slice(1)
  const tone = (sym.match(/[ˊˇˋ]$/) || [''])[0]
  const core = tone ? sym.slice(0, -1) : sym
  if (!inWord && core.length < 2 && !tone && !light) return sym
  const n = core.length
  let W, H, g, cx, centers, toneX, toneSize
  if (inWord) {
    W = 80; H = 170; g = 54; cx = 28; toneX = 67; toneSize = 32
    centers = [...core].map((_, i) => 85 + (i - (n - 1) / 2) * 54)
  } else {
    W = 100; H = 100; cx = 50; toneX = 94; toneSize = 40
    g = n === 1 ? 90 : n === 2 ? 54 : 38
    centers = n === 1 ? [50] : n === 2 ? [26, 74] : [17, 50, 83]
  }
  const glyphs = [...core].map((ch, i) => `<text x="${cx}" y="${centers[i]}" font-size="${g}">${ch}</text>`).join('')
  const toneSvg = tone ? `<text class="tone" x="${toneX}" y="${centers[n - 1] + g * 0.15}" font-size="${toneSize}">${tone}</text>` : ''
  const lightSvg = light ? `<text class="tone" x="${cx}" y="${centers[0] - g * 0.62}" font-size="${toneSize}">˙</text>` : ''
  return `<svg class="syl n${n}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-label="${light ? '˙' : ''}${core}${tone}">${lightSvg}${glyphs}${toneSvg}</svg>`
}

// 詞的圖：img/words/<國字>.png 有就用，沒有退回表情符號

  const text = WORD_TEXT[word] || ''
