// 打地鼠玩法。符號從洞裡冒出來又縮回去，同時會有兩三個在外面，狗狗喊一個音，拍到對的就過關。
// 不計時、不扣分：沒拍到就等它下次再冒出來，拍錯才算錯（交給 main.js 記錄）。
// 介面跟釣魚一樣：start、lock/unlock、hint、shake、celebrate、sad、onAnswer、layout、destroy。


const HOLES = [[330, 430], [600, 430], [870, 430], [460, 620], [730, 620], [1000, 620]]
const UP_MS = 3200 // 每一個冒出來停多久（2026-09-25 使用者說太快，從 2100 放慢）
const POP_MS = 1100 // 每隔多久冒下一個（UP_MS／POP_MS ≈ 3，同時最多三個在外面）

// 直的：兩欄三排，在狗狗下面、星星上面那段置中，排距 190～300
function holesFor () {
  if (!STAGE.portrait) return HOLES
  const top = 400
  const bottom = STAGE.h - 120
  const step = Math.max(190, Math.min(300, (bottom - top - 200) / 2))
  const y0 = (top + bottom) / 2 - step + 10
  return [0, 1, 2].flatMap(r => [[230, y0 + r * step], [570, y0 + r * step]])
}

function shuffleList (arr) {
  const a = [...arr]
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]]
  }
  return a
}

function createWhack (root, { color = 0 } = {}) {
  root.innerHTML = bgHtml('garden') + '<div class="frame">' +
    '<div class="dog-wrap whack-dog">' + dogSvg(color) + '</div>' +
    '<div class="holes">' + HOLES.map(() => `
      <div class="hole">
        <div class="hole-back"></div>
        <div class="mole"><span></span></div>
        <div class="hole-front"></div>
      </div>`).join('') + '</div></div>'
  mountBgs(root)
  const dogWrap = root.querySelector('.whack-dog')
  const holes = [...root.querySelectorAll('.hole')]
  const moles = holes.map(h => h.querySelector('.mole'))
  const hideTimers = new Map() // mole → 縮回去的計時器
  let handler = null
  let locked = true
  let current = null
  let running = false
  let timer = null
  let queue = []
  let glowOnce = false

  function layout () {
    holesFor().forEach(([x, y], i) => {
      holes[i].style.left = (x - 110) + 'px'
      holes[i].style.top = (y - 90) + 'px'
    })
  }
  layout()

  root.addEventListener('pointerdown', e => {
    const mole = e.target.closest('.mole')
    if (!mole || locked || !handler || !mole.classList.contains('up')) return
    handler(mole.dataset.symbol, mole)
  })

  function upMoles () { return moles.filter(m => m.classList.contains('up')) }
  function moleOf (symbol) { return upMoles().find(m => m.dataset.symbol === symbol) || null }
  function hideMole (m) {
    clearTimeout(hideTimers.get(m))
    hideTimers.delete(m)
    m.classList.remove('up')
  }
  function hideAll () { moles.forEach(hideMole) }

  // 出場順序：干擾項隨機，目標排在第 2 個，之後每 3 個出現一次
  function refill () {
    const distractors = shuffleList(current.options.filter(s => s !== current.target))
    const seq = []
    let d = 0
    for (let i = 0; i < 9; i++) {
      if (i % 3 === 1) seq.push(current.target)
      else { seq.push(distractors[d % distractors.length]); d++ }
    }
    queue.push(...seq)
  }

  // 每 POP_MS 從空的洞冒一個出來；同一個符號不會同時出現兩個
  function popNext () {
    if (!running) return
    timer = setTimeout(popNext, POP_MS)
    if (queue.length < 3) refill()
    const free = moles.filter(m => !m.classList.contains('up'))
    if (!free.length) return
    const showing = new Set(upMoles().map(m => m.dataset.symbol))
    const idx = queue.findIndex(s => !showing.has(s))
    if (idx < 0) return
    const sym = queue.splice(idx, 1)[0]
    const mole = free[Math.floor(Math.random() * free.length)]
    mole.dataset.symbol = sym
    mole.querySelector('span').innerHTML = symbolMarkup(sym)
    mole.classList.remove('shake', 'hit', 'hint-loop')
    if (sym === current.target && glowOnce) {
      mole.classList.add('hint-loop')
      glowOnce = false
    }
    mole.classList.add('up')
    hideTimers.set(mole, setTimeout(() => hideMole(mole), UP_MS))
  }

  function stopLoop () {
    running = false
    clearTimeout(timer)
    timer = null
  }

  function start (question) {
    current = question
    locked = true
    queue = []
    glowOnce = false
    stopLoop()
    hideAll()
    moles.forEach(m => m.classList.remove('hit', 'shake', 'hint-loop'))
  }

  function unlock () {
    locked = false
    if (!running) { running = true; timer = setTimeout(popNext, 200) }
  }
  function lock () { locked = true }

  // 提示：目標在外面就發光；不在就等它下一次冒出來時發一次
  function hint () {
    const m = moleOf(current.target)
    if (m) {
      m.classList.remove('hint-loop')
      void m.offsetWidth
      m.classList.add('hint-loop')
      return
    }
    glowOnce = true
  }
  function shake (symbol) {
    const mole = moleOf(symbol)
    if (!mole) return
    mole.classList.remove('shake')
    void mole.offsetWidth
    mole.classList.add('shake')
  }

  // 拍到了：停止冒出，其他的縮回去，拍到的那一個彈一下留在外面
  function celebrate (symbol) {
    return new Promise(resolve => {
      stopLoop()
      const mole = moleOf(symbol)
      upMoles().forEach(m => { if (m !== mole) hideMole(m) })
      if (mole) { clearTimeout(hideTimers.get(mole)); mole.classList.remove('hint-loop'); mole.classList.add('hit') }
      dogWrap.classList.remove('jump')
      void dogWrap.offsetWidth
      dogWrap.classList.add('jump')
      setTimeout(() => { if (mole) { mole.classList.remove('hit'); hideMole(mole) } resolve() }, 650)
    })
  }
  function sad () {
    dogWrap.classList.remove('tilt')
    void dogWrap.offsetWidth
    dogWrap.classList.add('tilt')
  }
  function onAnswer (fn) { handler = fn }
  function destroy () { stopLoop(); hideAll(); root.innerHTML = ''; handler = null }

  return { start, unlock, lock, hint, shake, celebrate, sad, onAnswer, layout, destroy }
}

// ===== memory.js =====
// 翻牌配對。幾對相同的符號蓋著，翻開唸音；找到一樣的兩張就配對成功。
// 介面：start(symbols)、onFlip(fn)、onPair(fn)、onDone(fn)、layout、destroy。配對邏輯在這裡，main.js 只管聲音和星星。


// 卡片位置：依張數排格子（左上角）。回 { pos, small }，small 表示要用小卡才排得進去
function gridLayout (count) {
  const portrait = STAGE.portrait
  const W = portrait ? 800 : 1200
  const top = 120
  const regionH = (portrait ? STAGE.h : 800) - top - 100
  const cols = portrait ? (count <= 6 ? 2 : 3) : (count <= 6 ? 3 : count <= 8 ? 4 : 5)
  const rows = Math.ceil(count / cols)
  const gap = 30
  let cw = 190
  let ch = 230
  let small = false
  if (rows * ch + (rows - 1) * gap > regionH) { cw = 160; ch = 195; small = true }
  const totalW = cols * cw + (cols - 1) * gap
  const totalH = rows * ch + (rows - 1) * gap
  const x0 = (W - totalW) / 2
  const y0 = top + Math.max(0, (regionH - totalH) / 2)
  const pos = []
  for (let i = 0; i < count; i++) {
    const c = i % cols
    const r = Math.floor(i / cols)
    pos.push([x0 + c * (cw + gap), y0 + r * (ch + gap)])
  }
  return { pos, small }
}

function shuffleCards (arr) {
  const a = [...arr]
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]]
  }
  return a
}

const PAW = `<svg viewBox="0 0 100 100" width="90" height="90" xmlns="http://www.w3.org/2000/svg" fill="#F6E7C8" opacity="0.9">
  <ellipse cx="50" cy="66" rx="24" ry="20"/><circle cx="24" cy="44" r="10"/><circle cx="42" cy="30" r="10"/><circle cx="60" cy="30" r="10"/><circle cx="77" cy="44" r="10"/></svg>`

function createMemory (root) {
  root.innerHTML = bgHtml('room') + '<div class="frame"><div class="cards-grid"></div></div>'
  mountBgs(root)
  const grid = root.querySelector('.cards-grid')
  let onFlipFn = null
  let onPairFn = null
  let onDoneFn = null
  let open = [] // 目前翻開、還沒配對的卡
  let locked = false
  let remaining = 0

  grid.addEventListener('pointerdown', e => {
    const card = e.target.closest('.mcard')
    if (!card || locked || card.classList.contains('open') || card.classList.contains('matched')) return
    card.classList.add('open')
    open.push(card)
    if (onFlipFn) onFlipFn(card.dataset.symbol)
    if (open.length < 2) return
    locked = true
    const [a, b] = open
    open = []
    if (a.dataset.symbol === b.dataset.symbol) {
      setTimeout(() => {
        a.classList.add('matched'); b.classList.add('matched')
        remaining--
        locked = false
        if (onPairFn) onPairFn(a.dataset.symbol)
        if (remaining === 0 && onDoneFn) setTimeout(onDoneFn, 600)
      }, 500)
    } else {
      setTimeout(() => {
        a.classList.remove('open'); b.classList.remove('open')
        locked = false
      }, 1100)
    }
  })

  function place () {
    const cards = [...grid.children]
    const { pos, small } = gridLayout(cards.length)
    grid.classList.toggle('small', small)
    cards.forEach((el, i) => {
      el.style.left = pos[i][0] + 'px'
      el.style.top = pos[i][1] + 'px'
    })
  }

  function start (symbols) {
    grid.innerHTML = ''
    open = []
    locked = false
    remaining = symbols.length
    const cards = shuffleCards(symbols.flatMap(s => [s, s]))
    cards.forEach((sym, i) => {
      const el = document.createElement('div')
      el.className = 'mcard'
      el.dataset.symbol = sym
      el.style.animationDelay = (i * 0.06) + 's'
      el.innerHTML = `<div class="mcard-inner"><div class="mcard-back">${PAW}</div><div class="mcard-front"><span>${symbolMarkup(sym)}</span></div></div>`
      grid.appendChild(el)
    })
    place()
  }

  return {
    start,
    onFlip (fn) { onFlipFn = fn },
    onPair (fn) { onPairFn = fn },
    onDone (fn) { onDoneFn = fn },
    layout () { place() },
    destroy () { root.innerHTML = ''; onFlipFn = onPairFn = onDoneFn = null },
  }
}

// ===== speak.js =====
// 唸給狗狗聽。狗狗舉一張牌，她按麥克風唸出來，用瀏覽器的語音辨識判斷。
// 辨識小孩的單音不會很準，所以 main.js 只在唸對時記錄，沒聽出來不算她錯。
// 介面：show(symbol)、setListening(bool)、heard(text)、celebrate()、sad()、onMic(fn)、destroy。
// 另外匯出 speechAvailable()、createListener()、matchesSymbol()、openMicMeter()。


const MIC_SVG = `<svg viewBox="0 0 24 24" width="90" height="90" fill="#fff"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-3.1A8 8 0 0 0 20 11h-2z"/></svg>`

function speechAvailable () {
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition)
}

// 辨識器：每按一次麥克風開一次辨識（一句話就結束），不用連續模式。
// 網站在 https 上，Chrome 記得麥克風權限，不會每次都問；連續模式在筆電 Chrome 上實測會自己結束、之後收不到聲音。
// next(ms, isMatch) 回 { status, transcripts }：
//   heard 有聽到字、silent 時間到沒聲音、denied 麥克風被擋、nomic 沒有麥克風、network 辨識服務連不上、unavailable 瀏覽器沒這功能
// 也收「還在猜」的中途結果：對得上答案（isMatch）就直接算聽到；時間到還沒定案就拿最後一次中途結果判。
// 中途結果經 onInterim 丟出去即時顯示。events 記最近幾個辨識事件，沒聽到時顯示給大人看。
function createListener () {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition
  let r = null // 目前這一次的辨識
  let waiter = null // { resolve, timer, isMatch, interim }
  let fault = null // 'denied' | 'nomic' | 'network' | null
  let interimFn = null
  const events = []
  function log (name) { events.push(name); if (events.length > 8) events.shift() }

  function deliver (status, transcripts = []) {
    if (!waiter) return
    clearTimeout(waiter.timer)
    const { resolve } = waiter
    waiter = null
    resolve({ status, transcripts })
    if (r) { try { r.onend = null; r.abort() } catch (err) { /* 已停 */ } r = null }
  }

  function listenOnce () {
    r = new R()
    r.lang = 'zh-TW'
    r.continuous = false
    r.interimResults = true
    r.maxAlternatives = 5
    r.onstart = () => log('start')
    r.onaudiostart = () => log('audio')
    r.onsoundstart = () => log('sound')
    r.onspeechstart = () => log('speech')
    r.onspeechend = () => log('speechend')
    r.onnomatch = () => log('nomatch')
    r.onresult = e => {
      log('result')
      const finals = []
      const interims = []
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i]
        for (const alt of res) (res.isFinal ? finals : interims).push(alt.transcript)
      }
      if (finals.length) { deliver('heard', finals.concat(interims)); return }
      if (!interims.length) return
      if (interimFn) interimFn(interims[0])
      if (!waiter) return
      waiter.interim = interims
      if (waiter.isMatch && waiter.isMatch(interims)) deliver('heard', interims)
    }
    r.onerror = e => {
      log('error:' + e.error)
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { fault = 'denied'; deliver('denied') }
      else if (e.error === 'audio-capture') { fault = 'nomic'; deliver('nomic') }
      else if (e.error === 'network') { fault = 'network'; deliver('network') }
      // no-speech、aborted：等 onend 收尾
    }
    // 這一次結束了還沒判：有中途結果就拿它判，沒有就算沒聽到
    r.onend = () => {
      log('end')
      r = null
      if (!waiter) return
      if (waiter.interim.length) deliver('heard', waiter.interim); else deliver('silent')
    }
    try { r.start() } catch (err) { log('startfail'); r = null; deliver('silent') }
  }

  return {
    start () { /* 不用預先開，按麥克風時才開一次 */ },
    stop () { deliver('silent') },
    fault () { return !R ? 'unavailable' : fault },
    onInterim (fn) { interimFn = fn },
    debug () { return events.join(' ') || '（沒有任何辨識事件）' },
    next (ms = 5000, isMatch = null) {
      if (!R) return Promise.resolve({ status: 'unavailable', transcripts: [] })
      if (fault) return Promise.resolve({ status: fault, transcripts: [] })
      return new Promise(resolve => {
        if (waiter) deliver('silent')
        events.length = 0 // 每按一次重新記，訊息只顯示這一次的經過
        const w = { resolve, isMatch, interim: [] }
        w.timer = setTimeout(() => { if (w.interim.length) deliver('heard', w.interim); else deliver('silent') }, ms)
        waiter = w
        listenOnce()
      })
    },
  }
}

// 音量計：自己開一條麥克風，量瀏覽器實際收到多大的聲音。
// 用途兩個：按麥克風時按鈕外圈跟著聲音跳（小孩知道狗狗有在聽），
// 沒聽到的時候把「最大音量」和「用哪個麥克風」寫給大人看，分得出是麥克風沒聲音還是辨識服務的問題。
// 回 { level(), peak(), resetPeak(), label, stop() }；拿不到麥克風回 { error: 'denied' | 'nomic' | 'unknown' }
async function openMicMeter () {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return { error: 'unknown' }
  let stream
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true })
  } catch (err) {
    const name = err && err.name
    if (name === 'NotAllowedError' || name === 'SecurityError') return { error: 'denied' }
    if (name === 'NotFoundError' || name === 'NotReadableError') return { error: 'nomic' }
    return { error: 'unknown' }
  }
  const track = stream.getAudioTracks()[0]
  const AC = window.AudioContext || window.webkitAudioContext
  const ctx = new AC()
  if (ctx.state === 'suspended') ctx.resume()
  const src = ctx.createMediaStreamSource(stream)
  const an = ctx.createAnalyser()
  an.fftSize = 1024
  src.connect(an)
  const buf = new Float32Array(an.fftSize)
  let peak = 0
  function level () {
    an.getFloatTimeDomainData(buf)
    let sum = 0
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i]
    // 說話的 RMS 大約 0.02～0.2，放大到 0～1 好看
    const v = Math.min(1, Math.sqrt(sum / buf.length) * 6)
    if (v > peak) peak = v
    return v
  }
  return {
    level,
    peak: () => peak,
    resetPeak () { peak = 0 },
    label: (track && track.label) || '（不知道名稱的麥克風）',
    muted: () => !!(track && (track.muted || !track.enabled || track.readyState !== 'live')),
    stop () { stream.getTracks().forEach(t => t.stop()); ctx.close() },
  }
}

// 辨識結果裡出現符號本身，或它的同音字任何一個，就算唸對
// 詞（音節之間有空白）要嚴一點：詞裡不重複的字，兩個字的詞要全部出現，三個字的詞至少對兩個。
// 不然只唸「火」就會同時算火車、火箭、火山對。
function matchesSymbol (symbol, transcripts) {
  const accept = SPEAK_ACCEPT[symbol] || ''
  const isWord = symbol.includes(' ')
  return transcripts.some(t => {
    const clean = String(t).replace(/[\s，。、？！,.?!]/g, '')
    if (clean.includes(symbol)) return true
    if (!isWord) return [...clean].some(ch => accept.includes(ch))
    if (clean.includes(accept)) return true
    const chars = [...new Set(accept)]
    const hit = chars.filter(ch => clean.includes(ch)).length
    return hit >= (chars.length >= 3 ? chars.length - 1 : chars.length)
  })
}

function createSpeak (root, { color = 0 } = {}) {
  root.innerHTML = bgHtml('room') + '<div class="frame">' +
    '<div class="dog-wrap speak-dog">' + dogSvg(color) + '</div>' +
    '<div class="sign"><div class="sign-board"><span></span></div><div class="sign-post"></div></div>' +
    '<div class="heard"></div>' +
    `<button class="mic-btn" aria-label="唸給狗狗聽">${MIC_SVG}</button></div>`
  mountBgs(root)
  const dogWrap = root.querySelector('.speak-dog')
  const signEl = root.querySelector('.sign')
  const signText = root.querySelector('.sign-board span')
  const heardEl = root.querySelector('.heard')
  const micBtn = root.querySelector('.mic-btn')
  let handler = null

  micBtn.addEventListener('pointerdown', () => { if (handler) handler() })

  function show (symbol) {
    signText.innerHTML = symbolMarkup(symbol)
    signEl.classList.remove('glow')
    heardEl.textContent = ''
    heardEl.classList.remove('show')
  }
  function setListening (on) {
    micBtn.classList.toggle('listening', on)
    dogWrap.classList.toggle('listening', on)
  }
  // 顯示辨識到的字或狀態，給旁邊的大人看，小孩不用看得懂
  function heard (text) {
    heardEl.textContent = text ? '「' + text + '」' : '…？'
    heardEl.classList.remove('warn')
    heardEl.classList.add('show')
  }
  function notice (text, isWarn = true) {
    heardEl.textContent = text
    heardEl.classList.toggle('warn', isWarn)
    heardEl.classList.add('show')
  }
  function setMicEnabled (on) {
    micBtn.classList.toggle('disabled', !on)
  }
  // 音量 0～1：按鈕外圈跟著聲音大小擴散
  function setLevel (v) {
    micBtn.style.setProperty('--lvl', v.toFixed(3))
  }
  function celebrate () {
    return new Promise(resolve => {
      signEl.classList.add('glow')
      dogWrap.classList.remove('jump')
      void dogWrap.offsetWidth
      dogWrap.classList.add('jump')
      setTimeout(resolve, 700)
    })
  }
  function sad () {
    dogWrap.classList.remove('tilt')
    void dogWrap.offsetWidth
    dogWrap.classList.add('tilt')
  }
  function onMic (fn) { handler = fn }
  function destroy () { root.innerHTML = ''; handler = null }

  return { show, setListening, heard, notice, setMicEnabled, setLevel, celebrate, sad, onMic, destroy }
}

// ===== ink.js =====
// 筆跡比對：把筆跡和範本都轉成同尺寸的 0/1 小圖，算兩張圖的距離。
// 純數學，不碰 DOM，可以在 node 測。用在「寫給狗狗看」的描寫判定與聽寫辨識。

// 把筆跡（多條折線）放大置中到 size×size 的座標系，長寬比不變，四邊留 margin。
function normalizePoints (strokes, size, margin) {
  const pts = strokes.flat()
  if (!pts.length) return []
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
  for (const [x, y] of pts) {
    if (x < minX) minX = x; if (x > maxX) maxX = x
    if (y < minY) minY = y; if (y > maxY) maxY = y
  }
  const w = Math.max(maxX - minX, 1)
  const h = Math.max(maxY - minY, 1)
  const scale = (size - margin * 2) / Math.max(w, h)
  const ox = (size - w * scale) / 2
  const oy = (size - h * scale) / 2
  return strokes.map(stroke => stroke.map(([x, y]) => [(x - minX) * scale + ox, (y - minY) * scale + oy]))
}

// 把折線畫成 size×size 的 0/1 圖，線寬 width。
function rasterize (strokes, size, width) {
  const bm = new Uint8Array(size * size)
  const r = width / 2
  const stamp = (x, y) => {
    const x0 = Math.max(0, Math.floor(x - r)), x1 = Math.min(size - 1, Math.ceil(x + r))
    const y0 = Math.max(0, Math.floor(y - r)), y1 = Math.min(size - 1, Math.ceil(y + r))
    for (let py = y0; py <= y1; py++) {
      for (let px = x0; px <= x1; px++) {
        if ((px - x) * (px - x) + (py - y) * (py - y) <= r * r) bm[py * size + px] = 1
      }
    }
  }
  for (const stroke of strokes) {
    if (stroke.length === 1) { stamp(stroke[0][0], stroke[0][1]); continue }
    for (let i = 1; i < stroke.length; i++) {
      const [ax, ay] = stroke[i - 1]
      const [bx, by] = stroke[i]
      const len = Math.hypot(bx - ax, by - ay)
      const steps = Math.max(1, Math.ceil(len / 0.5))
      for (let k = 0; k <= steps; k++) {
        const t = k / steps
        stamp(ax + (bx - ax) * t, ay + (by - ay) * t)
      }
    }
  }
  return bm
}

// 每個像素到最近墨點的距離（兩趟掃描的近似距離轉換）
function distanceField (bm, size) {
  const INF = size * 2
  const d = new Float32Array(size * size)
  for (let i = 0; i < d.length; i++) d[i] = bm[i] ? 0 : INF
  const at = (x, y) => d[y * size + x]
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let v = at(x, y)
      if (x > 0) v = Math.min(v, at(x - 1, y) + 1)
      if (y > 0) v = Math.min(v, at(x, y - 1) + 1)
      if (x > 0 && y > 0) v = Math.min(v, at(x - 1, y - 1) + 1.414)
      if (x < size - 1 && y > 0) v = Math.min(v, at(x + 1, y - 1) + 1.414)
      d[y * size + x] = v
    }
  }
  for (let y = size - 1; y >= 0; y--) {
    for (let x = size - 1; x >= 0; x--) {
      let v = at(x, y)
      if (x < size - 1) v = Math.min(v, at(x + 1, y) + 1)
      if (y < size - 1) v = Math.min(v, at(x, y + 1) + 1)
      if (x < size - 1 && y < size - 1) v = Math.min(v, at(x + 1, y + 1) + 1.414)
      if (x > 0 && y < size - 1) v = Math.min(v, at(x - 1, y + 1) + 1.414)
      d[y * size + x] = v
    }
  }
  return d
}

function meanDistance (from, toField) {
  let sum = 0, n = 0
  for (let i = 0; i < from.length; i++) {
    if (from[i]) { sum += toField[i]; n++ }
  }
  return n ? sum / n : Infinity
}

// 對稱的 chamfer 距離：a 的墨到 b 的平均距離，加 b 的墨到 a 的平均距離。越小越像。
function chamfer (a, b, size) {
  const da = distanceField(a, size)
  const db = distanceField(b, size)
  return meanDistance(a, db) + meanDistance(b, da)
}

// 描寫判定：範本被蓋到的比例（筆跡在 tol 像素內就算蓋到），以及筆跡畫到範本外的比例。
function coverage (template, drawing, size, tol) {
  const dDraw = distanceField(drawing, size)
  const dTpl = distanceField(template, size)
  let tplN = 0, covered = 0, drawN = 0, stray = 0
  for (let i = 0; i < size * size; i++) {
    if (template[i]) { tplN++; if (dDraw[i] <= tol) covered++ }
    if (drawing[i]) { drawN++; if (dTpl[i] > tol * 2) stray++ }
  }
  return { covered: tplN ? covered / tplN : 0, stray: drawN ? stray / drawN : 1 }
}

// 在候選範本裡找最像的，回傳依分數排序的 [{ symbol, score }]
function bestMatch (drawing, templates, size) {
  return Object.entries(templates)
    .map(([symbol, bm]) => ({ symbol, score: chamfer(drawing, bm, size) }))
    .sort((a, b) => a.score - b.score)
}

// ===== strokeplay.js =====
// 照筆順一筆一筆畫出注音符號。資料是教育部筆順學習網的（strokes.js）。
// 做法跟網站一樣：每一筆沿著書寫軌跡畫一條很粗的線，再用這一筆的外框裁切，線慢慢長出來就像在寫。
// strokeSvg(symbol, opts) 回 { svg, duration }：svg 是字串，塞進去動畫就開始；duration 是整個寫完要幾毫秒。


let uid = 0

function trackLength (track) {
  let len = 0
  for (let i = 1; i < track.length; i++) len += Math.hypot(track[i][0] - track[i - 1][0], track[i][1] - track[i - 1][1])
  return len
}

// 每一筆寫多久：短的也至少 0.35 秒，長的照長度加
function strokeTimes (symbol, { speed = 1 } = {}) {
  const strokes = STROKES[symbol] || []
  const GAP = 180
  let at = 0
  return strokes.map(s => {
    const dur = (350 + trackLength(s.track) / 2048 * 900) / speed
    const t = { delay: at, dur }
    at += dur + GAP / speed
    return t
  })
}

// opts：
//   color   寫出來的顏色
//   ghost   底下先放一層淡淡的整個字（null 不放）
//   animate false 就直接畫好（不動）
//   speed   動畫快慢，1 是正常
//   upto    只畫前幾筆（教學一筆一筆來時用）；其他筆只有淡影
function strokeSvg (symbol, { color = '#E0955B', ghost = 'rgba(43,58,74,0.12)', animate = true, speed = 1, upto = null } = {}) {
  const strokes = STROKES[symbol]
  if (!strokes) return { svg: '', duration: 0 }
  const id = 'stk' + (++uid)
  const times = strokeTimes(symbol, { speed })
  const n = upto == null ? strokes.length : upto
  const defs = strokes.map((s, i) => `<clipPath id="${id}-${i}"><path d="${s.d}"/></clipPath>`).join('')
  const ghostSvg = ghost ? strokes.map(s => `<path d="${s.d}" fill="${ghost}"/>`).join('') : ''
  const ink = strokes.slice(0, n).map((s, i) => {
    if (!animate) return `<path d="${s.d}" fill="${color}"/>`
    const width = Math.max(...s.track.map(p => p[2])) * 1.6
    const pts = s.track.map(p => p[0] + ' ' + p[1]).join(' L')
    const { delay, dur } = times[i]
    return `<path d="M${pts}" clip-path="url(#${id}-${i})" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1" style="animation: strokeDraw ${Math.round(dur)}ms linear ${Math.round(delay)}ms forwards"/>`
  }).join('')
  const last = times[n - 1]
  const duration = animate && last ? last.delay + last.dur : 0
  return {
    svg: `<svg class="stroke-svg" viewBox="0 0 2048 2048" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${ghostSvg}${ink}</svg>`,
    duration,
  }
}

function strokeCount (symbol) { return (STROKES[symbol] || []).length }

// 教寫字用的一層：done 前幾筆已經寫好（實心綠）、current 正在教的那一筆（淡橘，起筆處一個會跳的圓點和方向箭頭），
// 其他筆只有淡影。animateCurrent 為 true 時把 current 這一筆示範寫一次。回 { svg, duration }
function lessonSvg (symbol, { done = 0, current = null, animateCurrent = false, speed = 0.8 } = {}) {
  const strokes = STROKES[symbol]
  if (!strokes) return { svg: '', duration: 0 }
  const id = 'lsn' + (++uid)
  const parts = strokes.map((s, i) => {
    if (i < done) return `<path d="${s.d}" fill="#6B9E6B"/>`
    if (i === current) return `<path d="${s.d}" fill="rgba(224,149,91,0.28)"/>`
    return `<path d="${s.d}" fill="rgba(43,58,74,0.10)"/>`
  })
  let extra = ''
  let duration = 0
  if (current != null && strokes[current]) {
    const s = strokes[current]
    const [x0, y0] = s.track[0]
    const [x1, y1] = s.track[1] || [x0 + 1, y0]
    const ang = Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI
    // 方向箭頭放在起點往前一點的地方
    const k = Math.min(1, 260 / (Math.hypot(x1 - x0, y1 - y0) || 1))
    const ax = x0 + (x1 - x0) * k
    const ay = y0 + (y1 - y0) * k
    extra += `<g transform="translate(${ax} ${ay}) rotate(${ang})"><path d="M-40 -60 L50 0 L-40 60 Z" fill="#E0955B"/></g>`
    extra += `<circle class="lesson-dot" cx="${x0}" cy="${y0}" r="95" fill="#E0955B" stroke="#FFFDF7" stroke-width="22"/>`
    if (animateCurrent) {
      const dur = (350 + trackLength(s.track) / 2048 * 900) / speed
      const width = Math.max(...s.track.map(p => p[2])) * 1.6
      const pts = s.track.map(p => p[0] + ' ' + p[1]).join(' L')
      extra = `<clipPath id="${id}-c"><path d="${s.d}"/></clipPath>` +
        `<path d="M${pts}" clip-path="url(#${id}-c)" fill="none" stroke="#E0955B" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1" style="animation: strokeDraw ${Math.round(dur)}ms linear 200ms forwards"/>` + extra
      duration = dur + 200
    }
  }
  return { svg: `<svg class="stroke-svg" viewBox="0 0 2048 2048" xmlns="http://www.w3.org/2000/svg">${parts.join('')}${extra}</svg>`, duration }
}

// 判斷她寫的一筆（2048 座標的點）是不是照著第 k 筆寫：起筆夠近、收筆夠近、沿路大部分都有經過、沒有畫到很遠的地方。
// 容許範圍抓得鬆，小孩的手指很粗；方向靠起點和終點分辨。
function checkStroke (symbol, k, points) {
  const s = (STROKES[symbol] || [])[k]
  if (!s || !points.length) return false
  const track = s.track.map(p => [p[0], p[1]])
  // 很短的一筆（點）：點一下或短短一畫，落在這一筆附近就算
  if (trackLength(s.track) < 300) {
    const cx = track.reduce((a, p) => a + p[0], 0) / track.length
    const cy = track.reduce((a, p) => a + p[1], 0) / track.length
    return points.every(p => Math.hypot(p[0] - cx, p[1] - cy) < 420)
  }
  if (points.length < 2) return false
  const sample = []
  for (let i = 1; i < track.length; i++) {
    const [ax, ay] = track[i - 1]
    const [bx, by] = track[i]
    const n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / 60))
    for (let j = 0; j < n; j++) sample.push([ax + (bx - ax) * j / n, ay + (by - ay) * j / n])
  }
  sample.push(track[track.length - 1])
  const near = (p, list) => Math.min(...list.map(q => Math.hypot(p[0] - q[0], p[1] - q[1])))
  const start = Math.hypot(points[0][0] - track[0][0], points[0][1] - track[0][1])
  const last = points[points.length - 1]
  const end = Math.hypot(last[0] - track[track.length - 1][0], last[1] - track[track.length - 1][1])
  const covered = sample.filter(p => near(p, points) < 330).length / sample.length
  const stray = points.filter(p => near(p, sample) > 420).length / points.length
  return start < 400 && end < 450 && covered >= 0.65 && stray <= 0.3
}

// ===== write.js =====
// 寫給狗狗看。低階級是描寫（板子上有淡淡的範本），高階級是聽寫（空白板子）。
// 判定：描寫看蓋到範本多少；聽寫把筆跡跟這題的候選符號比，最像的當她寫的。
// 介面跟釣魚一樣：start、lock/unlock、hint、shake、celebrate、sad、onAnswer、destroy。


const PAD = 560 // 板子邊長（舞台座標）
const GRID = 64 // 比對用小圖邊長
const INK_WIDTH = 24
// 聽寫判定：跟正確答案的距離要小於這個才算對；比對時把形似對也放進候選，亂畫不會剛好對

// 「教我寫」：一枝筆加一個播放三角形

const glyphCache = {}
// 用遊戲字型把符號畫出來，轉成比對用的小圖。同一個符號只算一次。
function glyphBitmap (symbol) {
  if (glyphCache[symbol]) return glyphCache[symbol]
  const c = document.createElement('canvas')
  c.width = 256
  c.height = 256
  const ctx = c.getContext('2d')
  ctx.fillStyle = '#000'
  ctx.font = '900 190px "Microsoft JhengHei", "Noto Sans TC", sans-serif'
  ctx.textAlign = 'center'
  ctx.textBaseline = 'middle'
  ctx.fillText(symbol, 128, 136)
  const data = ctx.getImageData(0, 0, 256, 256).data
  const pts = []
  for (let y = 0; y < 256; y += 2) {
    for (let x = 0; x < 256; x += 2) {
      if (data[(y * 256 + x) * 4 + 3] > 128) pts.push([x, y])
    }
  }
  const norm = normalizePoints([pts], GRID, 6)
  const bm = rasterize(norm[0].map(p => [p]), GRID, 2.2)
  glyphCache[symbol] = bm
  return bm
}

function inkBitmap (strokes) {
  const norm = normalizePoints(strokes, GRID, 6)
  return rasterize(norm, GRID, 3)
}

function createWrite (root, { color = 0 } = {}) {
  root.innerHTML = bgHtml('room') + '<div class="frame">' +
    '<div class="dog-wrap write-dog">' + dogSvg(color) + '</div>' +
    `<div class="pad-wrap">
       <div class="pad-template"><span></span></div>
       <div class="pad-strokes"></div>
       <canvas class="pad" width="${PAD}" height="${PAD}"></canvas>
       <button class="pad-undo" aria-label="重寫">${UNDO_SVG}</button>
       <button class="pad-ok" aria-label="好了">${CHECK_SVG}</button>
       <button class="pad-learn hidden" aria-label="教我寫">${LEARN_BTN_SVG}</button>
     </div></div>`
  mountBgs(root)
  const dogWrap = root.querySelector('.write-dog')
  const padWrap = root.querySelector('.pad-wrap')
  const canvas = root.querySelector('.pad')
  const ctx = canvas.getContext('2d')
  const tplEl = root.querySelector('.pad-template')
  const tplText = tplEl.querySelector('span')
  const strokesEl = root.querySelector('.pad-strokes')
  const learnBtn = root.querySelector('.pad-learn')
  let learnFn = null
  learnBtn.addEventListener('pointerdown', e => { e.stopPropagation(); if (learnFn) learnFn() })
  let handler = null
  let locked = true
  let current = null
  let trace = false
  let strokes = []
  let drawing = null

  ctx.lineCap = 'round'
  ctx.lineJoin = 'round'
  ctx.lineWidth = INK_WIDTH
  ctx.strokeStyle = '#2B3A4A'

  // 用舞台座標算，手機直拿舞台轉 90 度時也對
  function canvasPoint (e) {
    const [px, py] = stagePoint(e)
    const [ox, oy] = stageOffset(canvas)
    return [(px - ox) / canvas.offsetWidth * PAD, (py - oy) / canvas.offsetHeight * PAD]
  }
  canvas.addEventListener('pointerdown', e => {
    if (locked) return
    drawing = [canvasPoint(e)]
    strokes.push(drawing)
    try { canvas.setPointerCapture(e.pointerId) } catch (err) { /* 不給鎖也能畫 */ }
  })
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return
    const p = canvasPoint(e)
    const last = drawing[drawing.length - 1]
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 2) return
    drawing.push(p)
    ctx.beginPath()
    ctx.moveTo(last[0], last[1])
    ctx.lineTo(p[0], p[1])
    ctx.stroke()
  })
  const endStroke = () => {
    if (!drawing) return
    if (drawing.length === 1) { // 點一下也留個點
      ctx.beginPath(); ctx.arc(drawing[0][0], drawing[0][1], INK_WIDTH / 2, 0, Math.PI * 2); ctx.fillStyle = '#2B3A4A'; ctx.fill()
    }
    drawing = null
  }
  canvas.addEventListener('pointerup', endStroke)
  canvas.addEventListener('pointercancel', endStroke)

  function clearInk () {
    strokes = []
    drawing = null
    ctx.clearRect(0, 0, PAD, PAD)
  }
  root.querySelector('.pad-undo').addEventListener('pointerdown', () => { if (!locked) clearInk() })

  // 「好了」：把筆跡判成某個符號交給 main.js
  root.querySelector('.pad-ok').addEventListener('pointerdown', () => {
    if (locked || !handler) return
    const inkPts = strokes.flat().length
    if (inkPts < 6) { shakePad(); return }
    const ink = inkBitmap(strokes)
    if (trace) {
      const { covered, stray } = coverage(glyphBitmap(current.target), ink, GRID, 3)
      const ok = covered >= 0.7 && stray <= 0.3
      reveal(ok)
      handler(ok ? current.target : '__miss__', null)
      return
    }
    // 候選：這題的選項，加上目標的形似對
    const cands = new Set(current.options)
    for (const [a, b] of SIMILAR_SHAPE) {
      if (a === current.target) cands.add(b)
      if (b === current.target) cands.add(a)
    }
    const templates = {}
    for (const s of cands) templates[s] = glyphBitmap(s)
    const ranked = bestMatch(ink, templates, GRID)
    const best = ranked[0]
    const targetScore = ranked.find(r => r.symbol === current.target).score
    let verdict
    if (best.symbol === current.target && targetScore < ACCEPT_DISTANCE) verdict = current.target
    else if (best.symbol !== current.target && best.score < KNOWN_DISTANCE) verdict = best.symbol
    else verdict = '__unknown__'
    reveal(verdict === current.target)
    handler(verdict, null)
  })

  // 對答案：把正確符號疊在她寫的字上。對的：綠色的字；錯的：照教育部的筆順一筆一筆用橘色寫出來
  function reveal (ok) {
    tplEl.classList.remove('good', 'bad')
    if (ok) { tplEl.classList.add('show', 'good'); return }
    tplEl.classList.remove('show')
    strokesEl.innerHTML = strokeSvg(current.target).svg
    strokesEl.classList.add('show')
  }

  function shakePad () {
    padWrap.classList.remove('shake')
    void padWrap.offsetWidth
    padWrap.classList.add('shake')
  }

  // isTrace 由 main.js 依階級決定
  function start (question, { isTrace = false } = {}) {
    current = question
    trace = isTrace
    locked = true
    clearInk()
    tplText.textContent = question.target
    tplEl.classList.remove('good', 'bad', 'flash')
    tplEl.classList.toggle('show', trace)
    strokesEl.innerHTML = ''
    strokesEl.classList.remove('show')
    learnBtn.classList.add('hidden')
    learnFn = null
    padWrap.classList.remove('shake', 'glow')
  }
  function unlock () { locked = false }
  function lock () { locked = true }
  // 提示：閃一下範本
  function hint () {
    tplEl.classList.add('show', 'flash')
    setTimeout(() => { tplEl.classList.remove('flash'); if (!trace) tplEl.classList.remove('show') }, 1500)
  }
  function shake () { shakePad() }
  function celebrate () {
    return new Promise(resolve => {
      padWrap.classList.add('glow')
      dogWrap.classList.remove('jump')
      void dogWrap.offsetWidth
      dogWrap.classList.add('jump')
      setTimeout(resolve, 700)
    })
  }
  function sad () {
    dogWrap.classList.remove('tilt')
    void dogWrap.offsetWidth
    dogWrap.classList.add('tilt')
  }
  // 寫錯之後出現「教我寫」按鈕
  function offerLearn (fn) {
    learnFn = fn
    learnBtn.classList.remove('hidden')
  }
  function onAnswer (fn) { handler = fn }
  function destroy () { root.innerHTML = ''; handler = null; learnFn = null }

  return { start, unlock, lock, hint, shake, celebrate, sad, offerLearn, onAnswer, destroy }
}

// ===== learn.js =====
// 學寫字：純練習，不記進度。一個符號先照筆順示範一次，再讓她一筆一筆寫：
// 這一筆淡淡的橘色、起筆處有一個會跳的圓點和方向箭頭；寫對了這一筆變綠色、換下一筆，寫錯了再示範這一筆。
// 筆順資料是教育部的（strokeplay.js）。也可以疊在「寫給狗狗看」上面用（overlay），教完回去原本那一題。
// 介面：teach(symbol) 回 Promise，整個字寫完才 resolve；onReplay 由板子上的按鈕自己處理；celebrate、sad、destroy。


const LEARN_PAD = 540 // 板子內部邊長（CSS px，跟 .pad 一樣）
const LEARN_GUIDE = 30 // 範本距板子邊的距離，範本是 480×480
const LEARN_INK = 22
const LEARN_REPLAY_SVG = '<svg viewBox="0 0 24 24" width="44" height="44" fill="#fff"><path d="M8 5v14l11-7z"/></svg>'
const LEARN_CLOSE_SVG = '<svg viewBox="0 0 24 24" width="40" height="40" fill="#fff"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>'

function createLearn (root, { color = 0, overlay = false, onClose = null } = {}) {
  root.innerHTML = (overlay ? '<div class="learn-backdrop"></div>' : bgHtml('room')) + '<div class="frame">' +
    (overlay ? `<button class="round-btn learn-close" aria-label="回去">${LEARN_CLOSE_SVG}</button>` : '<div class="dog-wrap write-dog">' + dogSvg(color) + '</div>') +
    `<div class="pad-wrap learn-pad">
       <div class="learn-guide"></div>
       <canvas class="pad" width="${LEARN_PAD}" height="${LEARN_PAD}"></canvas>
       <button class="pad-undo learn-replay" aria-label="再看一次">${LEARN_REPLAY_SVG}</button>
     </div></div>`
  if (!overlay) mountBgs(root)
  const dogWrap = root.querySelector('.write-dog')
  const padWrap = root.querySelector('.learn-pad')
  const guide = root.querySelector('.learn-guide')
  const canvas = root.querySelector('.pad')
  const ctx = canvas.getContext('2d')
  ctx.lineCap = 'round'
  ctx.lineJoin = 'round'
  ctx.lineWidth = LEARN_INK
  ctx.strokeStyle = '#2B3A4A'
  if (overlay && onClose) root.querySelector('.learn-close').addEventListener('pointerdown', e => { e.stopPropagation(); onClose() })

  let symbol = null
  let k = 0 // 正在教第幾筆
  let locked = true
  let drawing = null
  let finish = null // teach() 的 resolve
  let timer = null
  let gone = false

  // 板子上的點（CSS px）換成筆順資料的 2048 座標
  function toGlyph ([x, y]) { return [(x - LEARN_GUIDE) / (LEARN_PAD - LEARN_GUIDE * 2) * 2048, (y - LEARN_GUIDE) / (LEARN_PAD - LEARN_GUIDE * 2) * 2048] }
  function canvasPoint (e) {
    const [px, py] = stagePoint(e)
    const [ox, oy] = stageOffset(canvas)
    return [(px - ox) / canvas.offsetWidth * LEARN_PAD, (py - oy) / canvas.offsetHeight * LEARN_PAD]
  }
  function clearInk () { ctx.clearRect(0, 0, LEARN_PAD, LEARN_PAD) }
  function wait (ms) { return new Promise(resolve => { timer = setTimeout(resolve, ms) }) }

  // 示範整個字；示範完換她寫第 k 筆
  async function demo () {
    locked = true
    clearInk()
    const { svg, duration } = strokeSvg(symbol, { speed: 0.8 })
    guide.innerHTML = svg
    await wait(duration + 500)
    if (gone) return
    showStroke(false)
  }
  // 顯示正在教的這一筆；again 為 true 時先示範這一筆
  async function showStroke (again) {
    locked = true
    const { svg, duration } = lessonSvg(symbol, { done: k, current: k, animateCurrent: again })
    guide.innerHTML = svg
    if (again) {
      await wait(duration + 250)
      if (gone) return
      guide.innerHTML = lessonSvg(symbol, { done: k, current: k }).svg
    }
    locked = false
  }

  canvas.addEventListener('pointerdown', e => {
    if (locked) return
    clearInk()
    drawing = [canvasPoint(e)]
    try { canvas.setPointerCapture(e.pointerId) } catch (err) { /* 不給鎖也能畫 */ }
  })
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return
    const p = canvasPoint(e)
    const last = drawing[drawing.length - 1]
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 2) return
    drawing.push(p)
    ctx.beginPath()
    ctx.moveTo(last[0], last[1])
    ctx.lineTo(p[0], p[1])
    ctx.stroke()
  })
  // 放開手指就判這一筆
  const endStroke = async () => {
    if (!drawing) return
    const pts = drawing.map(toGlyph)
    drawing = null
    locked = true
    if (checkStroke(symbol, k, pts)) {
      k++
      clearInk()
      if (k >= strokeCount(symbol)) {
        guide.innerHTML = lessonSvg(symbol, { done: k }).svg
        await celebrate()
        if (gone) return
        const done = finish
        finish = null
        if (done) done()
        return
      }
      showStroke(false)
      return
    }
    // 寫錯：晃一下、狗狗歪頭，再示範這一筆
    shakePad()
    sad()
    await wait(450)
    if (gone) return
    clearInk()
    showStroke(true)
  }
  canvas.addEventListener('pointerup', endStroke)
  canvas.addEventListener('pointercancel', endStroke)

  root.querySelector('.learn-replay').addEventListener('pointerdown', () => { if (symbol && !locked) { k = 0; demo() } })

  function shakePad () {
    padWrap.classList.remove('shake')
    void padWrap.offsetWidth
    padWrap.classList.add('shake')
  }
  function celebrate () {
    return new Promise(resolve => {
      padWrap.classList.add('glow')
      if (dogWrap) { dogWrap.classList.remove('jump'); void dogWrap.offsetWidth; dogWrap.classList.add('jump') }
      setTimeout(() => { padWrap.classList.remove('glow'); resolve() }, 800)
    })
  }
  function sad () {
    if (!dogWrap) return
    dogWrap.classList.remove('tilt')
    void dogWrap.offsetWidth
    dogWrap.classList.add('tilt')
  }

  // 教一個符號，整個字寫完才 resolve
  function teach (sym) {
    symbol = sym
    k = 0
    padWrap.dataset.symbol = sym
    return new Promise(resolve => {
      finish = resolve
      demo()
    })
  }
  function destroy () { gone = true; clearTimeout(timer); root.innerHTML = ''; finish = null }

  return { teach, celebrate, sad, destroy, pad: padWrap }
}

// ===== matchline.js =====
// 連連看。左邊 4 個詞的注音，右邊 4 張圖打亂，從詞拉線到圖。對了線留著，錯了線消失。
// 介面：start(words)、onPair(fn(word, pickedWord))、onPicTap(fn(word))、markCorrect(word, pickedWord)、markWrong(word, pickedWord)、onDone(fn)、layout、destroy。
// 沒選詞的時候點圖，會呼叫 onPicTap（主流程拿去唸這個詞）。


// 版面：詞卡右緣（線的起點）、圖卡左緣（線的終點）、四列的中心 y
function geom () {
  if (!STAGE.portrait) return { left: 330, right: 740, rows: [120, 290, 460, 630], w: 1200, h: 800 }
  const H = STAGE.h
  const step = Math.min(300, (H - 430) / 3) // 列距最多 300，太高的螢幕就把四列擠在中間
  const mid = (260 + H - 170) / 2
  return { left: 330, right: 600, rows: [0, 1, 2, 3].map(i => Math.round(mid + (i - 1.5) * step)), w: 800, h: H }
}

function shuffleWords (arr) {
  const a = [...arr]
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]]
  }
  return a
}

function createMatchLine (root, { color = 0 } = {}) {
  root.innerHTML = bgHtml('room') + '<div class="frame">' +
    '<div class="dog-wrap match-dog">' + dogSvg(color) + '</div>' +
    '<svg class="lines" xmlns="http://www.w3.org/2000/svg"><g class="done"></g><line class="live" x1="0" y1="0" x2="0" y2="0"/></svg>' +
    '<div class="match-words"></div><div class="match-pics"></div></div>'
  mountBgs(root)
  const frame = root.querySelector('.frame')
  const dogWrap = root.querySelector('.match-dog')
  const wordsEl = root.querySelector('.match-words')
  const picsEl = root.querySelector('.match-pics')
  const linesSvg = root.querySelector('.lines')
  const doneG = root.querySelector('.lines .done')
  const live = root.querySelector('.lines .live')
  let pairFn = null
  let doneFn = null
  let picTapFn = null
  let remaining = 0
  let drag = null // { word, x0, y0 }
  let selected = null // 點一下詞再點一下圖也可以
  let drawn = [] // 已畫好的線 { word, picked, cls }，換版面時重畫

  function anchorOfWord (word) {
    const g = geom()
    const i = [...wordsEl.children].findIndex(c => c.dataset.symbol === word)
    return [g.left, g.rows[i]]
  }
  function anchorOfPic (word) {
    const g = geom()
    const i = [...picsEl.children].findIndex(c => c.dataset.symbol === word)
    return [g.right, g.rows[i]]
  }

  wordsEl.addEventListener('pointerdown', e => {
    const card = e.target.closest('.mword')
    if (!card || card.classList.contains('matched')) return
    wordsEl.querySelectorAll('.mword').forEach(c => c.classList.remove('picked'))
    card.classList.add('picked')
    selected = card.dataset.symbol
    const [x0, y0] = anchorOfWord(selected)
    drag = { word: selected, x0, y0 }
    live.setAttribute('x1', x0); live.setAttribute('y1', y0)
    live.setAttribute('x2', x0); live.setAttribute('y2', y0)
    live.classList.add('show')
    try { card.setPointerCapture(e.pointerId) } catch (err) { /* 不給鎖也能拉 */ }
  })
  root.addEventListener('pointermove', e => {
    if (!drag) return
    const [x, y] = framePoint(e, frame)
    live.setAttribute('x2', x); live.setAttribute('y2', y)
  })
  function endDrag (e) {
    if (!drag) return
    const el = document.elementFromPoint(e.clientX, e.clientY)
    const pic = el && el.closest('.mpic')
    live.classList.remove('show')
    const word = drag.word
    drag = null
    if (pic && !pic.classList.contains('matched') && pairFn) {
      selected = null
      wordsEl.querySelectorAll('.mword').forEach(c => c.classList.remove('picked'))
      pairFn(word, pic.dataset.symbol)
    }
    // 沒拉到圖：保留選取，讓她點圖也行
  }
  root.addEventListener('pointerup', endDrag)
  root.addEventListener('pointercancel', endDrag)
  picsEl.addEventListener('pointerdown', e => {
    const pic = e.target.closest('.mpic')
    if (!pic || drag) return
    if (!selected) { if (picTapFn) picTapFn(pic.dataset.symbol); return }
    if (pic.classList.contains('matched') || !pairFn) return
    const word = selected
    selected = null
    wordsEl.querySelectorAll('.mword').forEach(c => c.classList.remove('picked'))
    pairFn(word, pic.dataset.symbol)
  })

  function start (words) {
    remaining = words.length
    selected = null
    drag = null
    drawn = []
    doneG.innerHTML = ''
    wordsEl.innerHTML = words.map(w => `
      <div class="mword" data-symbol="${w}"><span>${symbolMarkup(w)}</span></div>`).join('')
    picsEl.innerHTML = shuffleWords(words).map(w => `
      <div class="mpic" data-symbol="${w}">${wordPicMarkup(w)}</div>`).join('')
    layout()
  }

  // 依目前版面放卡片、設線的畫布大小，並把畫過的線重畫
  function layout () {
    const g = geom()
    linesSvg.setAttribute('viewBox', `0 0 ${g.w} ${g.h}`)
    linesSvg.setAttribute('width', g.w)
    linesSvg.setAttribute('height', g.h)
    ;[...wordsEl.children].forEach((c, i) => { c.style.top = (g.rows[i] - 80) + 'px' })
    ;[...picsEl.children].forEach((c, i) => { c.style.top = (g.rows[i] - 80) + 'px' })
    doneG.innerHTML = ''
    for (const d of drawn) drawLine(d.word, d.picked, d.cls)
  }

  function drawLine (word, pickedWord, cls) {
    const [x1, y1] = anchorOfWord(word)
    const [x2, y2] = anchorOfPic(pickedWord)
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line')
    l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2)
    l.setAttribute('class', cls)
    doneG.appendChild(l)
    return l
  }
  function markCorrect (word, pickedWord) {
    drawn.push({ word, picked: pickedWord, cls: 'ok' })
    drawLine(word, pickedWord, 'ok')
    const w = wordsEl.querySelector(`.mword[data-symbol="${word}"]`)
    const p = picsEl.querySelector(`.mpic[data-symbol="${pickedWord}"]`)
    if (w) w.classList.add('matched')
    if (p) p.classList.add('matched')
    dogWrap.classList.remove('jump')
    void dogWrap.offsetWidth
    dogWrap.classList.add('jump')
    remaining--
    if (remaining === 0 && doneFn) setTimeout(doneFn, 900)
  }
  function markWrong (word, pickedWord) {
    const l = drawLine(word, pickedWord, 'bad')
    setTimeout(() => l.remove(), 700)
    const p = picsEl.querySelector(`.mpic[data-symbol="${pickedWord}"]`)
    if (p) { p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake') }
    dogWrap.classList.remove('tilt')
    void dogWrap.offsetWidth
    dogWrap.classList.add('tilt')
  }

  return {
    start,
    onPair (fn) { pairFn = fn },
    onDone (fn) { doneFn = fn },
    onPicTap (fn) { picTapFn = fn },
    markCorrect,
    markWrong,
    layout,
    destroy () { root.innerHTML = ''; pairFn = doneFn = picTapFn = null },
  }
}

// ===== fillblank.js =====
// 填空。左邊一張圖，牌子上詞的注音少一個音節（空格），下面幾塊音節，拖對的進空格（點一下也行）。
// 聲調填空（mode: 'tone'）也用這個畫面：音節都在，只有一個音節的調號是空格，下面幾塊是調號。
// 介面：start(q, { blankIndex, tiles, mode })、lock/unlock、onAnswer(fn(syllable))、onPicTap(fn(word))、fill()、bounce(syllable)、celebrate、sad、layout、destroy。


// 橫的：磁磚中心點（1200×800 frame 座標）
const TILE_SLOTS = { 2: [[480, 620], [760, 620]], 3: [[380, 620], [620, 620], [860, 620]], 4: [[300, 620], [500, 620], [700, 620], [900, 620]] }

// 直的：一排貼著下面，平均分
function tileSlots (n) {
  if (!STAGE.portrait) return TILE_SLOTS[n] || TILE_SLOTS[3]
  const step = n >= 4 ? 200 : 240
  const y = 110 + Math.max(0, (STAGE.h - 200 - 880) / 2) + 800
  return Array.from({ length: n }, (_, i) => [Math.round(400 + (i - (n - 1) / 2) * step), y])
}

function createFillBlank (root, { color = 0 } = {}) {
  root.innerHTML = bgHtml('room') + '<div class="frame">' +
    '<div class="dog-wrap fill-dog">' + dogSvg(color) + '</div>' +
    '<div class="fill-pic"></div>' +
    '<div class="sign fill-sign"><div class="sign-board"><span class="fill-word"></span></div><div class="sign-post"></div></div>' +
    '<div class="tiles"></div></div>'
  mountBgs(root)
  const frame = root.querySelector('.frame')
  const dogWrap = root.querySelector('.fill-dog')
  const picEl = root.querySelector('.fill-pic')
  const signEl = root.querySelector('.fill-sign')
  const wordEl = root.querySelector('.fill-word')
  const tilesEl = root.querySelector('.tiles')
  let handler = null
  let picTapFn = null
  let locked = true
  let current = null
  let blankIndex = 0
  let mode = 'syllable'
  let drag = null

  // 每個音節畫成詞的一欄，跟連連看一樣大；空格那欄：填音節的是虛線框，填聲調的是音節加調號位置的虛線框
  function renderWord (filled = null) {
    const syls = current.target.split(' ')
    const blankCell = s => {
      if (mode === 'tone') return filled ? wordSyllableMarkup(s) : wordSyllableMarkup(stripTone(s), { toneBlank: true })
      return filled ? wordSyllableMarkup(filled) : '<span class="blank"></span>'
    }
    wordEl.innerHTML = `<span class="word w${syls.length}">${syls.map((s, i) => i === blankIndex ? blankCell(s) : wordSyllableMarkup(s)).join('')}</span>`
  }

  picEl.addEventListener('pointerdown', () => { if (current && picTapFn) picTapFn(current.target) })

  tilesEl.addEventListener('pointerdown', e => {
    const t = e.target.closest('.tile')
    if (!t || locked) return
    const [sx, sy] = framePoint(e, frame)
    drag = { t, startX: sx, startY: sy, ox: parseFloat(t.style.left), oy: parseFloat(t.style.top), moved: false }
    t.classList.add('dragging')
    try { t.setPointerCapture(e.pointerId) } catch (err) { /* 不給鎖也能拖 */ }
  })
  tilesEl.addEventListener('pointermove', e => {
    if (!drag) return
    const [sx, sy] = framePoint(e, frame)
    const dx = sx - drag.startX
    const dy = sy - drag.startY
    if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true
    drag.t.style.left = (drag.ox + dx) + 'px'
    drag.t.style.top = (drag.oy + dy) + 'px'
  })
  function endDrag (e) {
    if (!drag) return
    const { t, ox, oy, moved } = drag
    drag = null
    t.classList.remove('dragging')
    // 放到空格上（或沒拖動、點一下）都算選這塊
    const blank = wordEl.querySelector('.blank, .blank-tone')
    let hit = !moved
    if (moved && blank) {
      // 空格中心換成舞台座標，放手的點離它夠近就算放進去
      const b = blank.getBoundingClientRect()
      const [bx, by] = stagePoint({ clientX: (b.left + b.right) / 2, clientY: (b.top + b.bottom) / 2 })
      const [px, py] = stagePoint(e)
      hit = Math.abs(px - bx) < 130 && Math.abs(py - by) < 160
    }
    if (hit && handler) { handler(t.dataset.syllable, t); return }
    t.classList.add('returning')
    t.style.left = ox + 'px'
    t.style.top = oy + 'px'
    setTimeout(() => t.classList.remove('returning'), 350)
  }
  tilesEl.addEventListener('pointerup', endDrag)
  tilesEl.addEventListener('pointercancel', endDrag)

  // 直的：圖、牌子、磁磚整組在畫面裡置中；橫的位置交給 CSS
  function placeTiles () {
    if (STAGE.portrait) {
      const groupTop = 110 + Math.max(0, (STAGE.h - 200 - 880) / 2)
      picEl.style.top = groupTop + 'px'
      signEl.style.top = (groupTop + 280) + 'px'
    } else {
      picEl.style.top = ''
      signEl.style.top = ''
    }
    const tiles = [...tilesEl.children]
    const slots = tileSlots(tiles.length)
    tiles.forEach((t, i) => {
      if (t.classList.contains('dragging') || t.classList.contains('gone')) return
      t.style.left = (slots[i][0] - 80) + 'px'
      t.style.top = (slots[i][1] - 80) + 'px'
    })
  }

  function start (question, { blankIndex: bi, tiles, mode: m = 'syllable' }) {
    current = question
    blankIndex = bi
    mode = m
    locked = true
    picEl.className = 'fill-pic'
    picEl.innerHTML = wordPicMarkup(question.target)
    signEl.classList.remove('glow')
    renderWord()
    tilesEl.innerHTML = ''
    tiles.forEach(syl => {
      const t = document.createElement('div')
      t.className = 'tile'
      t.dataset.syllable = syl
      t.innerHTML = `<span>${mode === 'tone' ? toneTileMarkup(syl) : symbolMarkup(syl)}</span>`
      tilesEl.appendChild(t)
    })
    placeTiles()
  }
  function tileOf (syl) { return tilesEl.querySelector(`.tile[data-syllable="${syl}"]`) }
  function unlock () { locked = false }
  function lock () { locked = true }
  // 對了：音節（或調號）填進空格，那塊磁磚消失
  function fill (syl) {
    renderWord(syl)
    const t = tileOf(syl)
    if (t) t.classList.add('gone')
  }
  // 錯了：彈回原位晃一下
  function bounce (syl) {
    const t = tileOf(syl)
    if (!t) return
    const i = [...tilesEl.children].indexOf(t)
    const slots = tileSlots(tilesEl.children.length)
    t.classList.add('returning')
    t.style.left = (slots[i][0] - 80) + 'px'
    t.style.top = (slots[i][1] - 80) + 'px'
    setTimeout(() => { t.classList.remove('returning', 'shake'); void t.offsetWidth; t.classList.add('shake') }, 300)
  }
  function celebrate () {
    return new Promise(resolve => {
      signEl.classList.add('glow')
      dogWrap.classList.remove('jump')
      void dogWrap.offsetWidth
      dogWrap.classList.add('jump')
      setTimeout(resolve, 700)
    })
  }
  function sad () {
    dogWrap.classList.remove('tilt')
    void dogWrap.offsetWidth
    dogWrap.classList.add('tilt')
  }
  function onAnswer (fn) { handler = fn }
  function onPicTap (fn) { picTapFn = fn }
  function layout () { placeTiles() }
  function destroy () { root.innerHTML = ''; handler = picTapFn = null }

  return { start, unlock, lock, fill, bounce, celebrate, sad, onAnswer, onPicTap, layout, destroy }
}

// 選人、首頁、結算、大人面板、舞台縮放。



// 舞台會跟著螢幕比例變形，所以不留邊：
//   橫的：高固定 800，寬照螢幕比例 1200～1800。畫面元素排在正中央 1200×800 的 .frame 裡，背景鋪滿整個舞台。
//   直的：寬固定 800，高照螢幕比例 1100～1800。.frame 就是整個舞台，各畫面另有直版排法（#stage.portrait）。
// 舞台大小放在 STAGE，也寫成 CSS 變數 --W、--H 給樣式用。
const STAGE = { w: 1200, h: 800, portrait: false }

function fitStage (stage) {
  const vv = window.visualViewport
  const vw = vv ? vv.width : window.innerWidth
  const vh = vv ? vv.height : window.innerHeight
  const portrait = vh > vw
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v))
  const W = portrait ? 800 : Math.round(clamp(800 * vw / vh, 1200, 1800))
  const H = portrait ? Math.round(clamp(800 * vh / vw, 1100, 1800)) : 800
  const changed = W !== STAGE.w || H !== STAGE.h || portrait !== STAGE.portrait
  STAGE.w = W
  STAGE.h = H
  STAGE.portrait = portrait
  stage.style.width = W + 'px'
  stage.style.height = H + 'px'
  stage.style.setProperty('--W', W + 'px')
  stage.style.setProperty('--H', H + 'px')
  stage.classList.toggle('portrait', portrait)
  const scale = Math.min(vw / W, vh / H)
  const x = (vw - W * scale) / 2
  const y = (vh - H * scale) / 2
  stage.style.transform = `translate(${x}px, ${y}px) scale(${scale})`
  return changed
}

// 背景層定位。橫的：放大到填滿舞台、貼底（碼頭那張靠左，其他置中）。
// 直的：草原一樣蓋滿（放大到填滿高度，左右裁掉）；碼頭那張要留住碼頭和狗狗的比例，
// 所以只放大到占畫面下半（至少填滿寬），貼左下，上面由 .bg-fill 的天空色補。縮放結果記在 dataset 給釣魚算竿尖用。
function layoutBg (el) {
  const art = el.querySelector('.bg-art')
  if (!art) return
  const { w: W, h: H, portrait } = STAGE
  let s, x, y
  if (portrait && el.dataset.fit === 'left') {
    // 螢幕越高，碼頭放得越大（1100 高時剛好填滿寬，1800 高時放大到 1.3 倍）
    s = Math.max(W / 1200, 0.667 + (H - 1100) / 700 * 0.633)
    x = 0
    y = H - 800 * s
  } else if (portrait) {
    s = H / 800
    x = (W - 1200 * s) / 2
    y = 0
  } else {
    s = Math.max(W / 1200, H / 800)
    y = H - 800 * s
    x = el.dataset.fit === 'left' ? 0 : (W - 1200 * s) / 2
  }
  art.style.transform = `translate(${x}px, ${y}px) scale(${s})`
  art.dataset.s = s
  art.dataset.x = x
  art.dataset.y = y
}
function mountBgs (root) {
  root.querySelectorAll('.bg').forEach(layoutBg)
}

// 螢幕座標換成舞台座標（1200×800 那套），縮放、旋轉都算進去。拖曳、畫字都用這個。
function stagePoint (e) {
  const stage = document.getElementById('stage')
  const m = new DOMMatrix(getComputedStyle(stage).transform)
  const p = m.inverse().transformPoint(new DOMPoint(e.clientX, e.clientY))
  return [p.x, p.y]
}

// 螢幕座標換成某個 .frame 裡的座標（橫的時候 frame 不在舞台左上角）
function framePoint (e, frame) {
  const [x, y] = stagePoint(e)
  return [x - frame.offsetLeft, y - frame.offsetTop]
}

// 元素在舞台裡的位置（不含 transform），一路加 offsetLeft/offsetTop 到舞台
function stageOffset (el) {
  let x = 0
  let y = 0
  // offsetLeft 是從外層的框線裡面算起，所以每往外一層要把那層的框線（clientLeft／clientTop）加回去
  for (let n = el; n && n.id !== 'stage'; n = n.offsetParent) {
    x += n.offsetLeft
    y += n.offsetTop
    const p = n.offsetParent
    if (p && p.id !== 'stage') { x += p.clientLeft; y += p.clientTop }
  }
  return [x, y]
}

// 手機：第一次點的時候進全螢幕並鎖橫向（要在使用者手勢裡呼叫；iPhone 不支援就算了）
let fullscreenPending = false
function goFullscreenOnPhone () {
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches
  const standalone = window.matchMedia && window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches
  if (!coarse || standalone || fullscreenPending || document.fullscreenElement || !document.documentElement.requestFullscreen) return
  fullscreenPending = true
  document.documentElement.requestFullscreen({ navigationUI: 'hide' }).then(() => {
    if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape')
  }).catch(() => {}).finally(() => { fullscreenPending = false })
}

function showScreen (name) {
  document.querySelectorAll('.screen').forEach(el => {
    el.classList.toggle('active', el.id === 'screen-' + name)
  })
}

function playResult (root, earned, { onTick = () => {}, onPerfect = () => {}, onPaw = () => {} } = {}) {
  const starEls = root.querySelectorAll('.result-stars .star')
  starEls.forEach(s => s.classList.remove('lit'))

    if (!ok) return
    setTimeout(() => starEls[i].classList.add('lit'), 400 + i * 350)

  const bonesEl = root.querySelector('#result-bones')
  const starsDone = 400 + earned.length * 350 + 300
  if (bonesEl) {
    setTimeout(() => {
      bonesEl.classList.add('show')
      const gainN = parseInt(bonesEl.dataset.gain, 10) || 0
      const total = parseInt(bonesEl.dataset.total, 10) || 0
      const gainEl = bonesEl.querySelector('.rb-gain')
      const totalEl = bonesEl.querySelector('.rb-total')
      const steps = Math.min(gainN, 20)
      for (let i = 1; i <= steps; i++) {
        setTimeout(() => {
          const v = Math.round(gainN * i / steps)
          gainEl.textContent = v
          totalEl.textContent = total - gainN + v
          onTick()
        }, i * 60)
      }
    }, starsDone)
  }

  if (paw) setTimeout(() => { paw.classList.add('on', 'stamp'); onPaw() }, starsDone + 1400)
  const crown = root.querySelector('#result-crown')

}

// 第 14 組起有名字（聲母組＋韻類），前面的組顯示符號本身
// 組太長時顯示組名：第 11–13 組是結合韻，第 14 組起用 syllables.js 產生的組名；都沒有就列出全部符號
const COMPOUND_NAMES = { 10: 'ㄧ結合韻', 11: 'ㄨ結合韻', 12: 'ㄩ結合韻' }
function groupName (i, g) {
  const n = i >= 13 ? GROUP_NAMES[i - 13] : COMPOUND_NAMES[i]
  return ' ' + (n ? n + '（' + g.length + ' 個）' : g.join(''))
}

function starColor (n) {
  if (n >= 4) return 'green'
  if (n >= 2) return 'yellow'
  return 'red'
}

function escapeHtml (s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))
}

// 大人面板：目前使用者的熟練度色塊、已經認得、試聽設定、匯出匯入、刪除使用者
const DISTRACT_LABEL = { random: '隨機', shape: '形似', sound: '音似' }
function tierLabel (t) {
  const idle = t.idleHint ? `發呆 ${t.idleHint} 秒才提示` : '不提示'
  const sim = t.similar >= 1 ? `一定放${DISTRACT_LABEL[t.distract]}干擾` : `${Math.round(t.similar * 10)} 成機率放形似音似干擾`
  return `${t.options} 選項、${sim}、${idle}`
}

// 兩段式確認：第一下按鈕變成確認文字，4 秒內再按一下才執行。不用瀏覽器對話框。
function armButton (btn, confirmText, onConfirm) {
  const original = btn.textContent
  let timer = null
  btn.onclick = () => {
    if (btn.classList.contains('armed')) {
      clearTimeout(timer)
      onConfirm()
      return
    }
    btn.classList.add('armed')
    btn.textContent = confirmText
    timer = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = original }, 4000)
  }
}

// 長期統計：累計題數與答對率，加最近 14 天每天練了幾題（藍＝答對、橘＝答錯，疊起來是當天總題數）
function statsHtml (state) {
  const life = lifetimeStats(state)
  const days = dailyStats(state, 14)
  const max = Math.max(1, ...days.map(d => d.total))
  const pct = life.total ? Math.round(life.correct / life.total * 100) : 0
  const bars = days.map(d => {
    const h = Math.round(d.total / max * 100)
    const hOk = d.total ? Math.round(d.correct / d.total * h) : 0
    const tip = `${d.date}：${d.total} 題，答對 ${d.correct}`
    return `<div class="dbar" title="${tip}" aria-label="${tip}">
      <div class="dbar-col" style="height:${h}%">
        <div class="dbar-bad" style="height:${100 - (d.total ? hOk / h * 100 : 0)}%"></div>
        <div class="dbar-ok" style="flex:1"></div>
      </div>
      <div class="dbar-n">${d.total || ''}</div>
      <div class="dbar-date">${d.date}</div>
    </div>`
  }).join('')
  return `
      <div class="panel-row panel-stats">
        <div class="stats-sum">累計 <b>${life.total}</b> 題，答對 <b>${life.correct}</b>（${pct}%）</div>
        <div class="dchart">
          <div class="dchart-title">最近 14 天每天練幾題　<span class="lg lg-ok"></span>答對　<span class="lg lg-bad"></span>答錯</div>
          <div class="dbars">${bars}</div>
        </div>
      </div>`
}

// 進度格分三頁：注音符號（第 1–13 組）、拼讀字、詞。詞的組多，全部擠在一頁太長
const PAGE_NAMES = { symbols: '注音符號', syllables: '拼讀字', words: '詞' }
function pageOf (gi, g) {
  if (gi < 13) return 'symbols'
  return g[0].includes(' ') ? 'words' : 'syllables'
}
const VOLUMES = [['voiceVol', '發音'], ['sfxVol', '音效'], ['musicVol', '背景音樂']]
const volPct = (settings, key) => Math.round((typeof settings[key] === 'number' ? settings[key] : 1) * 100)

function renderPanel (root, { profile, profiles, state, track = 'listen', page = null, onTrack, onPage, settings, voices, onKnownChange, onSettings, onVolumeTest, onStateChange, onExport, onImport, onResetProgress, onRemoveProfile, onClose, onSay, onCheck }) {
  // 沒指定頁：看詞軌、調軌就開詞那頁，其他軌開注音符號
  const curPage = page || (track === 'word' || track === 'tone' ? 'words' : 'symbols')
  const lifetime = state ? lifetimeStats(state) : { bySymbol: {} }
  const usersHtml = profiles.list.length
    ? profiles.list.map(p => `
      <div class="puser">

    : '<span>還沒有使用者</span>'

        const n = stars(state, s)

        const life = lifetime.bySymbol[s]
        const isWord = s.includes(' ')
        return `<div class="ptile ${starColor(n)}${isWord ? ' is-word' : ''}">

  root.querySelector('#sel-voice').onchange = e => onSettings({ ...settings, voiceName: e.target.value })
  const rng = root.querySelector('#rng-rate')
  rng.oninput = () => { root.querySelector('#rate-val').textContent = rng.value }

    root.querySelector('#tier-down').onclick = () => onStateChange({ tier: Math.max(0, state.tier - 1), recent: [] })

    root.querySelector('#file-import').onchange = e => {

  }
  root.querySelectorAll('[data-remove]').forEach(btn => {
    armButton(btn, '確定刪除？連進度一起刪', () => onRemoveProfile(btn.dataset.remove))
  })

// ===== fx.js =====
// 特效：答對時星星爆開、骨頭一根根飛進計數器、手機輕輕震動。
// 全部畫在舞台最上層的 #fx，不擋點擊。座標一律換成舞台座標，直版橫版都對。


const SPARK_COLORS = ['#E8C86A', '#E39AA8', '#6B9E6B', '#4A6FA5', '#E0955B']

function fxLayer () {
  let el = document.getElementById('fx')
  if (!el) {
    el = document.createElement('div')
    el.id = 'fx'
    document.getElementById('stage').appendChild(el)
  }
  return el
}

function centerOf (el) {
  const r = el.getBoundingClientRect()
  return stagePoint({ clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 })
}

// 在某個元素的中心爆出一圈星星和彩色小點
function burstAt (el, { count = 14, spread = 1 } = {}) {
  if (!el || !el.isConnected) return
  const [x, y] = centerOf(el)
  const layer = fxLayer()
  for (let i = 0; i < count; i++) {
    const p = document.createElement('span')
    const star = i % 3 === 0
    p.className = star ? 'fx-spark star' : 'fx-spark'
    if (star) { p.textContent = '★'; p.style.color = SPARK_COLORS[i % SPARK_COLORS.length] } else p.style.background = SPARK_COLORS[i % SPARK_COLORS.length]
    const a = (Math.PI * 2 * i) / count + Math.random() * 0.5
    const d = (80 + Math.random() * 90) * spread
    p.style.left = x + 'px'
    p.style.top = y + 'px'
    p.style.setProperty('--dx', Math.cos(a) * d + 'px')
    p.style.setProperty('--dy', Math.sin(a) * d + 'px')
    layer.appendChild(p)
    setTimeout(() => p.remove(), 900)
  }
}

// 骨頭從 fromEl 飛到 toEl，一根一根（最多 8 根），每根到了呼叫 onEach(i, last)。
// 找不到起點或終點就直接呼叫，數字照樣會更新。
function flyBones (fromEl, toEl, n, onEach = () => {}) {
  const k = Math.max(1, Math.min(n, 8))
  if (!fromEl || !toEl || !fromEl.isConnected || !toEl.isConnected) {
    for (let i = 0; i < k; i++) onEach(i, i === k - 1)
    return
  }
  const [x0, y0] = centerOf(fromEl)
  const [x1, y1] = centerOf(toEl)
  const layer = fxLayer()
  for (let i = 0; i < k; i++) {
    const b = document.createElement('span')
    b.className = 'fx-bone'
    b.innerHTML = boneSvg()
    layer.appendChild(b)
    // 走一條往上拱的弧線，每根高低左右都不太一樣
    const mx = (x0 + x1) / 2 + (Math.random() - 0.5) * 220
    const my = Math.min(y0, y1) - 70 - Math.random() * 90
    const anim = b.animate([
      { left: x0 + 'px', top: y0 + 'px', transform: 'translate(-50%, -50%) scale(0.5) rotate(0deg)', opacity: 0.2 },
      { left: mx + 'px', top: my + 'px', transform: 'translate(-50%, -50%) scale(1.15) rotate(200deg)', opacity: 1, offset: 0.45 },
      { left: x1 + 'px', top: y1 + 'px', transform: 'translate(-50%, -50%) scale(0.7) rotate(360deg)', opacity: 1 },
    ], { duration: 700, delay: i * 110, easing: 'cubic-bezier(.45,.05,.55,.95)', fill: 'both' })
    // 動畫被瀏覽器暫停（分頁在背景、省電模式）也要讓數字更新：時間到還沒飛完就直接算到了
    let done = false
    const arrive = () => { if (done) return; done = true; b.remove(); onEach(i, i === k - 1) }
    anim.onfinish = arrive
    setTimeout(arrive, 700 + i * 110 + 500)
  }
}

// 讓元素彈一下（計數器收到骨頭、腳印蓋上去）
function bump (el) {
  if (!el) return
  el.classList.remove('bump')
  void el.offsetWidth
  el.classList.add('bump')
}

// 手機震動：答對短短一下、答錯兩下。不支援的裝置什麼都不做
function buzz (pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern) } catch (err) { /* 不支援就算了 */ }
}
