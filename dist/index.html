<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>注音救援隊</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #26647E; touch-action: none; user-select: none; -webkit-user-select: none; }
body { font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif; }
button { font-family: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
.hidden { display: none !important; }

/* 舞台 1200×800，等比縮放置中 */
#stage { position: absolute; left: 0; top: 0; width: 1200px; height: 800px; transform-origin: 0 0; overflow: hidden; }
.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: block; }
.scene { position: absolute; left: 0; top: 0; }
.home-sky, .result-bg { position: absolute; inset: 0; }

/* 雲慢慢飄、太陽光慢慢轉 */
.cloud-wrap.c1 { animation: drift 38s linear infinite; }
.cloud-wrap.c2 { animation: drift 52s linear infinite reverse; }
.cloud-wrap.c3 { animation: drift 45s linear infinite; }
@keyframes drift { 0% { transform: translateX(-80px); } 100% { transform: translateX(80px); } }
.sun-rays { transform-origin: 1020px 130px; animation: spin 90s linear infinite; }
.home-sky .sun-rays, .result-bg .sun-rays { transform-origin: 1060px 90px; }
@keyframes spin { to { transform: rotate(360deg); } }
.waves .w1 { animation: wave 6s ease-in-out infinite; }
.waves .w2 { animation: wave 7.5s ease-in-out infinite reverse; }
.waves .w3 { animation: wave 9s ease-in-out infinite; }
@keyframes wave { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-70px); } }
.fish { animation: swim 14s ease-in-out infinite; }
@keyframes swim { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-120px); } }

/* 齒輪 */
.gear { position: absolute; right: 18px; top: 14px; width: 56px; height: 56px; border-radius: 50%; background: rgba(27,43,75,0.28); display: flex; align-items: center; justify-content: center; }
.gear:active { background: rgba(27,43,75,0.6); }
.gear-hint { position: absolute; right: 84px; top: 22px; background: #1B2B4B; color: #fff; font-size: 22px; padding: 8px 16px; border-radius: 12px; white-space: nowrap; pointer-events: none; }

/* 大按鈕共用：厚底陰影、按下去會沉 */
.chunky { border-radius: 32px; background: #fff; border: 6px solid #fff; box-shadow: 0 12px 0 #A9BFCF, 0 18px 30px rgba(20,60,110,0.18); transition: transform .1s, box-shadow .1s; }
.chunky:active { transform: translateY(8px); box-shadow: 0 4px 0 #A9BFCF, 0 8px 16px rgba(20,60,110,0.18); }

/* ---- 選人 ---- */
.profiles { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 44px; flex-wrap: wrap; padding: 60px 100px 120px; }
.profile-card { width: 250px; height: 330px; border-radius: 36px; background: #fff; border: 6px solid #fff; box-shadow: 0 12px 0 #A9BFCF, 0 18px 30px rgba(20,60,110,0.18); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; transition: transform .1s, box-shadow .1s; }
.profile-card:active { transform: translateY(8px); box-shadow: 0 4px 0 #A9BFCF; }
.profile-avatar { width: 200px; height: 200px; border-radius: 50%; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.profile-avatar .dog { width: 170px; height: 196px; margin-bottom: -10px; }
.profile-avatar .rod { display: none; }
.profile-name { font-size: 40px; font-weight: 900; color: #2B3A4A; }
.profile-card.add { background: rgba(255,255,255,0.4); border: 6px dashed rgba(255,255,255,0.95); box-shadow: none; }
.profile-card.add:active { transform: scale(0.96); }
.profile-plus { font-size: 130px; color: #fff; font-weight: 900; text-shadow: 0 4px 0 rgba(20,60,110,0.2); }
.profile-form { position: absolute; inset: 0; background: rgba(27,43,75,0.5); display: flex; align-items: center; justify-content: center; }
.profile-form-box { background: #fff; border-radius: 32px; padding: 40px; display: flex; flex-direction: column; gap: 26px; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
.color-pick { display: flex; gap: 16px; }
.color-dot { width: 60px; height: 60px; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 0 0 3px #E3ECF5; }
.color-dot.on { box-shadow: 0 0 0 5px #1B2B4B; }
#profile-name { font-size: 40px; padding: 10px 20px; border: 4px solid #C9DDF0; border-radius: 18px; width: 380px; text-align: center; font-weight: 900; color: #1B2B4B; }
.profile-form-actions { display: flex; gap: 20px; }
.profile-form-actions button { font-size: 30px; padding: 12px 44px; border-radius: 18px; background: #E8EEF5; color: #1B2B4B; font-weight: 700; box-shadow: 0 6px 0 #C9D6E4; }
.profile-form-actions button.primary { background: #6B9E6B; color: #fff; box-shadow: 0 6px 0 #4E7A4E; }
.profile-form-actions button:active { transform: translateY(4px); box-shadow: none; }

/* ---- 首頁 ---- */
.who { position: absolute; left: 26px; top: 18px; display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 60px; padding: 6px 30px 6px 6px; box-shadow: 0 6px 0 #A9BFCF; }
.who:active { transform: translateY(4px); box-shadow: none; }
.who-avatar { width: 84px; height: 84px; border-radius: 50%; background: #EAF1EC; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.who-avatar .dog { width: 74px; height: 86px; margin-bottom: -6px; }
.who-avatar .rod { display: none; }
.who-name { font-size: 34px; font-weight: 900; color: #2B3A4A; }
.cards { position: absolute; left: 0; right: 0; top: 190px; display: flex; justify-content: center; align-items: flex-end; gap: 34px; }
.card { position: relative; width: 250px; height: 334px; border-radius: 34px; background: #fff; border: 8px solid #fff; overflow: hidden; box-shadow: 0 14px 0 #A9BFCF, 0 22px 36px rgba(20,60,110,0.22); transition: transform .12s, box-shadow .12s; }
.card:nth-child(1) { transform: rotate(-3deg); }
.card:nth-child(2) { transform: rotate(-1deg); }
.card:nth-child(3) { transform: rotate(1deg); }
.card:nth-child(4) { transform: rotate(3deg); }
.card:active { transform: translateY(10px) scale(0.98); box-shadow: 0 4px 0 #A9BFCF; }
.card.locked .card-pic { filter: grayscale(0.9) brightness(0.9); opacity: 0.55; }
.card-pic { width: 100%; height: 100%; border-radius: 30px; overflow: hidden; }
.card-pic svg { width: 100%; height: 100%; display: block; }
.card-lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.card-lock svg { filter: drop-shadow(0 4px 0 rgba(0,0,0,0.25)); }

/* ---- 遊戲 ---- */
.play-area { position: absolute; inset: 0; }
.dog-wrap { position: absolute; left: 170px; top: 226px; width: 260px; height: 300px; transform-origin: 50% 100%; filter: drop-shadow(0 8px 0 rgba(0,0,0,0.12)); }
.dog-wrap.jump { animation: jump .7s ease-out; }
.dog-wrap.tilt { animation: tilt .6s ease-in-out; }
@keyframes jump { 0% { transform: translateY(0); } 35% { transform: translateY(-70px) rotate(-6deg); } 70% { transform: translateY(0); } 85% { transform: translateY(-16px); } 100% { transform: translateY(0); } }
@keyframes tilt { 0%,100% { transform: rotate(0); } 40% { transform: rotate(14deg); } }

.bubbles { position: absolute; inset: 0; }
.bubble { position: absolute; width: 176px; height: 176px; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #FFFDF7 0 12%, rgba(246,243,230,0.85) 40%, rgba(207,234,240,0.85) 72%, rgba(143,199,210,0.95));
  border: 7px solid #F6F3E6; box-shadow: 0 12px 26px rgba(0,60,120,0.28), inset 0 -14px 24px rgba(60,150,220,0.35);
  display: flex; align-items: center; justify-content: center; animation: bob 2.8s ease-in-out infinite; transition: transform .7s cubic-bezier(.3,.9,.4,1.1), opacity .3s; }
.bubble::after { content: ""; position: absolute; left: 26px; top: 20px; width: 40px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.95); transform: rotate(-30deg); }
.bubble span { font-size: 112px; font-weight: 900; color: #2B3A4A; line-height: 1; pointer-events: none; text-shadow: 0 3px 0 rgba(255,255,255,0.8); }
@keyframes bob { 0%,100% { margin-top: 0; } 50% { margin-top: -18px; } }
.bubble.hint-loop { animation: bob 2.8s ease-in-out infinite, wiggle 1.2s ease-in-out infinite; }
.bubble.hint-once { animation: bob 2.8s ease-in-out infinite, wiggle 1.2s ease-in-out 1; }
@keyframes wiggle { 0%,100% { box-shadow: 0 12px 26px rgba(0,60,120,0.28), inset 0 -14px 24px rgba(60,150,220,0.35); } 50% { box-shadow: 0 0 0 18px rgba(232,200,106,0.9), 0 12px 26px rgba(0,60,120,0.28); } }
.bubble.shake { animation: bob 2.8s ease-in-out infinite, shake .45s ease-in-out; }
@keyframes shake { 0%,100% { margin-left: 0; } 20% { margin-left: -16px; } 40% { margin-left: 14px; } 60% { margin-left: -10px; } 80% { margin-left: 8px; } }
.bubble.caught { animation: none; z-index: 5; }
.bubble.gone { opacity: 0; }

.topbar { position: absolute; left: 0; right: 0; top: 0; height: 110px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.round-btn { width: 100px; height: 100px; border-radius: 50%; background: #E0955B; border: 6px solid #F6F3E6; box-shadow: 0 8px 0 #B07242, 0 14px 24px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; transition: transform .1s, box-shadow .1s; }
.round-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #B07242; }
.round-btn.home { background: #6B9E6B; box-shadow: 0 8px 0 #4E7A4E, 0 14px 24px rgba(0,0,0,0.18); }
.round-btn.quit { background: rgba(27,43,75,0.35); border-color: rgba(255,255,255,0.7); box-shadow: none; width: 70px; height: 70px; }
.progress-stars { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 16px; pointer-events: none; }
.progress-stars .star { font-size: 66px; color: rgba(255,255,255,0.45); text-shadow: 0 3px 0 rgba(20,60,110,0.25); }
.progress-stars .star.lit { color: #E8C86A; text-shadow: 0 4px 0 #B99A44; animation: pop .5s; }
.progress-stars .star.dim { color: rgba(255,255,255,0.9); }
@keyframes pop { 0% { transform: scale(0.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }

/* ---- 結算 ---- */
.result-burst { position: absolute; left: 50%; top: 250px; width: 900px; height: 900px; margin-left: -450px; margin-top: -450px; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,253,247,0.22) 0 8deg, rgba(255,255,255,0) 8deg 20deg); animation: spin 40s linear infinite; }
.result-dogs { position: absolute; left: 0; right: 0; top: 330px; display: flex; justify-content: center; gap: 30px; }
.result-dogs .dog { animation: bounce 1s ease-in-out infinite; filter: drop-shadow(0 8px 0 rgba(0,0,0,0.12)); }
.result-dogs .dog:nth-child(2) { animation-delay: .2s; }
.result-dogs .dog:nth-child(3) { animation-delay: .4s; }
.result-dogs .rod { display: none; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-40px); } }
.result-stars { position: absolute; left: 0; right: 0; top: 110px; display: flex; justify-content: center; gap: 22px; }
.result-stars .star { font-size: 124px; color: rgba(27,43,75,0.15); }
.result-stars .star.lit { color: #E8C86A; text-shadow: 0 6px 0 #B99A44, 0 10px 20px rgba(0,0,0,0.15); animation: pop .5s; }
.result-actions { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; gap: 60px; }
.result-actions .round-btn { width: 130px; height: 130px; }
.confetti-wrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti { position: absolute; top: -24px; width: 14px; height: 26px; border-radius: 3px; animation: fall 3s linear infinite; }
.confetti.petal { width: 16px; height: 20px; border-radius: 50% 0 50% 0; }
@keyframes fall { to { top: 110%; transform: rotate(720deg) translateX(40px); } }

/* ---- 大人面板 ---- */
#screen-panel { background: #F4F7FB; overflow: auto; touch-action: pan-y; user-select: text; }
.panel { padding: 24px 40px 60px; color: #1B2B4B; font-size: 18px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.panel-head h2 { font-size: 30px; }
.panel-head small { font-size: 20px; color: #5A6B85; font-weight: 400; }
.panel-close { font-size: 22px; padding: 10px 28px; background: #1B2B4B; color: #fff; border-radius: 12px; }
.panel-row { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; background: #fff; border-radius: 14px; padding: 14px 20px; margin-bottom: 12px; }
.panel-row button, .panel-row .file-btn { font-size: 18px; padding: 8px 18px; background: #E8EEF5; border-radius: 10px; cursor: pointer; }
.panel-row button.danger { background: #FFE0E0; color: #B5232F; }
.panel-row button.danger.armed { background: #B5232F; color: #fff; }
.panel-msg { color: #B5232F; }
.panel-difficulty { flex-direction: column; align-items: flex-start; gap: 12px; }
.range-pick { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.range-groups { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.range-groups.dimmed, .range-pick label.dimmed { opacity: 0.45; }
.range-groups label { font-size: 17px; }
.panel-row button.mini { padding: 2px 12px; font-size: 20px; line-height: 1.2; margin: 0 2px; }
.panel-row button.mini:disabled { opacity: 0.35; cursor: default; }
.panel-users { gap: 14px 28px; }
.puser { display: flex; align-items: center; gap: 10px; }
.puser-dot { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
.puser-name { font-weight: 700; }
.panel-row input[type=file] { display: none; }
.panel-row select, .panel-row input[type=range] { font-size: 18px; }
.panel-hint { color: #5A6B85; margin: 8px 0 16px; }
.pgroup { margin-bottom: 18px; }
.pgroup-title { font-weight: 700; margin-bottom: 8px; }
.ptiles { display: flex; gap: 12px; flex-wrap: wrap; }
.ptile { width: 190px; background: #fff; border-radius: 14px; padding: 10px; border-left: 12px solid #ccc; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; align-items: center; }
.ptile.red { border-color: #FF6B6B; } .ptile.yellow { border-color: #FFD23F; } .ptile.green { border-color: #3CB371; }
.ptile-sym { font-size: 52px; font-weight: 900; grid-row: span 2; color: #1B2B4B; }
.ptile-stars { font-size: 16px; color: #D9AE1F; letter-spacing: 1px; }
.ptile-hist { font-size: 14px; color: #5A6B85; }
.ptile-known { font-size: 15px; }
.ptile-rep { width: 56px; font-size: 20px; text-align: center; border: 2px solid #C9DDF0; border-radius: 8px; justify-self: end; }

/* ---- 圖片插槽：img/ 有圖就蓋掉向量圖 ---- */
.art-slot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.has-art > svg { visibility: hidden; }
.dog-slot { position: relative; display: inline-block; width: 100%; height: 100%; }
.dog-slot .art-slot { object-fit: contain; }
.card-pic { position: relative; }
.home-sky, .result-bg, .play-area { position: absolute; }

/* ---- 翻牌 ---- */
.cards-grid { position: absolute; inset: 0; }
.mcard { position: absolute; width: 190px; height: 230px; perspective: 900px; cursor: pointer; animation: dealIn .4s ease-out both; }
@keyframes dealIn { from { opacity: 0; transform: translateY(40px) scale(0.8); } to { opacity: 1; transform: none; } }
.mcard-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.4,.2,.2,1); }
.mcard.open .mcard-inner, .mcard.matched .mcard-inner { transform: rotateY(180deg); }
.mcard-back, .mcard-front { position: absolute; inset: 0; border-radius: 26px; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border: 6px solid #F6F3E6; box-shadow: 0 10px 0 rgba(0,0,0,0.12), 0 14px 24px rgba(0,0,0,0.15); }
.mcard-back { background: linear-gradient(160deg, #6B9E6B, #4E7A4E); }
.mcard-front { background: #FFFDF7; transform: rotateY(180deg); }
.mcard-front span { font-size: 120px; font-weight: 900; color: #2B3A4A; line-height: 1; }
.mcard.matched .mcard-front { background: #F6E7C8; box-shadow: 0 0 0 10px rgba(232,200,106,0.7), 0 10px 0 rgba(0,0,0,0.12); }
.mcard.matched { animation: pop .5s; }

/* ---- 打地鼠 ---- */
.whack-dog { left: 30px; top: 90px; width: 260px; height: 300px; }
.holes { position: absolute; inset: 0; }
.hole { position: absolute; width: 220px; height: 200px; overflow: hidden; clip-path: inset(-60px 0 0 0); }
.hole-back { position: absolute; left: 20px; top: 110px; width: 180px; height: 70px; border-radius: 50%; background: #3E2A1A; box-shadow: inset 0 10px 14px rgba(0,0,0,0.5); }
.hole-front { position: absolute; left: 10px; top: 150px; width: 200px; height: 50px; border-radius: 50%; background: #6E9C58; pointer-events: none; }
.mole { position: absolute; left: 40px; top: 145px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFDF7, #F6E7C8 60%, #E2C89A); box-shadow: 0 6px 0 rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; transform: translateY(160px) scale(0.9); transition: transform .28s cubic-bezier(.3,1.4,.5,1); cursor: pointer; }
.mole.up { transform: translateY(-140px) scale(1); }
.mole span { font-size: 92px; font-weight: 900; color: #2B3A4A; line-height: 1; pointer-events: none; }
.mole.hint-loop { animation: wiggle 1.2s ease-in-out infinite; }
.mole.shake { animation: shake .45s ease-in-out; }
.mole.hit { background: radial-gradient(circle at 35% 30%, #FFF6C8, #E8C86A 60%, #B99A44); animation: pop .5s; }

/* ---- 唸給狗狗聽 ---- */
.speak-dog { left: 110px; top: 250px; width: 360px; height: 415px; }
.speak-dog .dog { width: 360px; height: 415px; }
.speak-dog .dog-slot .art-slot { width: 360px; height: 415px; }
.speak-dog.listening { animation: listenBob 1s ease-in-out infinite; }
@keyframes listenBob { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
.sign { position: absolute; left: 520px; top: 150px; width: 300px; }
.sign-board { width: 300px; height: 300px; border-radius: 36px; background: #FFFDF7; border: 10px solid #B08A63; box-shadow: 0 12px 0 #8E6D4C, 0 20px 30px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; transition: box-shadow .3s; }
.sign-board span { font-size: 210px; font-weight: 900; color: #2B3A4A; line-height: 1; }
.sign-post { width: 28px; height: 160px; margin: -6px auto 0; background: #B08A63; border-radius: 6px; }
.sign.glow .sign-board { box-shadow: 0 0 0 18px rgba(232,200,106,0.75), 0 12px 0 #8E6D4C; }
.heard { position: absolute; left: 520px; top: 630px; width: 300px; text-align: center; font-size: 30px; color: #5A6B85; opacity: 0; transition: opacity .3s; }
.heard.show { opacity: 1; }
.mic-btn { position: absolute; left: 920px; top: 300px; width: 200px; height: 200px; border-radius: 50%; background: #C8553D; border: 10px solid #F6F3E6; box-shadow: 0 12px 0 #96402D, 0 20px 30px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; transition: transform .1s, box-shadow .1s; }
.mic-btn:active { transform: translateY(8px); box-shadow: 0 4px 0 #96402D; }
.mic-btn.listening { animation: micPulse 1s ease-in-out infinite; background: #E0955B; }
@keyframes micPulse { 0%,100% { box-shadow: 0 12px 0 #B07242, 0 0 0 0 rgba(224,149,91,0.6); } 50% { box-shadow: 0 12px 0 #B07242, 0 0 0 30px rgba(224,149,91,0); } }

</style>
</head>
<body>
<div id="stage">
  <section class="screen" id="screen-profiles"></section>
  <section class="screen" id="screen-home"></section>
  <section class="screen" id="screen-game">
    <div class="play-area"></div>
    <div class="topbar">
      <button class="round-btn quit" id="btn-quit" aria-label="回首頁">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="#fff"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
      </button>
      <button class="round-btn" id="btn-replay" aria-label="再聽一次">
        <svg viewBox="0 0 24 24" width="60" height="60" fill="#fff"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      </button>
    </div>
    <div class="progress-stars"></div>
  </section>
  <section class="screen" id="screen-result"></section>
  <section class="screen" id="screen-panel"></section>
</div>
<script>
// ===== data.js =====
// 37 個注音符號與相關靜態資料。純資料，不含邏輯。

const SYMBOLS = [
  'ㄅ', 'ㄆ', 'ㄇ', 'ㄈ', 'ㄉ', 'ㄊ', 'ㄋ', 'ㄌ', 'ㄍ', 'ㄎ', 'ㄏ',
  'ㄐ', 'ㄑ', 'ㄒ', 'ㄓ', 'ㄔ', 'ㄕ', 'ㄖ', 'ㄗ', 'ㄘ', 'ㄙ',

// ===== scheduler.js =====
// 出題邏輯：熟練度、解鎖、加權出題、混淆對加練、階級升降。
// 純函式，不碰 DOM，不碰 localStorage。所有函式回傳新狀態，不改舊的。


const HISTORY_CAP = 10
const RECENT_CAP = 10
const ROUND_SIZE = 5
const UNLOCK_STARS = 4
const DRILL_CLEAR_STREAK = 3

// 一個數字代表整體難度，往上走選項變多、干擾項變刁、提示變少。
const TIERS = [
  { options: 2, distract: 'random', hint: 2 },
  { options: 3, distract: 'random', hint: 2 },
  { options: 3, distract: 'shape', hint: 1 },
  { options: 4, distract: 'shape', hint: 1 },
  { options: 4, distract: 'sound', hint: 0 },
  { options: 6, distract: 'sound', hint: 0 },
]

function createState ({ known = [], groups = null } = {}) {
  return {
    version: 1,
    mastery: {},
    known: [...known],
    confusions: {},
    tier: 0,
    recent: [],
    groups,
    lockTier: null, // 家長鎖定的階級；null 表示自動
    rangeGroups: null, // 家長指定的練習組別索引；null 或空表示自動解鎖
    unlockedUpTo: null, // 家長手動跳級：至少解鎖到第幾組（1 起算）；null 表示不干預
  }
}

// 自動解鎖到第幾組（1 起算）：練熟一組開下一組，再跟家長手動跳級的值取大者
function unlockedCount (state) {
  const groups = state.groups || GROUPS
  let n = 1
  while (n < groups.length && groupAverage(state, groups[n - 1]) >= UNLOCK_STARS) n++
  const manual = typeof state.unlockedUpTo === 'number' ? state.unlockedUpTo : 1
  return Math.min(groups.length, Math.max(n, manual))
}

// 清除練習紀錄：星星、混淆對、階級、最近答題全部歸零。名字、認得、難度鎖、範圍都保留。
function resetProgress (state) {
  return { ...state, mastery: {}, confusions: {}, tier: 0, recent: [] }
}

// 出題實際用的階級：家長有鎖就用鎖的，否則用自動升降的
function effectiveTier (state) {
  return typeof state.lockTier === 'number' ? state.lockTier : state.tier
}

// 0–5 星。只看最近 10 次；樣本少時星星不會超過樣本數，避免答對一次就 5 星。
function stars (state, symbol) {
  const history = (state.mastery[symbol] && state.mastery[symbol].history) || []
  if (history.length === 0) return state.known.includes(symbol) ? 3 : 0
  const okCount = history.filter(h => h.ok).length
  return Math.min(Math.round((okCount / history.length) * 5), history.length)
}

function groupAverage (state, group) {
  return group.reduce((sum, s) => sum + stars(state, s), 0) / group.length
}

// 目前可出題的符號。家長有指定範圍就只出那幾組；否則是已解鎖的組 + 家長勾「已經認得」的。
function activePool (state) {
  const groups = state.groups || GROUPS
  if (Array.isArray(state.rangeGroups) && state.rangeGroups.length) {
    return state.rangeGroups.filter(i => groups[i]).flatMap(i => groups[i])
  }
  const pool = groups.slice(0, unlockedCount(state)).flat()
  for (const s of state.known) {
    if (!pool.includes(s)) pool.push(s)
  }
  return pool
}

function weightedPick (items, weightOf, rng) {
  const weights = items.map(weightOf)
  const total = weights.reduce((a, b) => a + b, 0)
  let r = rng() * total
  for (let i = 0; i < items.length; i++) {
    r -= weights[i]
    if (r < 0) return items[i]
  }
  return items[items.length - 1]
}

function shuffle (arr, rng) {
  const a = [...arr]
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]]
  }
  return a
}

function partnersOf (symbol, pairs) {
  const out = []
  for (const [a, b] of pairs) {
    if (a === symbol) out.push(b)
    else if (b === symbol) out.push(a)
  }
  return out
}

function pickDistractors (target, pool, count, mode, rng) {
  const candidates = pool.filter(s => s !== target)
  const preferred = []
  if (mode === 'sound') preferred.push(...partnersOf(target, SIMILAR_SOUND))
  if (mode === 'sound' || mode === 'shape') preferred.push(...partnersOf(target, SIMILAR_SHAPE))
  const chosen = []
  for (const p of preferred) {
    if (chosen.length >= count) break
    if (candidates.includes(p) && !chosen.includes(p)) chosen.push(p)
  }
  const rest = shuffle(candidates.filter(s => !chosen.includes(s)), rng)
  while (chosen.length < count && rest.length) chosen.push(rest.pop())
  return chosen
}

function pairKey (a, b) {
  return [a, b].sort().join('|')
}

// 一局 5 題。至少 2 題來自最弱的三個符號；有混淆對時，插一題二選一加練。
function buildRound (state, rng, size = ROUND_SIZE) {
  const pool = activePool(state)
  const tier = TIERS[effectiveTier(state)]
  const optionCount = Math.min(tier.options, pool.length)
  const weakest = [...pool].sort((a, b) => stars(state, a) - stars(state, b)).slice(0, 3)
  const weightOf = s => Math.pow(6 - stars(state, s), 2)

  const slots = shuffle([...Array(size).keys()], rng)
  const forced = new Set(slots.slice(0, 2))
  const drillKeys = Object.keys(state.confusions)
  const drillSlot = drillKeys.length ? slots[2] : -1

  const round = []
  for (let i = 0; i < size; i++) {
    if (i === drillSlot) {
      const key = drillKeys[Math.floor(rng() * drillKeys.length)]
      const pair = key.split('|')
      const target = pair[Math.floor(rng() * 2)]
      round.push({ target, options: shuffle(pair, rng), hint: tier.hint, drill: key })
      continue
    }
    const source = forced.has(i) ? weakest : pool
    const target = weightedPick(source, weightOf, rng)
    const distractors = pickDistractors(target, pool, optionCount - 1, tier.distract, rng)
    round.push({ target, options: shuffle([target, ...distractors], rng), hint: tier.hint, drill: null })
  }
  return round
}

// 翻牌用：從出題池挑 n 個不重複的符號，弱的優先。池子不夠就全給。
function pickSymbols (state, rng, n) {
  let candidates = activePool(state)
  const weightOf = s => Math.pow(6 - stars(state, s), 2)
  const chosen = []
  while (chosen.length < n && candidates.length) {
    const s = weightedPick(candidates, weightOf, rng)
    chosen.push(s)
    candidates = candidates.filter(x => x !== s)
  }
  return chosen
}

function adjustTier (tier, recent) {
  if (recent.length < RECENT_CAP) return { tier, recent }
  const okCount = recent.filter(Boolean).length
  if (okCount >= 9) return { tier: Math.min(tier + 1, TIERS.length - 1), recent: [] }
  if (okCount < 6) return { tier: Math.max(tier - 1, 0), recent: [] }
  return { tier, recent }
}

// 每題只記第一次點的結果。picked 是她點的符號；drill 是這題若為加練題的混淆對 key。
function recordAnswer (state, { target, ok, picked, ms, drill = null }) {
  const oldHistory = (state.mastery[target] && state.mastery[target].history) || []
  const history = [...oldHistory, { ok, ms }].slice(-HISTORY_CAP)
  const mastery = { ...state.mastery, [target]: { history } }

  const confusions = { ...state.confusions }
  if (!ok && picked && picked !== target) {
    confusions[pairKey(target, picked)] = { streak: 0 }
  }
  if (drill && confusions[drill]) {
    if (!ok) {
      confusions[drill] = { streak: 0 }
    } else {
      const streak = confusions[drill].streak + 1
      if (streak >= DRILL_CLEAR_STREAK) delete confusions[drill]
      else confusions[drill] = { streak }
    }
  }

  const { tier, recent } = adjustTier(state.tier, [...state.recent, ok].slice(-RECENT_CAP))
  return { ...state, mastery, confusions, tier, recent }
}

// ===== store.js =====
// 進度存取：多位使用者、每人一份進度、匯出匯入。storage 用參數傳進來，測試時換成假的。


const PREFIX = 'zhuyin-rescue:'
const PROFILES_KEY = 'zhuyin-rescue-profiles'

function isValidState (s) {
  return s && typeof s === 'object' && s.version === 1 && s.mastery && s.confusions
}

function readJson (storage, key, fallback) {
  try {
    const raw = storage.getItem(key)
    return raw ? JSON.parse(raw) : fallback
  } catch (err) {
    return fallback
  }
}

function createStore (storage) {
  function loadProfiles () {
    const p = readJson(storage, PROFILES_KEY, null)
    if (!p || !Array.isArray(p.list)) return { list: [], current: null }
    return { list: p.list, current: p.current || null }
  }
  function saveProfiles (p) {
    storage.setItem(PROFILES_KEY, JSON.stringify(p))
  }

  return {
    load (profileId) {
      const s = readJson(storage, PREFIX + profileId, null)
      return isValidState(s) ? s : createState()
    },
    save (profileId, state) {
      storage.setItem(PREFIX + profileId, JSON.stringify(state))
    },
    exportJson (state) {
      return JSON.stringify(state, null, 2)
    },
    importJson (text) {
      const s = JSON.parse(text)
      if (!isValidState(s)) throw new Error('不是注音救援隊的存檔')
      return s
    },

    loadProfiles,
    addProfile ({ name, color }) {
      const p = loadProfiles()
      const profile = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, color }
      p.list.push(profile)
      p.current = profile.id
      saveProfiles(p)
      return profile
    },
    setCurrent (id) {
      const p = loadProfiles()
      p.current = id
      saveProfiles(p)
    },
    removeProfile (id) {
      const p = loadProfiles()
      p.list = p.list.filter(x => x.id !== id)
      if (p.current === id) p.current = p.list.length ? p.list[0].id : null
      saveProfiles(p)
      storage.removeItem(PREFIX + id)
    },
  }
}

// ===== audio.js =====
// 發音與音效。語音合成唸代表字；audio/ 資料夾有錄音就改播錄音；音效全部現場合成。


// getSettings 回傳目前設定 { voiceName, rate, repChar }，每次唸都重新拿，面板改了馬上生效。
function createAudio (getSettings) {
  let ctx = null
  let voices = []
  const recordingExists = {} // 符號 → true/false，第一次試過就記住

  function refreshVoices () {
    if (!('speechSynthesis' in window)) return
    voices = window.speechSynthesis.getVoices()
  }
  if ('speechSynthesis' in window) {
    refreshVoices()
    window.speechSynthesis.onvoiceschanged = refreshVoices
  }

  function pickVoice () {
    refreshVoices()
    const settings = getSettings()
    if (settings.voiceName) {
      const chosen = voices.find(v => v.name === settings.voiceName)
      if (chosen) return chosen
    }
    const tw = voices.filter(v => /zh[-_]TW/i.test(v.lang))
    return tw.find(v => /Google/i.test(v.name)) || tw[0] ||
      voices.find(v => /^zh/i.test(v.lang)) || null
  }

  // 第一次觸碰時呼叫：建立 AudioContext、暖機語音合成。
  function unlock () {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext
      if (AC) ctx = new AC()
    }
    if (ctx && ctx.state === 'suspended') ctx.resume()
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(' ')
      u.volume = 0
      window.speechSynthesis.speak(u)
    }
  }

  function speakTts (text) {
    return new Promise(resolve => {
      if (!('speechSynthesis' in window)) return resolve()
      window.speechSynthesis.cancel()
      const u = new SpeechSynthesisUtterance(text)
      u.lang = 'zh-TW'
      u.rate = getSettings().rate || 0.8
      const v = pickVoice()
      if (v) u.voice = v
      let done = false
      const finish = () => { if (!done) { done = true; resolve() } }
      u.onend = finish
      u.onerror = finish
      setTimeout(finish, 3000) // 語音卡住也不要卡遊戲
      window.speechSynthesis.speak(u)
    })
  }

  const RECORDING_EXTS = ['wav', 'mp3']
  let currentEl = null // 正在播的錄音，換題時先停掉

  // onStart 在聲音真的開始出來時呼叫，讓遊戲可以提早開放點擊
  function playFile (url, onStart) {
    return new Promise(resolve => {
      const el = new Audio(url)
      currentEl = el
      el.onplaying = () => { if (onStart) onStart() }
      el.onended = () => resolve(true)
      el.onpause = () => resolve(true) // 被 stop() 中斷也要讓等待的人繼續
      el.onerror = () => resolve(false)
      el.play().catch(() => resolve(false))
    })
  }

  // audio/ㄅ.wav 或 audio/ㄅ.mp3，哪個有就播哪個。找過一次的結果記住，不重複試。
  async function playRecording (symbol, onStart) {
    const known = recordingExists[symbol]
    if (known === false) return false
    if (typeof known === 'string') return playFile(known, onStart)
    for (const ext of RECORDING_EXTS) {
      const url = 'audio/' + encodeURIComponent(symbol) + '.' + ext
      if (await playFile(url, onStart)) { recordingExists[symbol] = url; return true }
    }
    recordingExists[symbol] = false
    return false
  }

  function stop () {
    if (currentEl) { currentEl.pause(); currentEl = null }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel()
  }

  // 唸一個符號。回傳 Promise，唸完才 resolve。有官方錄音就播錄音，沒有才用語音合成。
  async function say (symbol, { onStart } = {}) {
    stop()
    if (await playRecording(symbol, onStart)) return
    const settings = getSettings()
    const text = (settings.repChar && settings.repChar[symbol]) || REP_CHAR[symbol] || symbol
    if (onStart) onStart()
    await speakTts(text)
  }

  function tone (freq, start, dur, type = 'sine', gain = 0.25) {
    if (!ctx) return
    const o = ctx.createOscillator()
    const g = ctx.createGain()
    o.type = type
    o.frequency.setValueAtTime(freq, ctx.currentTime + start)
    g.gain.setValueAtTime(0, ctx.currentTime + start)
    g.gain.linearRampToValueAtTime(gain, ctx.currentTime + start + 0.02)
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur)
    o.connect(g).connect(ctx.destination)
    o.start(ctx.currentTime + start)
    o.stop(ctx.currentTime + start + dur + 0.05)
  }

  function ding () { tone(880, 0, 0.18); tone(1320, 0.12, 0.3) }
  function wrong () {
    if (!ctx) return
    const o = ctx.createOscillator()
    const g = ctx.createGain()
    o.type = 'triangle'
    o.frequency.setValueAtTime(300, ctx.currentTime)
    o.frequency.linearRampToValueAtTime(380, ctx.currentTime + 0.25)
    g.gain.setValueAtTime(0.2, ctx.currentTime)
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35)
    o.connect(g).connect(ctx.destination)
    o.start()
    o.stop(ctx.currentTime + 0.4)
  }
  function splash () {
    if (!ctx) return
    const len = ctx.sampleRate * 0.35
    const buf = ctx.createBuffer(1, len, ctx.sampleRate)
    const d = buf.getChannelData(0)
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2)
    const src = ctx.createBufferSource()
    src.buffer = buf
    const f = ctx.createBiquadFilter()
    f.type = 'bandpass'
    f.frequency.value = 1200
    const g = ctx.createGain()
    g.gain.value = 0.4
    src.connect(f).connect(g).connect(ctx.destination)
    src.start()
  }
  // 咬餅乾：短短的雜訊
  function crunch () {
    if (!ctx) return
    const len = Math.floor(ctx.sampleRate * 0.12)
    const buf = ctx.createBuffer(1, len, ctx.sampleRate)
    const d = buf.getChannelData(0)
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.5)
    const src = ctx.createBufferSource()
    src.buffer = buf
    const f = ctx.createBiquadFilter()
    f.type = 'lowpass'
    f.frequency.value = 2200
    const g = ctx.createGain()
    g.gain.value = 0.5
    src.connect(f).connect(g).connect(ctx.destination)
    src.start()
    tone(180, 0.02, 0.1, 'square', 0.08)
  }
  // 翻牌：輕輕一聲
  function flip () { tone(660, 0, 0.07, 'triangle', 0.15) }
  function cheer () {
    const notes = [523, 659, 784, 1047]
    notes.forEach((n, i) => tone(n, i * 0.12, 0.35, 'triangle', 0.2))
    tone(1319, 0.5, 0.6, 'triangle', 0.2)
  }

  return { unlock, say, stop, ding, wrong, splash, crunch, flip, cheer, listVoices: () => { refreshVoices(); return voices } }

// 結算頁的彩帶：像花瓣、樹葉，顏色收斂
function confettiHtml (count = 44) {
  const colors = ['#E39AA8', '#E8C86A', '#8FC7D2', '#8DBB74', '#F6F3E6', '#E0955B']
  let html = ''
  for (let i = 0; i < count; i++) {
    const left = Math.random() * 100
    const delay = Math.random() * 2
    const dur = 3.5 + Math.random() * 2.5
    const color = colors[i % colors.length]
    const rot = Math.floor(Math.random() * 360)
    const shape = i % 2 === 0 ? 'petal' : ''
    html += `<i class="confetti ${shape}" style="left:${left}%;animation-delay:${delay}s;animation-duration:${dur}s;background:${color};transform:rotate(${rot}deg)"></i>`
  }
  return html
}

  const bubblesEl = root.querySelector('.bubbles')
  const dogWrap = root.querySelector('.dog-wrap')
  let handler = null
  let locked = true
  let current = null

  bubblesEl.addEventListener('pointerdown', e => {
    const b = e.target.closest('.bubble')
    if (!b || locked || !handler) return
    handler(b.dataset.symbol, b)
  })

  function start (question) {
    current = question
    locked = true
    bubblesEl.innerHTML = ''
    const slots = SLOTS[question.options.length] || SLOTS[6]
    question.options.forEach((sym, i) => {
      const [x, y] = slots[i]
      const b = document.createElement('div')
      b.className = 'bubble'
      b.dataset.symbol = sym
      b.style.left = (x - 85) + 'px'
      b.style.top = (y - 85) + 'px'
      b.style.animationDelay = (i * 0.35) + 's'
      b.innerHTML = '<span>' + sym + '</span>'
      bubblesEl.appendChild(b)
    })
  }

  function bubbleOf (symbol) {
    return bubblesEl.querySelector('.bubble[data-symbol="' + symbol + '"]')
  }

  function unlock () { locked = false }
  function lock () { locked = true }

  // 提示：hint 2 一直晃、1 晃一次、0 不晃
  function hint (level) {
    const b = bubbleOf(current.target)
    if (!b) return
    b.classList.remove('hint-once', 'hint-loop')
    if (level >= 2) b.classList.add('hint-loop')
    else if (level === 1) b.classList.add('hint-once')
  }

  function shake (symbol) {
    const b = bubbleOf(symbol)
    if (!b) return
    b.classList.remove('shake')
    void b.offsetWidth
    b.classList.add('shake')
  }

  function flashCorrect () {
    const b = bubbleOf(current.target)
    if (b) { b.classList.remove('hint-once'); b.classList.add('hint-loop') }
  }

  // 釣起來：泡泡飛向釣竿尖端，狗狗跳一下
  function celebrate (symbol) {
    return new Promise(resolve => {
      const b = bubbleOf(symbol)
      if (!b) return resolve()
      b.classList.remove('hint-loop', 'hint-once', 'shake')
      b.classList.add('caught')
      const x = parseFloat(b.style.left)
      const y = parseFloat(b.style.top)
      // 釣竿尖端大約在舞台 (426, 278)：dog-wrap 左上 (170, 226) 加上竿尖 (256, 52)
      b.style.transform = `translate(${426 - 88 - x}px, ${278 - 88 - y}px) scale(0.5)`
      dogWrap.classList.remove('jump')
      void dogWrap.offsetWidth
      dogWrap.classList.add('jump')
      setTimeout(() => {
        b.classList.add('gone')
        resolve()
      }, 700)
    })
  }

  function sad () {
    dogWrap.classList.remove('tilt')
    void dogWrap.offsetWidth
    dogWrap.classList.add('tilt')
  }

  function onAnswer (fn) { handler = fn }
  function destroy () { root.innerHTML = ''; handler = null }

  return { start, unlock, lock, hint, shake, flashCorrect, celebrate, sad, onAnswer, destroy }
}

// ===== whack.js =====
// 打地鼠玩法。符號一個一個從洞裡冒出來又縮回去，狗狗喊一個音，拍到對的就過關。
// 不計時、不扣分：沒拍到就等它下次再冒出來，拍錯才算錯（交給 main.js 記錄）。
// 介面跟釣魚一樣：start、lock/unlock、hint、shake、flashCorrect、celebrate、sad、onAnswer、destroy。


const HOLES = [[330, 430], [600, 430], [870, 430], [460, 620], [730, 620], [1000, 620]]
const UP_MS = 1700 // 冒出來停多久
const GAP_MS = 350 // 縮回去到下一個冒出來

function shuffleList (arr) {
  const a = [...arr]
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]]
  }
  return a
}

function createWhack (root, { color = 0 } = {}) {
  root.innerHTML = homeBgSvg() +
    '<div class="dog-wrap whack-dog">' + dogSvg(color) + '</div>' +
    '<div class="holes">' + HOLES.map(([x, y]) => `
      <div class="hole" style="left:${x - 110}px;top:${y - 90}px">
        <div class="hole-back"></div>
        <div class="mole"><span></span></div>
        <div class="hole-front"></div>
      </div>`).join('') + '</div>'
  const dogWrap = root.querySelector('.whack-dog')
  const holes = [...root.querySelectorAll('.hole')]
  let handler = null
  let locked = true
  let current = null
  let running = false
  let timer = null
  let queue = []
  let lastHole = -1
  let glowTarget = false
  let glowOnce = false
  let upMole = null // 目前冒出來的那一個

  root.addEventListener('pointerdown', e => {
    const mole = e.target.closest('.mole')
    if (!mole || locked || !handler || !mole.classList.contains('up')) return
    handler(mole.dataset.symbol, mole)
  })

  // 出場順序：干擾項隨機，目標排在第 2 個，之後每 3 個出現一次
  function refill () {
    const distractors = shuffleList(current.options.filter(s => s !== current.target))
    const seq = []
    let d = 0
    for (let i = 0; i < 9; i++) {
      if (i % 3 === 1) seq.push(current.target)
      else { seq.push(distractors[d % distractors.length]); d++ }
    }
    queue.push(...seq)
  }

  function popNext () {
    if (!running) return
    if (!queue.length) refill()
    const sym = queue.shift()
    let idx = Math.floor(Math.random() * holes.length)
    if (idx === lastHole) idx = (idx + 1) % holes.length
    lastHole = idx
    const mole = holes[idx].querySelector('.mole')
    mole.dataset.symbol = sym
    mole.querySelector('span').textContent = sym
    mole.classList.remove('shake', 'hit', 'hint-loop')
    if (sym === current.target && (glowTarget || glowOnce)) {
      mole.classList.add('hint-loop')
      glowOnce = false
    }
    mole.classList.add('up')
    upMole = mole
    timer = setTimeout(() => {
      mole.classList.remove('up')
      upMole = null
      timer = setTimeout(popNext, GAP_MS)
    }, UP_MS)
  }

  function stopLoop () {
    running = false
    clearTimeout(timer)
    timer = null
  }

  function start (question) {
    current = question
    locked = true
    queue = []
    glowTarget = false
    glowOnce = false
    stopLoop()
    holes.forEach(h => {
      const m = h.querySelector('.mole')
      m.classList.remove('up', 'hit', 'shake', 'hint-loop')
    })
    upMole = null
  }

  function unlock () {
    locked = false
    if (!running) { running = true; timer = setTimeout(popNext, 200) }
  }
  function lock () { locked = true }

  // 提示：2 每次冒出來都發光、1 第一次發光、0 不提示
  function hint (level) {
    if (level >= 2) glowTarget = true
    else if (level === 1) glowOnce = true
  }
  function shake (symbol) {
    const mole = upMole && upMole.dataset.symbol === symbol ? upMole : null
    if (!mole) return
    mole.classList.remove('shake')
    void mole.offsetWidth
    mole.classList.add('shake')
  }
  function flashCorrect () { glowTarget = true }

  // 拍到了：停止冒出，那一個彈一下留在外面
  function celebrate (symbol) {
    return new Promise(resolve => {
      stopLoop()
      const mole = upMole && upMole.dataset.symbol === symbol ? upMole : null
      if (mole) { mole.classList.remove('hint-loop'); mole.classList.add('hit') }
      dogWrap.classList.remove('jump')
      void dogWrap.offsetWidth
      dogWrap.classList.add('jump')
      setTimeout(() => { if (mole) mole.classList.remove('up', 'hit'); resolve() }, 650)
    })
  }
  function sad () {
    dogWrap.classList.remove('tilt')
    void dogWrap.offsetWidth
    dogWrap.classList.add('tilt')
  }
  function onAnswer (fn) { handler = fn }
  function destroy () { stopLoop(); root.innerHTML = ''; handler = null }

  return { start, unlock, lock, hint, shake, flashCorrect, celebrate, sad, onAnswer, destroy }
}

// ===== memory.js =====
// 翻牌配對。幾對相同的符號蓋著，翻開唸音；找到一樣的兩張就配對成功。
// 介面：start(symbols)、onFlip(fn)、onPair(fn)、onDone(fn)、destroy。配對邏輯在這裡，main.js 只管聲音和星星。


// 卡片位置：依張數排格子（中心點）
function layout (count) {
  const cols = count <= 6 ? 3 : count <= 8 ? 4 : 5
  const rows = Math.ceil(count / cols)
  const cw = 190
  const ch = 230
  const gapX = 30
  const gapY = 30
  const totalW = cols * cw + (cols - 1) * gapX
  const totalH = rows * ch + (rows - 1) * gapY
  const x0 = (1200 - totalW) / 2
  const y0 = 120 + (560 - totalH) / 2
  const out = []
  for (let i = 0; i < count; i++) {
    const c = i % cols
    const r = Math.floor(i / cols)
    out.push([x0 + c * (cw + gapX), y0 + r * (ch + gapY)])
  }
  return out
}

function shuffleCards (arr) {
  const a = [...arr]
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]]
  }
  return a
}

const PAW = `<svg viewBox="0 0 100 100" width="90" height="90" xmlns="http://www.w3.org/2000/svg" fill="#F6E7C8" opacity="0.9">
  <ellipse cx="50" cy="66" rx="24" ry="20"/><circle cx="24" cy="44" r="10"/><circle cx="42" cy="30" r="10"/><circle cx="60" cy="30" r="10"/><circle cx="77" cy="44" r="10"/></svg>`

function createMemory (root) {
  root.innerHTML = homeBgSvg() + '<div class="cards-grid"></div>'
  const grid = root.querySelector('.cards-grid')
  let onFlipFn = null
  let onPairFn = null
  let onDoneFn = null
  let open = [] // 目前翻開、還沒配對的卡
  let locked = false
  let remaining = 0

  grid.addEventListener('pointerdown', e => {
    const card = e.target.closest('.mcard')
    if (!card || locked || card.classList.contains('open') || card.classList.contains('matched')) return
    card.classList.add('open')
    open.push(card)
    if (onFlipFn) onFlipFn(card.dataset.symbol)
    if (open.length < 2) return
    locked = true
    const [a, b] = open
    open = []
    if (a.dataset.symbol === b.dataset.symbol) {
      setTimeout(() => {
        a.classList.add('matched'); b.classList.add('matched')
        remaining--
        locked = false
        if (onPairFn) onPairFn(a.dataset.symbol)
        if (remaining === 0 && onDoneFn) setTimeout(onDoneFn, 600)
      }, 500)
    } else {
      setTimeout(() => {
        a.classList.remove('open'); b.classList.remove('open')
        locked = false
      }, 1100)
    }
  })

  function start (symbols) {
    grid.innerHTML = ''
    open = []
    locked = false
    remaining = symbols.length
    const cards = shuffleCards(symbols.flatMap(s => [s, s]))
    const pos = layout(cards.length)
    cards.forEach((sym, i) => {
      const el = document.createElement('div')
      el.className = 'mcard'
      el.dataset.symbol = sym
      el.style.left = pos[i][0] + 'px'
      el.style.top = pos[i][1] + 'px'
      el.style.animationDelay = (i * 0.06) + 's'
      el.innerHTML = `<div class="mcard-inner"><div class="mcard-back">${PAW}</div><div class="mcard-front"><span>${sym}</span></div></div>`
      grid.appendChild(el)
    })
  }

  return {
    start,
    onFlip (fn) { onFlipFn = fn },
    onPair (fn) { onPairFn = fn },
    onDone (fn) { onDoneFn = fn },
    destroy () { root.innerHTML = ''; onFlipFn = onPairFn = onDoneFn = null },
  }
}

// ===== speak.js =====
// 唸給狗狗聽。狗狗舉一張牌，她按麥克風唸出來，用瀏覽器的語音辨識判斷。
// 辨識小孩的單音不會很準，所以 main.js 只在唸對時記錄，沒聽出來不算她錯。
// 介面：show(symbol)、setListening(bool)、heard(text)、celebrate()、sad()、onMic(fn)、destroy。
// 另外匯出 speechAvailable()、listen()、matchesSymbol()。


const MIC_SVG = `<svg viewBox="0 0 24 24" width="90" height="90" fill="#fff"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-3.1A8 8 0 0 0 20 11h-2z"/></svg>`

function speechAvailable () {
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition)
}

// 聽一次，回傳可能的字串列表（沒聽到就是空陣列）。最多等 5 秒。
function listen () {
  return new Promise(resolve => {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition
    if (!R) return resolve([])
    const r = new R()
    r.lang = 'zh-TW'
    r.interimResults = false
    r.maxAlternatives = 5
    let done = false
    const finish = (list) => { if (!done) { done = true; try { r.stop() } catch (err) { /* 已停 */ } resolve(list) } }
    r.onresult = e => {
      const alts = []
      for (const res of e.results) for (const alt of res) alts.push(alt.transcript)
      finish(alts)
    }
    r.onerror = () => finish([])
    r.onend = () => finish([])
    setTimeout(() => finish([]), 5000)
    try { r.start() } catch (err) { finish([]) }
  })
}

// 辨識結果裡出現符號本身，或它的同音字任何一個，就算唸對
function matchesSymbol (symbol, transcripts) {
  const accept = SPEAK_ACCEPT[symbol] || ''
  return transcripts.some(t => {
    const clean = String(t).replace(/[\s，。、？！,.?!]/g, '')
    if (clean.includes(symbol)) return true
    return [...clean].some(ch => accept.includes(ch))
  })
}

function createSpeak (root, { color = 0 } = {}) {
  root.innerHTML = homeBgSvg() +
    '<div class="dog-wrap speak-dog">' + dogSvg(color) + '</div>' +
    '<div class="sign"><div class="sign-board"><span></span></div><div class="sign-post"></div></div>' +
    '<div class="heard"></div>' +
    `<button class="mic-btn" aria-label="唸給狗狗聽">${MIC_SVG}</button>`
  const dogWrap = root.querySelector('.speak-dog')
  const signEl = root.querySelector('.sign')
  const signText = root.querySelector('.sign-board span')
  const heardEl = root.querySelector('.heard')
  const micBtn = root.querySelector('.mic-btn')
  let handler = null

  micBtn.addEventListener('pointerdown', () => { if (handler) handler() })

  function show (symbol) {
    signText.textContent = symbol
    signEl.classList.remove('glow')
    heardEl.textContent = ''
    heardEl.classList.remove('show')
  }
  function setListening (on) {
    micBtn.classList.toggle('listening', on)
    dogWrap.classList.toggle('listening', on)
  }
  // 顯示辨識到的字，給旁邊的大人看，小孩不用看得懂
  function heard (text) {
    heardEl.textContent = text ? '「' + text + '」' : '…？'
    heardEl.classList.add('show')
  }
  function celebrate () {
    return new Promise(resolve => {
      signEl.classList.add('glow')
      dogWrap.classList.remove('jump')
      void dogWrap.offsetWidth
      dogWrap.classList.add('jump')
      setTimeout(resolve, 700)
    })
  }
  function sad () {
    dogWrap.classList.remove('tilt')
    void dogWrap.offsetWidth
    dogWrap.classList.add('tilt')
  }
  function onMic (fn) { handler = fn }
  function destroy () { root.innerHTML = ''; handler = null }

  return { show, setListening, heard, celebrate, sad, onMic, destroy }
}

  })
  root.querySelector('#result-actions').classList.add('hidden')
  setTimeout(() => root.querySelector('#result-actions').classList.remove('hidden'), 3000)
}

function starColor (n) {
  if (n >= 4) return 'green'
  if (n >= 2) return 'yellow'
  return 'red'
}

function escapeHtml (s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))
}

// 大人面板：目前使用者的熟練度色塊、已經認得、試聽設定、匯出匯入、刪除使用者
const TIER_LABELS = ['2 選項，隨機干擾，一直提示', '3 選項，隨機干擾，一直提示', '3 選項，形似干擾，提示一次', '4 選項，形似干擾，提示一次', '4 選項，音似干擾，不提示', '6 選項，音似干擾，不提示']
const DISTRACT_LABEL = { random: '隨機', shape: '形似', sound: '音似' }
const HINT_LABEL = ['不提示', '提示一次', '一直提示']

// 兩段式確認：第一下按鈕變成確認文字，4 秒內再按一下才執行。不用瀏覽器對話框。
function armButton (btn, confirmText, onConfirm) {
  const original = btn.textContent
  let timer = null
  btn.onclick = () => {
    if (btn.classList.contains('armed')) {
      clearTimeout(timer)
      onConfirm()
      return
    }
    btn.classList.add('armed')
    btn.textContent = confirmText
    timer = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = original }, 4000)
  }
}

function renderPanel (root, { profile, profiles, state, settings, voices, onKnownChange, onSettings, onStateChange, onExport, onImport, onResetProgress, onRemoveProfile, onClose, onSay }) {
  const usersHtml = profiles.list.length
    ? profiles.list.map(p => `
      <div class="puser">
        <span class="puser-dot" style="background:${DOG_COLORS[p.color % DOG_COLORS.length].main}"></span>
        <span class="puser-name">${escapeHtml(p.name)}${profile && profile.id === p.id ? '（目前）' : ''}</span>
        <button class="danger" data-remove="${p.id}">刪除</button>
      </div>`).join('')
    : '<span>還沒有使用者</span>'
  const pool = state ? activePool(state) : []
  const groupsHtml = !state ? '' : GROUPS.map((g, gi) => `
    <div class="pgroup">
      <div class="pgroup-title">第 ${gi + 1} 組${g.every(s => pool.includes(s)) ? '' : '（未解鎖）'}</div>
      <div class="ptiles">${g.map(s => {
        const n = stars(state, s)
        const known = state.known.includes(s)
        const hist = (state.mastery[s] && state.mastery[s].history) || []
        return `<div class="ptile ${starColor(n)}">
          <button class="ptile-sym" data-say="${s}" title="點一下試聽">${s}</button>
          <div class="ptile-stars">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</div>
          <div class="ptile-hist">${hist.length ? hist.filter(h => h.ok).length + '/' + hist.length : '沒練過'}</div>
          <label class="ptile-known"><input type="checkbox" data-known="${s}" ${known ? 'checked' : ''}> 認得</label>
          <input class="ptile-rep" data-rep="${s}" value="${(settings.repChar && settings.repChar[s]) || REP_CHAR[s]}" maxlength="2" title="唸成什麼字">
        </div>`
      }).join('')}</div>
    </div>`).join('')

  const confusions = state ? Object.keys(state.confusions) : []
  const voiceOptions = voices.map(v =>
    `<option value="${v.name}" ${settings.voiceName === v.name ? 'selected' : ''}>${v.name} (${v.lang})</option>`).join('')

  root.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>大人面板　<small>${profile ? '目前：' + escapeHtml(profile.name) : '尚未選人'}</small></h2>
        <button class="panel-close" id="panel-close">關閉</button>
      </div>
      <div class="panel-row panel-users">
        <b>使用者</b>${usersHtml}
      </div>
      ${profile ? `
      <div class="panel-row">
        <div>目前出題階級：<b>${effectiveTier(state) + 1}</b> / 6（${TIER_LABELS[effectiveTier(state)]}）</div>
        <div>自動判定：第 <b>${state.tier + 1}</b> 階
          <button class="mini" id="tier-down" title="降一階" ${state.tier <= 0 ? 'disabled' : ''}>−</button>
          <button class="mini" id="tier-up" title="跳一階" ${state.tier >= TIERS.length - 1 ? 'disabled' : ''}>＋</button>
          ，最近 10 題 ${state.recent.filter(Boolean).length}/${state.recent.length} 對</div>
        <div>混淆中：${confusions.length ? confusions.map(k => k.replace('|', '／')).join('、') : '沒有'}</div>
      </div>
      <div class="panel-row panel-difficulty">
        <label>難度
          <select id="sel-tier">
            <option value="" ${state.lockTier == null ? 'selected' : ''}>自動（連對升、連錯降）</option>
            ${TIERS.map((t, i) => `<option value="${i}" ${state.lockTier === i ? 'selected' : ''}>鎖在第 ${i + 1} 階：${t.options} 選項、${DISTRACT_LABEL[t.distract]}干擾、${HINT_LABEL[t.hint]}</option>`).join('')}
          </select>
        </label>
        <div class="range-pick">
          <label><input type="checkbox" id="range-auto" ${!(state.rangeGroups && state.rangeGroups.length) ? 'checked' : ''}> 範圍自動解鎖</label>
          <label class="${(state.rangeGroups && state.rangeGroups.length) ? 'dimmed' : ''}">已解鎖到第
            <select id="sel-unlocked" ${(state.rangeGroups && state.rangeGroups.length) ? 'disabled' : ''}>
              ${GROUPS.map((g, i) => `<option value="${i + 1}" ${unlockedCount(state) === i + 1 ? 'selected' : ''}>${i + 1} 組（${g.join('')}）</option>`).join('')}
            </select>，之後照常自動往後解鎖
          </label>
          <span class="range-groups ${!(state.rangeGroups && state.rangeGroups.length) ? 'dimmed' : ''}">
            ${GROUPS.map((g, i) => `<label><input type="checkbox" data-range="${i}" ${(state.rangeGroups || []).includes(i) ? 'checked' : ''}> ${g.join('')}</label>`).join('')}
          </span>
        </div>
      </div>` : ''}
      <div class="panel-row">
        <label>語音
          <select id="sel-voice"><option value="">自動</option>${voiceOptions}</select>
        </label>
        <label>語速 <input type="range" id="rng-rate" min="0.5" max="1.2" step="0.05" value="${settings.rate || 0.8}"> <span id="rate-val">${settings.rate || 0.8}</span></label>
        ${profile ? `
        <button id="btn-export">匯出進度</button>
        <label class="file-btn">匯入進度<input type="file" id="file-import" accept=".json"></label>
        <button id="btn-reset" class="danger">清除練習紀錄</button>` : ''}
        <span id="panel-msg" class="panel-msg"></span>
      </div>
      <p class="panel-hint">點符號可以試聽。「認得」勾起來的符號從 3 星起算並直接進入出題。每格右下方的字是語音合成實際唸的代表字，唸得怪可以改。</p>
      ${profile ? groupsHtml : '<p class="panel-hint">先回選人畫面選一個人，才看得到進度。</p>'}
    </div>`

  root.querySelector('#panel-close').onclick = onClose
  root.querySelectorAll('[data-say]').forEach(b => { b.onclick = () => onSay(b.dataset.say) })
  root.querySelectorAll('[data-known]').forEach(cb => {
    cb.onchange = () => onKnownChange(cb.dataset.known, cb.checked)
  })
  root.querySelectorAll('[data-rep]').forEach(inp => {
    inp.onchange = () => {
      const repChar = { ...(settings.repChar || {}) }
      const v = inp.value.trim()
      if (v && v !== REP_CHAR[inp.dataset.rep]) repChar[inp.dataset.rep] = v
      else delete repChar[inp.dataset.rep]
      onSettings({ ...settings, repChar })
    }
  })
  root.querySelector('#sel-voice').onchange = e => onSettings({ ...settings, voiceName: e.target.value })
  const rng = root.querySelector('#rng-rate')
  rng.oninput = () => { root.querySelector('#rate-val').textContent = rng.value }
  rng.onchange = () => onSettings({ ...settings, rate: parseFloat(rng.value) })
  if (profile) {
    root.querySelector('#sel-tier').onchange = e => {
      onStateChange({ lockTier: e.target.value === '' ? null : parseInt(e.target.value, 10) })
    }
    root.querySelector('#tier-down').onclick = () => onStateChange({ tier: Math.max(0, state.tier - 1), recent: [] })
    root.querySelector('#tier-up').onclick = () => onStateChange({ tier: Math.min(TIERS.length - 1, state.tier + 1), recent: [] })
    root.querySelector('#sel-unlocked').onchange = e => onStateChange({ unlockedUpTo: parseInt(e.target.value, 10) })
    const readRange = () => [...root.querySelectorAll('[data-range]:checked')].map(cb => parseInt(cb.dataset.range, 10))
    root.querySelector('#range-auto').onchange = e => {
      if (e.target.checked) onStateChange({ rangeGroups: null })
      else onStateChange({ rangeGroups: readRange().length ? readRange() : [0] })
    }
    root.querySelectorAll('[data-range]').forEach(cb => {
      cb.onchange = () => onStateChange({ rangeGroups: readRange() })
    })
    root.querySelector('#btn-export').onclick = onExport
    armButton(root.querySelector('#btn-reset'), '確定清除？星星和混淆紀錄會歸零，認得與難度設定保留', onResetProgress)
    root.querySelector('#file-import').onchange = e => {
      const f = e.target.files[0]
      if (!f) return
      const reader = new FileReader()
      reader.onload = () => onImport(String(reader.result))
      reader.readAsText(f)
    }
  }
  root.querySelectorAll('[data-remove]').forEach(btn => {
    armButton(btn, '確定刪除？連進度一起刪', () => onRemoveProfile(btn.dataset.remove))
  })
}

function panelMessage (root, text) {
  const el = root.querySelector('#panel-msg')
  if (el) el.textContent = text
}

// ===== main.js =====
// 把所有模組接起來：使用者、狀態、出題、三種玩法、畫面切換。


const SETTINGS_KEY = 'zhuyin-rescue-settings'
const MEMORY_PAIRS = 5

function loadSettings () {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {} } catch (err) { return {} }
}
function saveSettings (s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)) }

function main () {
  const stage = document.getElementById('stage')
  fitStage(stage)
  window.addEventListener('resize', () => fitStage(stage))

  const store = createStore(localStorage)
  let settings = loadSettings()
  const audio = createAudio(() => settings)

  let profile = null
  let state = null

  const profilesEl = document.getElementById('screen-profiles')
  const homeEl = document.getElementById('screen-home')
  const gameEl = document.getElementById('screen-game')
  const resultEl = document.getElementById('screen-result')
  const panelEl = document.getElementById('screen-panel')

  // ---- 選人 ----
  function goProfiles () {
    renderProfiles(profilesEl, {
      profiles: store.loadProfiles(),
      onPick (id) { audio.unlock(); pickProfile(id) },
      onAdd (info) { audio.unlock(); const p = store.addProfile(info); pickProfile(p.id) },
      onGear: gearTap,
    })
    showScreen('profiles')
  }

  function pickProfile (id) {
    const profiles = store.loadProfiles()
    profile = profiles.list.find(p => p.id === id)
    if (!profile) return goProfiles()
    store.setCurrent(id)
    state = store.load(id)
    goHome()
  }

  // ---- 首頁 ----
  function goHome () {
    destroyGame()
    renderHome(homeEl, { profile, speech: speechAvailable() })
    homeEl.querySelector('#btn-who').addEventListener('pointerdown', goProfiles)
    homeEl.querySelectorAll('[data-game]').forEach(card => {
      card.addEventListener('pointerdown', () => { audio.unlock(); startGame(card.dataset.game) })
    })
    homeEl.querySelector('#btn-gear').addEventListener('pointerdown', gearTap)
    showScreen('home')
  }

  // 齒輪 2 秒內連點三下才開大人面板。每點一下齒輪旁顯示還差幾下，讓大人知道它沒壞。
  let gearTaps = []
  let gearHintTimer = null
  function gearTap (e) {
    const now = Date.now()
    gearTaps = gearTaps.filter(t => now - t < 2000)
    gearTaps.push(now)
    if (gearTaps.length >= 3) { gearTaps = []; hideGearHint(); openPanel(); return }
    const gear = e.currentTarget
    let hint = gear.parentElement.querySelector('.gear-hint')
    if (!hint) {
      hint = document.createElement('div')
      hint.className = 'gear-hint'
      gear.parentElement.appendChild(hint)
    }
    hint.textContent = '再點 ' + (3 - gearTaps.length) + ' 下進家長區'
    clearTimeout(gearHintTimer)
    gearHintTimer = setTimeout(hideGearHint, 2000)
  }
  function hideGearHint () {
    document.querySelectorAll('.gear-hint').forEach(el => el.remove())
  }

  // ---- 遊戲共用 ----
  const playArea = gameEl.querySelector('.play-area')
  const starsEl = gameEl.querySelector('.progress-stars')
  const replayBtn = gameEl.querySelector('#btn-replay')
  let game = null
  let kind = null
  let earned = []
  let starTotal = 5

  function setStars () {
    starsEl.innerHTML = ''
    for (let i = 0; i < starTotal; i++) {
      const s = document.createElement('span')
      s.className = 'star' + (i < earned.length ? (earned[i] ? ' lit' : ' dim') : '')
      s.textContent = '★'
      starsEl.appendChild(s)
    }
  }

  function destroyGame () {
    if (game) game.destroy()
    game = null
    audio.stop()
  }

  function startGame (which) {
    destroyGame()
    kind = which
    earned = []
    showScreen('game')
    if (which === 'memory') return runMemory()
    if (which === 'speak') return runSpeak()
    runQuestions(which)
  }

  gameEl.querySelector('#btn-quit').addEventListener('pointerdown', () => { busy = false; goHome() })

  function commit (answer) {
    state = recordAnswer(state, answer)
    store.save(profile.id, state)
  }

  function finishRound () {
    destroyGame()
    renderResult(resultEl, profile.color)
    resultEl.querySelector('#btn-again').addEventListener('pointerdown', () => startGame(kind))
    resultEl.querySelector('#btn-home').addEventListener('pointerdown', goHome)
    showScreen('result')
    audio.cheer()
    playResult(resultEl, earned)
  }

  // ---- 釣魚、打地鼠：聽音選形 ----
  let round = []
  let index = 0
  let firstAttempt = true
  let askedAt = 0
  let busy = false

  function runQuestions (which) {
    game = which === 'whack'
      ? createWhack(playArea, { color: profile.color })
      : createFishing(playArea, { color: profile.color })
    replayBtn.classList.remove('hidden')
    round = buildRound(state, Math.random)
    index = 0
    starTotal = round.length
    setStars()
    game.onAnswer(onPick)
    askQuestion()
  }

  // 聲音一出來就開放點擊，不等唸完；提示晃動等唸完才開始
  async function askQuestion () {
    const q = round[index]
    const myIndex = index
    const myGame = game
    firstAttempt = true
    busy = true
    game.start(q)
    game.lock()
    await wait(350)
    let opened = false
    const open = () => {
      if (opened || index !== myIndex || game !== myGame) return
      opened = true
      game.unlock()
      askedAt = Date.now()
      busy = false
    }
    await audio.say(q.target, { onStart: open })
    open()
    if (index === myIndex && game === myGame) game.hint(q.hint)
  }

  replayBtn.addEventListener('pointerdown', () => {
    if (kind === 'memory' || !round[index]) return
    if (kind === 'speak') { audio.say(round[index].target); return }
    if (busy) return
    audio.say(round[index].target)
  })

  async function onPick (symbol) {
    if (busy) return
    const q = round[index]
    const ms = Date.now() - askedAt
    if (symbol === q.target) {
      busy = true
      game.lock()
      if (firstAttempt) commit({ target: q.target, ok: true, picked: symbol, ms, drill: q.drill })
      earned.push(firstAttempt)
      setStars()
      audio.stop()
      if (kind === 'whack') audio.crunch(); else audio.splash()
      await game.celebrate(symbol)
      if (!game) return // 中途按了回首頁
      audio.ding()
      await wait(250)
      if (!game) return
      index++
      if (index >= round.length) return finishRound()
      askQuestion()
      return
    }
    // 答錯：第一次才記錄；選項晃、狗狗歪頭、正確的開始閃
    if (firstAttempt) {
      commit({ target: q.target, ok: false, picked: symbol, ms, drill: q.drill })
      firstAttempt = false
    }
    audio.wrong()
    game.shake(symbol)
    game.sad()
    game.flashCorrect()
  }

  // ---- 唸給狗狗聽：只記唸對，沒聽出來不算錯 ----
  let speakTries = 0
  function runSpeak () {
    game = createSpeak(playArea, { color: profile.color })
    replayBtn.classList.remove('hidden')
    round = buildRound(state, Math.random)
    index = 0
    starTotal = round.length
    setStars()
    game.onMic(onMicPressed)
    askSpeak()
  }

  async function askSpeak () {
    const q = round[index]
    speakTries = 0
    firstAttempt = true
    busy = true
    game.show(q.target)
    await wait(400)
    // 提示等級高的時候狗狗先示範一次，讓她跟著唸
    if (q.hint >= 2 && game) await audio.say(q.target)
    busy = false
  }

  async function onMicPressed () {
    if (busy || !game) return
    const q = round[index]
    const myGame = game
    busy = true
    audio.stop()
    game.setListening(true)
    const heard = await listen()
    if (game !== myGame) return
    game.setListening(false)
    game.heard(heard[0] || '')
    if (matchesSymbol(q.target, heard)) {
      if (firstAttempt) commit({ target: q.target, ok: true, picked: q.target, ms: 0, drill: q.drill })
      earned.push(firstAttempt)
      setStars()
      audio.ding()
      await game.celebrate()
      if (game !== myGame) return
      await wait(300)
      index++
      if (index >= round.length) return finishRound()
      askSpeak()
      return
    }
    // 沒聽出來：狗狗歪頭、示範一次。兩次沒過就跳下一題，不記錯
    firstAttempt = false
    speakTries++
    game.sad()
    await audio.say(q.target)
    if (game !== myGame) return
    if (speakTries >= 2) {
      earned.push(false)
      setStars()
      await wait(400)
      index++
      if (index >= round.length) return finishRound()
      askSpeak()
      return
    }
    busy = false
  }

  // ---- 翻牌：配對，不記進度 ----
  function runMemory () {
    game = createMemory(playArea)
    replayBtn.classList.add('hidden')
    const symbols = pickSymbols(state, Math.random, MEMORY_PAIRS)
    starTotal = symbols.length
    setStars()
    game.onFlip(sym => { audio.flip(); audio.say(sym) })
    game.onPair(() => { earned.push(true); setStars(); audio.ding() })
    game.onDone(finishRound)
    game.start(symbols)
  }

  // ---- 大人面板 ----
  function openPanel () {
    destroyGame()
    renderPanel(panelEl, {
      profile,
      profiles: store.loadProfiles(),
      state,
      settings,
      voices: audio.listVoices(),
      onKnownChange (symbol, checked) {
        const known = state.known.filter(s => s !== symbol)
        if (checked) known.push(symbol)
        state = { ...state, known }
        store.save(profile.id, state)
        openPanel()
      },
      onSettings (next) {
        settings = next
        saveSettings(settings)
        openPanel()
      },
      onStateChange (partial) {
        state = { ...state, ...partial }
        store.save(profile.id, state)
        openPanel()
      },
      onExport () {
        const blob = new Blob([store.exportJson(state)], { type: 'application/json' })
        const a = document.createElement('a')
        a.href = URL.createObjectURL(blob)
        a.download = 'zhuyin-rescue-' + profile.name + '.json'
        a.click()
      },
      onImport (text) {
        try {
          state = store.importJson(text)
          store.save(profile.id, state)
          openPanel()
        } catch (err) {
          panelMessage(panelEl, '匯入失敗：' + err.message)
        }
      },
      onResetProgress () {
        state = resetProgress(state)
        store.save(profile.id, state)
        openPanel()
      },
      onRemoveProfile (id) {
        store.removeProfile(id)
        if (profile && profile.id === id) {
          profile = null
          state = null
        }
        openPanel()
      },
      onClose () { profile ? goHome() : goProfiles() },
      onSay (symbol) { audio.say(symbol) },
    })
    showScreen('panel')
  }

  // 開機：有記住上次的人就直接進首頁，否則選人
  const profiles = store.loadProfiles()
  if (profiles.current && profiles.list.some(p => p.id === profiles.current)) {
    pickProfile(profiles.current)
  } else {
    goProfiles()
  }
}

function wait (ms) { return new Promise(r => setTimeout(r, ms)) }

document.addEventListener('DOMContentLoaded', main)

</script>
</body>
</html>
