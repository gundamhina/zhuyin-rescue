      ${profile ? groupsHtml : '<p class="panel-hint">先回選人畫面選一個人，才看得到進度。</p>'}
    </div>`

  root.querySelector('#panel-close').onclick = onClose
  root.querySelector('#btn-check').onclick = onCheck
  root.querySelectorAll('[data-track]').forEach(b => { b.onclick = () => onTrack(b.dataset.track) })
  root.querySelectorAll('[data-say]').forEach(b => { b.onclick = () => onSay(b.dataset.say) })
  root.querySelectorAll('[data-known]').forEach(cb => {
    cb.onchange = () => onKnownChange(cb.dataset.known, cb.checked)
  })
  root.querySelectorAll('[data-rep]').forEach(inp => {
    inp.onchange = () => {
      const repChar = { ...(settings.repChar || {}) }
      const v = inp.value.trim()
      if (v && v !== REP_CHAR[inp.dataset.rep]) repChar[inp.dataset.rep] = v
      else delete repChar[inp.dataset.rep]
      onSettings({ ...settings, repChar })
    }
  })
  root.querySelector('#sel-voice').onchange = e => onSettings({ ...settings, voiceName: e.target.value })
  const rng = root.querySelector('#rng-rate')
  rng.oninput = () => { root.querySelector('#rate-val').textContent = rng.value }
  rng.onchange = () => onSettings({ ...settings, rate: parseFloat(rng.value) })
  if (profile) {
    root.querySelector('#sel-tier').onchange = e => {
      onStateChange({ lockTier: e.target.value === '' ? null : parseInt(e.target.value, 10) })
    }
    root.querySelector('#tier-down').onclick = () => onStateChange({ tier: Math.max(0, state.tier - 1), recent: [] })
    root.querySelector('#tier-up').onclick = () => onStateChange({ tier: Math.min(TIERS.length - 1, state.tier + 1), recent: [] })
    root.querySelector('#sel-unlocked').onchange = e => onStateChange({ unlockedUpTo: parseInt(e.target.value, 10) })
    const readRange = () => [...root.querySelectorAll('[data-range]:checked')].map(cb => parseInt(cb.dataset.range, 10))
    root.querySelector('#range-auto').onchange = e => {
      if (e.target.checked) onStateChange({ rangeGroups: null })
      else onStateChange({ rangeGroups: readRange().length ? readRange() : [0] })
    }
    root.querySelectorAll('[data-range]').forEach(cb => {
      cb.onchange = () => onStateChange({ rangeGroups: readRange() })
    })
    root.querySelector('#btn-export').onclick = onExport
    armButton(root.querySelector('#btn-reset'), '確定清除？星星和混淆紀錄會歸零，認得與難度設定保留', onResetProgress)
    root.querySelector('#file-import').onchange = e => {
      const f = e.target.files[0]
      if (!f) return
      const reader = new FileReader()
      reader.onload = () => onImport(String(reader.result))
      reader.readAsText(f)
    }
  }
  root.querySelectorAll('[data-remove]').forEach(btn => {
    armButton(btn, '確定刪除？連進度一起刪', () => onRemoveProfile(btn.dataset.remove))
  })
}

function panelMessage (root, text) {
  const el = root.querySelector('#panel-msg')
  if (el) el.textContent = text
}

// ===== check.js =====
// 發音檢查台（家長用）：依序播放 37 個符號、逐個標記問題、測語音辨識。
// 標記存在 settings.audioIssues = { 符號: '備註' }，家長區頂端會列出來。


function renderCheck (root, { audio, settings, onSettings, onClose }) {
  const issues = settings.audioIssues || {}
  let playing = false
  let stopFlag = false
  let recTarget = SYMBOLS[0]

  root.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>發音檢查 <small>37 個符號＋22 個結合韻＋72 個拼讀字</small></h2>
        <button class="panel-close" id="check-close">回家長區</button>
      </div>
      <div class="panel-row">
        <button id="check-play-all">從頭依序播放</button>
        <button id="check-stop" disabled>停止</button>
        <span class="check-now"><b id="check-now-sym">－</b> <span id="check-now-src"></span></span>
        <span class="panel-msg" id="check-msg"></span>
      </div>
      <p class="panel-hint">點符號單獨播。覺得唸得不對就勾「有問題」，順手寫一句聽起來像什麼。音源寫「錄音」代表播的是教育部官方檔，「合成」代表該符號沒有錄音檔、用語音合成唸代表字。</p>
      <div class="panel-row check-issues" id="check-issues"></div>
      <div class="ptiles check-tiles">${SYMBOLS.map(s => `
        <div class="ptile ctile ${issues[s] !== undefined ? 'red' : 'green'}" data-sym="${s}">
          <button class="ptile-sym" data-play="${s}" title="播放">${s}</button>
          <div class="ptile-hist" data-src="${s}">音源：查詢中</div>
          <div class="ptile-hist">代表字：${(settings.repChar && settings.repChar[s]) || REP_CHAR[s]}</div>
          <label class="ptile-known"><input type="checkbox" data-issue="${s}" ${issues[s] !== undefined ? 'checked' : ''}> 有問題</label>
          <input class="ptile-rep check-note" data-note="${s}" placeholder="像什麼" value="${issues[s] || ''}" ${issues[s] === undefined ? 'disabled' : ''}>
        </div>`).join('')}
      </div>
      <div class="panel-row check-rec">
        <b>辨識測試</b>
        ${speechAvailable() ? `
          <label>符號 <select id="rec-sym">${SYMBOLS.map(s => `<option value="${s}">${s}</option>`).join('')}</select></label>
          <button id="rec-go">按一下開始唸</button>
          <span id="rec-result">聽到的字會顯示在這裡，判定用同音字表：<code id="rec-accept"></code></span>`
          : '<span>這個瀏覽器沒有語音辨識，「唸給狗狗聽」在這裡不會出現。</span>'}
      </div>
    </div>`

  const nowSym = root.querySelector('#check-now-sym')
  const nowSrc = root.querySelector('#check-now-src')
  const playAllBtn = root.querySelector('#check-play-all')
  const stopBtn = root.querySelector('#check-stop')

  function renderIssues () {
    const list = Object.entries(issues)
    root.querySelector('#check-issues').innerHTML = list.length
      ? '<b>問題清單</b>' + list.map(([s, note]) => `<span class="issue-chip">${s}${note ? '：' + note : ''}</span>`).join('') +
        `<button id="check-copy">複製清單</button>`
      : '<span>目前沒有標記任何問題。</span>'
    const copy = root.querySelector('#check-copy')
    if (copy) {
      copy.onclick = () => {
        const text = list.map(([s, note]) => s + (note ? '：' + note : '')).join('\n')
        navigator.clipboard.writeText(text).then(() => { root.querySelector('#check-msg').textContent = '已複製' })
      }
    }
  }
  renderIssues()

  function saveIssues () {
    onSettings({ ...settings, audioIssues: { ...issues } })
  }

  // 每個符號查一次有沒有錄音檔
  SYMBOLS.forEach(async s => {
    const src = await audio.sourceOf(s)
    const el = root.querySelector(`[data-src="${s}"]`)
    if (el) el.textContent = '音源：' + (src === 'recording' ? '錄音' : '合成')
  })

  async function playOne (s) {
    nowSym.textContent = s
    nowSrc.textContent = (await audio.sourceOf(s)) === 'recording' ? '錄音' : '合成（唸「' + ((settings.repChar && settings.repChar[s]) || REP_CHAR[s]) + '」）'
    root.querySelectorAll('.ctile.playing').forEach(t => t.classList.remove('playing'))
    const tile = root.querySelector(`.ctile[data-sym="${s}"]`)
    if (tile) { tile.classList.add('playing'); tile.scrollIntoView({ block: 'nearest' }) }
    await audio.say(s)
  }

  root.querySelectorAll('[data-play]').forEach(b => { b.onclick = () => { if (!playing) playOne(b.dataset.play) } })

  playAllBtn.onclick = async () => {
    if (playing) return
    playing = true
    stopFlag = false
    playAllBtn.disabled = true
    stopBtn.disabled = false
    for (const s of SYMBOLS) {
      if (stopFlag) break
      await playOne(s)
      await new Promise(r => setTimeout(r, 700))
    }
    playing = false
    playAllBtn.disabled = false
    stopBtn.disabled = true
    root.querySelectorAll('.ctile.playing').forEach(t => t.classList.remove('playing'))
  }
  stopBtn.onclick = () => { stopFlag = true; audio.stop() }

  root.querySelectorAll('[data-issue]').forEach(cb => {
    cb.onchange = () => {
      const s = cb.dataset.issue
      const note = root.querySelector(`[data-note="${s}"]`)
      const tile = root.querySelector(`.ctile[data-sym="${s}"]`)
      if (cb.checked) { issues[s] = note.value.trim(); note.disabled = false; tile.classList.replace('green', 'red') } else { delete issues[s]; note.disabled = true; tile.classList.replace('red', 'green') }
      saveIssues()
      renderIssues()
    }
  })
  root.querySelectorAll('[data-note]').forEach(inp => {
    inp.onchange = () => {
      const s = inp.dataset.note
      if (issues[s] === undefined) return
      issues[s] = inp.value.trim()
      saveIssues()
      renderIssues()
    }
  })

  // 辨識測試
  const recSel = root.querySelector('#rec-sym')
  if (recSel) {
    const acceptEl = root.querySelector('#rec-accept')
    const showAccept = () => { acceptEl.textContent = SPEAK_ACCEPT[recTarget] || '' }
    recSel.onchange = () => { recTarget = recSel.value; showAccept() }
    showAccept()
    root.querySelector('#rec-go').onclick = async () => {
      const btn = root.querySelector('#rec-go')
      const out = root.querySelector('#rec-result')
      btn.disabled = true
      btn.textContent = '聽著…現在唸'
      const l = createListener()
      l.start()
      const { status, transcripts: heard } = await l.next(5000)
      l.stop()
      btn.disabled = false
      btn.textContent = '按一下開始唸'
      const ok = matchesSymbol(recTarget, heard)
      out.innerHTML = `聽到：${heard.length ? heard.map(h => '「' + h + '」').join(' ') : '（' + ({ silent: '沒聽到聲音', denied: '麥克風被封鎖', network: '辨識服務連不上', unavailable: '沒有語音辨識' }[status] || '沒聽到') + '）'}　→ <b style="color:${ok ? '#268F58' : '#B32B37'}">${ok ? '判對' : '判錯'}</b>`
    }
  }

  root.querySelector('#check-close').onclick = () => { stopFlag = true; audio.stop(); onClose() }
}

// ===== main.js =====
// 把所有模組接起來：使用者、狀態、出題、三種玩法、畫面切換。


const SETTINGS_KEY = 'zhuyin-rescue-settings'
const MEMORY_PAIRS = 5
// 每個玩法練哪一軌：聽（釣魚、打地鼠、翻牌）、讀（唸給狗狗聽）、寫（寫給狗狗看）
const TRACK_OF = { fishing: 'listen', whack: 'listen', memory: 'listen', speak: 'read', write: 'write' }
// 唸給狗狗聽的狀態訊息，寫給旁邊的大人看
const MIC_MSG = {
  silent: '沒聽到聲音，靠近一點再唸一次',
  denied: '麥克風被封鎖了：按網址列左邊的鎖頭或圖示，把麥克風改成「允許」，再重新整理',
  network: '語音辨識要連網才能用，請確認網路',
  unavailable: '這個瀏覽器沒有語音辨識，請用 Chrome',
}

function loadSettings () {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {} } catch (err) { return {} }
}
function saveSettings (s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)) }

function main () {
  const stage = document.getElementById('stage')
  fitStage(stage)
  window.addEventListener('resize', () => fitStage(stage))

  const store = createStore(localStorage)
  let settings = loadSettings()
  const audio = createAudio(() => settings)

  let profile = null
  let state = null

  const profilesEl = document.getElementById('screen-profiles')
  const homeEl = document.getElementById('screen-home')
  const gameEl = document.getElementById('screen-game')
  const resultEl = document.getElementById('screen-result')
  const panelEl = document.getElementById('screen-panel')

  // ---- 選人 ----
  function goProfiles () {
    renderProfiles(profilesEl, {
      profiles: store.loadProfiles(),
      onPick (id) { audio.unlock(); pickProfile(id) },
      onAdd (info) { audio.unlock(); const p = store.addProfile(info); pickProfile(p.id) },
      onGear: gearTap,
    })
    showScreen('profiles')
  }

  function pickProfile (id) {
    const profiles = store.loadProfiles()
    profile = profiles.list.find(p => p.id === id)
    if (!profile) return goProfiles()
    store.setCurrent(id)
    state = store.load(id)
    goHome()
  }

  // ---- 首頁 ----
  function goHome () {
    destroyGame()
    renderHome(homeEl, { profile, speech: speechAvailable() })
    homeEl.querySelector('#btn-who').addEventListener('pointerdown', goProfiles)
    homeEl.querySelectorAll('[data-game]').forEach(card => {
      card.addEventListener('pointerdown', () => { audio.unlock(); startGame(card.dataset.game) })
    })
    homeEl.querySelector('#btn-gear').addEventListener('pointerdown', gearTap)
    showScreen('home')
  }

  // 齒輪 2 秒內連點三下才開大人面板。每點一下齒輪旁顯示還差幾下，讓大人知道它沒壞。
  let gearTaps = []
  let gearHintTimer = null
  function gearTap (e) {
    const now = Date.now()
    gearTaps = gearTaps.filter(t => now - t < 2000)
    gearTaps.push(now)
    if (gearTaps.length >= 3) { gearTaps = []; hideGearHint(); openPanel(); return }
    const gear = e.currentTarget
    let hint = gear.parentElement.querySelector('.gear-hint')
    if (!hint) {
      hint = document.createElement('div')
      hint.className = 'gear-hint'
      gear.parentElement.appendChild(hint)
    }
    hint.textContent = '再點 ' + (3 - gearTaps.length) + ' 下進家長區'
    clearTimeout(gearHintTimer)
    gearHintTimer = setTimeout(hideGearHint, 2000)
  }
  function hideGearHint () {
    document.querySelectorAll('.gear-hint').forEach(el => el.remove())
  }

  // ---- 遊戲共用 ----
  const playArea = gameEl.querySelector('.play-area')
  const starsEl = gameEl.querySelector('.progress-stars')
  const replayBtn = gameEl.querySelector('#btn-replay')
  let game = null
  let kind = null
  let earned = []
  let starTotal = 5

  function setStars () {
    starsEl.innerHTML = ''
    for (let i = 0; i < starTotal; i++) {
      const s = document.createElement('span')
      s.className = 'star' + (i < earned.length ? (earned[i] ? ' lit' : ' dim') : '')
      s.textContent = '★'
      starsEl.appendChild(s)
    }
  }

  function destroyGame () {
    clearIdle()
    if (game) game.destroy()
    game = null
    if (listener) { listener.stop(); listener = null }
    audio.stop()
  }

  function startGame (which) {
    destroyGame()
    kind = which
    earned = []
    showScreen('game')
    if (which === 'memory') return runMemory()
    if (which === 'speak') return runSpeak()
    runQuestions(which)
  }

  gameEl.querySelector('#btn-quit').addEventListener('pointerdown', () => { busy = false; clearIdle(); goHome() })

  // 記到目前玩法那一軌
  function commit (answer) {
    const track = TRACK_OF[kind]
    state = applyTrack(state, track, recordAnswer(trackView(state, track), answer))
    store.save(profile.id, state)
  }
  function currentView () { return trackView(state, TRACK_OF[kind]) }

  function finishRound () {
    destroyGame()
    renderResult(resultEl, profile.color)
    resultEl.querySelector('#btn-again').addEventListener('pointerdown', () => startGame(kind))
    resultEl.querySelector('#btn-home').addEventListener('pointerdown', goHome)
    showScreen('result')
    audio.cheer()
    playResult(resultEl, earned)
  }

  // ---- 釣魚、打地鼠：聽音選形 ----
  let round = []
  let index = 0
  let firstAttempt = true
  let askedAt = 0
  let busy = false
  let idleTimer = null

  function clearIdle () { clearTimeout(idleTimer); idleTimer = null }

  // 發呆太久：重唸一次、正確的晃一下。之後每隔同樣秒數再來一次。
  function armIdle (q, myIndex, myGame) {
    clearIdle()
    if (!q.idleHint) return
    idleTimer = setTimeout(async () => {
      if (index !== myIndex || game !== myGame || busy) return
      await audio.say(q.target)
      if (index !== myIndex || game !== myGame) return
      game.hint()
      armIdle(q, myIndex, myGame)
    }, q.idleHint * 1000)
  }

  function runQuestions (which) {
    if (which === 'whack') game = createWhack(playArea, { color: profile.color })
    else if (which === 'write') game = createWrite(playArea, { color: profile.color })
    else game = createFishing(playArea, { color: profile.color })
    replayBtn.classList.remove('hidden')
    // 寫字只出單一符號；低階級描寫、高階級聽寫
    const v = currentView()
    round = which === 'write' ? buildRound(singleSymbolState(v), Math.random) : buildRound(v, Math.random)
    index = 0
    starTotal = round.length
    setStars()
    game.onAnswer(onPick)
    askQuestion()
  }

  // 聲音一出來就開放點擊，不等唸完。一開始沒有提示，發呆太久才提示。
  async function askQuestion () {
    const q = round[index]
    const myIndex = index
    const myGame = game
    firstAttempt = true
    clearIdle()
    busy = true
    game.start(q, { isTrace: kind === 'write' && effectiveTier(currentView()) <= 1 })
    game.lock()
    await wait(350)
    let opened = false
    const open = () => {
      if (opened || index !== myIndex || game !== myGame) return
      opened = true
      game.unlock()
      askedAt = Date.now()
      busy = false
    }
    await audio.say(q.target, { onStart: open })
    open()
    if (index === myIndex && game === myGame) armIdle(q, myIndex, myGame)
  }

  replayBtn.addEventListener('pointerdown', () => {
    if (kind === 'memory' || kind === 'speak' || !round[index]) return
    if (busy) return
    audio.say(round[index].target)
  })

  async function onPick (symbol) {
    if (busy) return
    const q = round[index]
    const ms = Date.now() - askedAt
    // 描寫沒蓋好：不算錯，晃一下讓她再寫
    if (symbol === '__miss__') { audio.wrong(); game.shake(); game.sad(); return }
    // 聽寫辨識不出是哪個：算錯但不記混淆對，答案會顯示在板子上讓她照著寫
    if (symbol === '__unknown__') {
      if (firstAttempt) { commit({ target: q.target, ok: false, picked: null, ms, drill: q.drill }); firstAttempt = false }
      audio.wrong(); game.shake(); game.sad()
      const myIndex = index; const myGame = game
      setTimeout(async () => { if (index !== myIndex || game !== myGame) return; await audio.say(q.target) }, 500)
      return
    }
    if (symbol === q.target) {
      busy = true
      clearIdle()
      game.lock()
      if (firstAttempt) commit({ target: q.target, ok: true, picked: symbol, ms, drill: q.drill })
      earned.push(firstAttempt)
      setStars()
      audio.stop()
      if (kind === 'whack') audio.crunch(); else if (kind === 'write') audio.ding(); else audio.splash()
      await game.celebrate(symbol)
      if (!game) return // 中途按了回首頁
      audio.ding()
      await wait(250)
      if (!game) return
      index++
      if (index >= round.length) return finishRound()
      askQuestion()
      return
    }
    // 答錯：第一次才記錄；錯的晃、狗狗歪頭、重唸一次。不顯示答案，她自己再選。
    if (firstAttempt) {
      commit({ target: q.target, ok: false, picked: symbol, ms, drill: q.drill })
      firstAttempt = false
    }
    audio.wrong()
    game.shake(symbol)
    game.sad()
    const myIndex = index
    const myGame = game
    setTimeout(async () => {
      if (index !== myIndex || game !== myGame) return
      await audio.say(q.target)
      if (index !== myIndex || game !== myGame) return
      armIdle(q, myIndex, myGame)
    }, 500)
  }

  // ---- 唸給狗狗聽（讀）：她看符號自己唸，遊戲不先播音。每題判完狗狗唸一次答案。只記唸對。 ----
  let speakTries = 0
  let listener = null
  function runSpeak () {
    game = createSpeak(playArea, { color: profile.color })
    replayBtn.classList.add('hidden') // 讀的練習不給聽
    // 麥克風只問一次：整局開一條連續辨識，不每題重開
    if (listener) listener.stop()
    listener = createListener()
    listener.start()
    // 先主動要一次權限，被擋就直接告訴大人，不用等她按
    const myGame = game
    requestMic().then(result => {
      if (game !== myGame) return
      if (result === 'denied') { game.notice(MIC_MSG.denied); game.setMicEnabled(false) }
    })
    round = buildRound(currentView(), Math.random)
    index = 0
    starTotal = round.length
    setStars()
    game.onMic(onMicPressed)
    askSpeak()
  }

  async function askSpeak () {
    const q = round[index]
    speakTries = 0
    firstAttempt = true
    busy = true
    game.show(q.target)
    await wait(400)
    busy = false
  }

  async function onMicPressed () {
    if (busy || !game) return
    const q = round[index]
    const myGame = game
    busy = true
    audio.stop()
    game.setListening(true)
    const { status, transcripts } = await listener.next(5000)
    if (game !== myGame) return
    game.setListening(false)
    // 沒聽到聲音、或麥克風／辨識不能用：不算她唸錯，不播答案
    if (status !== 'heard') {
      if (status === 'silent') { game.notice(MIC_MSG.silent, false); game.sad() } else { game.notice(MIC_MSG[status] || MIC_MSG.unavailable); game.setMicEnabled(false) }
      busy = false
      return
    }
    game.heard(transcripts[0] || '')
    if (matchesSymbol(q.target, transcripts)) {
      if (firstAttempt) commit({ target: q.target, ok: true, picked: q.target, ms: 0, drill: q.drill })
      earned.push(firstAttempt)
      setStars()
      audio.ding()
      await game.celebrate()
      if (game !== myGame) return
      await audio.say(q.target) // 對答案：狗狗唸一次正確的
      if (game !== myGame) return
      await wait(200)
      index++
      if (index >= round.length) return finishRound()
      askSpeak()
      return
    }
    // 沒聽出來或唸錯：狗狗歪頭、唸一次答案。兩次沒過就跳下一題，不記錯
    firstAttempt = false
    speakTries++
    game.sad()
    await audio.say(q.target)
    if (game !== myGame) return
    if (speakTries >= 2) {
      earned.push(false)
      setStars()
      await wait(400)
      index++
      if (index >= round.length) return finishRound()
      askSpeak()
      return
    }
    busy = false
  }

  // ---- 翻牌：配對，不記進度 ----
  function runMemory () {
    game = createMemory(playArea)
    replayBtn.classList.add('hidden')
    const symbols = pickSymbols(trackView(state, 'listen'), Math.random, MEMORY_PAIRS)
    starTotal = symbols.length
    setStars()
    game.onFlip(sym => { audio.flip(); audio.say(sym) })
    game.onPair(() => { earned.push(true); setStars(); audio.ding() })
    game.onDone(finishRound)
    game.start(symbols)
  }

  // ---- 大人面板 ----
  let panelTrack = 'listen'
  function openPanel () {
    destroyGame()
    renderPanel(panelEl, {
      profile,
      profiles: store.loadProfiles(),
      state: state ? trackView(state, panelTrack) : null,
      track: panelTrack,
      onTrack (t) { panelTrack = t; openPanel() },
      settings,
      voices: audio.listVoices(),
      onKnownChange (symbol, checked) {
        const known = state.known.filter(s => s !== symbol)
        if (checked) known.push(symbol)
        state = { ...state, known }
        store.save(profile.id, state)
        openPanel()
      },
      onSettings (next) {
        settings = next
        saveSettings(settings)
        openPanel()
      },
      // 階級、最近答題是這一軌的；其他（鎖階、範圔、跳級）三軌共用
      onStateChange (partial) {
        const trackKeys = ['tier', 'recent']
        if (Object.keys(partial).some(k => trackKeys.includes(k))) {
          state = applyTrack(state, panelTrack, { ...trackView(state, panelTrack), ...partial })
        } else {
          state = { ...state, ...partial }
        }
        store.save(profile.id, state)
        openPanel()
      },
      onExport () {
        const blob = new Blob([store.exportJson(state)], { type: 'application/json' })
        const a = document.createElement('a')
        a.href = URL.createObjectURL(blob)
        a.download = 'zhuyin-rescue-' + profile.name + '.json'
        a.click()
      },
      onImport (text) {
        try {
          state = store.importJson(text)
          store.save(profile.id, state)
          openPanel()
        } catch (err) {
          panelMessage(panelEl, '匯入失敗：' + err.message)
        }
      },
      onResetProgress () {
        state = resetProgress(state)
        store.save(profile.id, state)
        openPanel()
      },
      onRemoveProfile (id) {
        store.removeProfile(id)
        if (profile && profile.id === id) {
          profile = null
          state = null
        }
        openPanel()
      },
      onClose () { profile ? goHome() : goProfiles() },
      onSay (symbol) { audio.say(symbol) },
      onCheck: openCheck,
    })
    showScreen('panel')
  }

  // 發音檢查台：借用家長區的畫面容器
  function openCheck () {
    renderCheck(panelEl, {
      audio,
      settings,
      onSettings (next) { settings = next; saveSettings(settings) },
      onClose: openPanel,
    })
    showScreen('panel')
  }

  // 開機：有記住上次的人就直接進首頁，否則選人
  const profiles = store.loadProfiles()
  if (profiles.current && profiles.list.some(p => p.id === profiles.current)) {
    pickProfile(profiles.current)
  } else {
    goProfiles()
  }
}

function wait (ms) { return new Promise(r => setTimeout(r, ms)) }

document.addEventListener('DOMContentLoaded', main)

</script>
</body>
</html>
